[project]
name = "ewallet-source-data-generator"
version = "0.1.0"
description = "Deterministic synthetic source generator (offline and sharded) and its contract tests"
requires-python = ">=3.10,<3.11"
dependencies = [
  "Faker==40.36.0",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pyarrow==25.0.1",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
]

[tool.uv]
package = false
