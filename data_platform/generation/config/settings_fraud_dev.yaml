# Small isolated profile for validating Fraud Generator V1.
n_users: 120
n_merchants: 20
n_devices_per_user: 2
n_transactions: 2400
days_history: 150

generation:
  temporal:
    start_timestamp: "2026-01-01T00:00:00"
    end_timestamp: "2026-05-31T23:59:59"

schema_evolution:
  enabled: true
  cutover_timestamp: "2026-03-15T00:00:00"

skew_ratio_hour: 0.75
skew_ratio_channel: 0.60
duplicate_rate_offline: 0.02
merchant_skew_top_pct: 0.05
merchant_skew_traffic_pct: 0.80
channel_loyal_weight: 0.9

fraud:
  enabled: true
  random_seed: 1042
  prevalence:
    target_rate: 0.04
  scenarios:
    velocity:
      enabled: true
      weight: 0.25
      burst_size: 4
      window_minutes: 5
    amount_anomaly:
      enabled: true
      weight: 0.25
      amount_multiplier_min: 4.0
      amount_multiplier_max: 8.0
    account_takeover:
      enabled: true
      weight: 0.25
      amount_multiplier_min: 1.5
      amount_multiplier_max: 3.0
      change_channel_probability: 0.7
    merchant_burst:
      enabled: true
      weight: 0.25
      burst_size: 5
      window_minutes: 10

base_events_per_min: 50
burst_multiplier: 30
burst_windows: ["12:00-12:20", "17:20-17:40"]
late_arrival_rate: 0.12
late_delay_min_max: [5, 1440]
duplicate_rate_stream: 0.015

random_seed: 42
output_dir: "output/fraud_dev"
