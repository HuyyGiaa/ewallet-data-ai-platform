contract_version: 1
dataset: silver.transactions
layer: silver
description: Canonical cleaned and deduplicated transaction dataset.
storage_location: s3a://silver-zone/transactions
grain: One row per transaction_id.
logical_key:
  - transaction_id
upstream:
  - bronze.transactions
enforced_by:
  - data_platform.quality.validate_silver

columns:
  - {name: transaction_id, type: string, nullable: false}
  - {name: account_id, type: string, nullable: false}
  - {name: user_id, type: string, nullable: false}
  - {name: device_id, type: string, nullable: false}
  - {name: type, type: string, nullable: false}
  - {name: amount, type: double, nullable: false}
  - {name: currency, type: string, nullable: false}
  - {name: status, type: string, nullable: false}
  - {name: channel, type: string, nullable: false}
  - {name: old_balance, type: double, nullable: false}
  - {name: new_balance, type: double, nullable: false}
  - {name: merchant_id, type: string, nullable: true}
  - {name: counterparty_account_id, type: string, nullable: true}
  - {name: timestamp, type: timestamp, nullable: false}
  - {name: ingested_at, type: timestamp, nullable: false}
  - {name: event_date, type: date, nullable: false}

domain_rules:
  - column: type
    allowed_values: [deposit, withdraw, transfer, payment]
    validator_rule: transactions.valid_type
  - column: status
    allowed_values: [success, failed, pending]
    validator_rule: transactions.valid_status
  - column: channel
    allowed_values: [app, web, atm, UNKNOWN]
    validator_rule: transactions.valid_channel
  - column: currency
    allowed_values: [VND]
    validator_rule: transactions.valid_currency

quality_rules:
  - expectation: Dataset is non-empty.
    validator_rule: transactions.non_empty
  - expectation: Required columns contain no null values.
    validator_rule: transactions.required_columns_not_null
  - expectation: transaction_id is unique.
    validator_rule: transactions.duplicate_key
  - expectation: amount is greater than 0.
    validator_rule: transactions.valid_amount
  - expectation: old_balance and new_balance are greater than or equal to 0.
    validator_rule: transactions.valid_balance

conditional_rules:
  - when: type == payment
    require_non_null: [merchant_id]
    validator_rule: transactions.merchant_id_required_for_payment
  - when: type == transfer
    require_non_null: [counterparty_account_id]
    validator_rule: transactions.counterparty_account_id_required_for_transfer

foreign_keys:
  - columns: [user_id]
    references: silver.users.user_id
    nullable: false
    validator_rule: transactions.user_id_exists_in_users
  - columns: [account_id]
    references: silver.accounts.account_id
    nullable: false
    validator_rule: transactions.account_id_exists_in_accounts
  - columns: [device_id]
    references: silver.devices.device_id
    nullable: false
    validator_rule: transactions.device_id_exists_in_devices
  - columns: [merchant_id]
    references: silver.merchants.merchant_id
    nullable: true
    validator_rule: transactions.merchant_id_exists_in_merchants
  - columns: [counterparty_account_id]
    references: silver.accounts.account_id
    nullable: true
    validator_rule: transactions.counterparty_account_id_exists_in_accounts

notes:
  - merchant_id is not globally required.
  - counterparty_account_id is not globally required.
  - UNKNOWN is the normalized Silver value for historical rows without channel.
