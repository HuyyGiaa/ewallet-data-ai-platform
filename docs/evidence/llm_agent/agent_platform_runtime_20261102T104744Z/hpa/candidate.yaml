# Source: llm-agent-platform/templates/observability-stack.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  namespace: ewallet-agents
  labels:
    app.kubernetes.io/part-of: ewallet-llm-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "llm-agent-v1"
data:
  prometheus.yaml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    scrape_configs:
      - job_name: otel-collector
        metrics_path: /metrics
        static_configs: [{targets: ['otel-collector:8889']}]
      - job_name: agentgateway
        metrics_path: /metrics
        static_configs: [{targets: ['agentgateway:15020']}]
      - job_name: vllm
        metrics_path: /metrics
        static_configs: [{targets: ['vllm-primary:8000', 'vllm-fallback:8000']}]
  loki.yaml: |
    auth_enabled: false
    server: {http_listen_port: 3100}
    common:
      path_prefix: /tmp/loki
      storage: {filesystem: {chunks_directory: /tmp/loki/chunks, rules_directory: /tmp/loki/rules}}
      replication_factor: 1
      ring: {kvstore: {store: inmemory}}
    schema_config:
      configs:
        - {from: '2024-01-01', store: tsdb, object_store: filesystem, schema: v13, index: {prefix: index_, period: 24h}}
    limits_config: {retention_period: 24h}
    compactor: {working_directory: /tmp/loki/compactor, retention_enabled: true, delete_request_store: filesystem}
  tempo.yaml: |
    server: {http_listen_port: 3200}
    distributor: {receivers: {otlp: {protocols: {grpc: {endpoint: 0.0.0.0:4317}, http: {endpoint: 0.0.0.0:4318}}}}}
    ingester: {max_block_duration: 5m}
