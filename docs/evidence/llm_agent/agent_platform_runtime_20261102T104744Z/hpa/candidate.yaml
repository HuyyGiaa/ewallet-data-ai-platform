data:
  llm-agent.json: "{\n \"title\": \"E-Wallet LLM + Agent Platform\",\n \"uid\": \"ewallet-llm-agent\",\n \"schemaVersion\": 39,\n \"tags\": [\n  \"ewallet\",\n  \"llm\",\n  \"agent\"\n ],\n \"time\": {\n  \"from\": \"now-1h\",\n  \"to\": \"now\"\n },\n \"refresh\": \"30s\",\n \"templating\": {\n  \"list\": [\n   {\n    \"name\": \"datasource\",\n    \"type\": \"datasource\",\n    \"query\": \"prometheus\"\n   }\n  ]\n },\n \"panels\": [\n  {\n   \"id\": 1,\n   \"type\": \"timeseries\",\n   \"title\": \"API request rate by gateway route and status\",\n   \"description\": \"metric name read from agentgateway v1.7.0\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (gateway, route, status) (rate(agentgateway_requests_total[5m]))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"verified\"\n   }\n  },\n  {\n   \"id\": 2,\n   \"type\": \"timeseries\",\n   \"title\": \"API failures (status >= 400) by route\",\n   \"description\": \"metric name read from agentgateway v1.7.0\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (gateway, route) (rate(agentgateway_requests_total{status=~\\\"4..|5..\\\"}[5m]))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"verified\"\n   }\n  },\n  {\n   \"id\": 3,\n   \"type\": \"timeseries\",\n   \"title\": \"Request latency p95 by route\",\n   \"description\": \"metric name read from agentgateway v1.7.0\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 8,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"histogram_quantile(0.95, sum by (le, route) (rate(agentgateway_request_duration_seconds_bucket[5m])))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"verified\"\n   }\n  },\n  {\n   \"id\": 4,\n   \"type\": \"timeseries\",\n   \"title\": \"MCP tool calls by tool\",\n   \"description\": \"metric name read from agentgateway v1.7.0\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 8,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (resource) (rate(agentgateway_mcp_requests_total{method=\\\"tools/call\\\"}[5m]))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"verified\"\n   }\n  },\n  {\n   \"id\": 5,\n   \"type\": \"timeseries\",\n   \"title\": \"MCP requests by method and server\",\n   \"description\": \"metric name read from agentgateway v1.7.0\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 16,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (server, method) (rate(agentgateway_mcp_requests_total[5m]))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"verified\"\n   }\n  },\n  {\n   \"id\": 6,\n   \"type\": \"timeseries\",\n   \"title\": \"LLM end-to-end latency p95 by model\",\n   \"description\": \"metric name read from agentgateway v1.7.0\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 16,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(agentgateway_gen_ai_server_request_duration_bucket[5m])))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"verified\"\n   }\n  },\n  {\n   \"id\": 7,\n   \"type\": \"timeseries\",\n   \"title\": \"LLM errors by type\",\n   \"description\": \"metric name read from agentgateway v1.7.0\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 24,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (error_type) (rate(agentgateway_gen_ai_server_request_duration_count{error_type!=\\\"\\\"}[5m]))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"verified\"\n   }\n  },\n  {\n   \"id\": 8,\n   \"type\": \"timeseries\",\n   \"title\": \"LLM retries\",\n   \"description\": \"metric name read from agentgateway v1.7.0\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 24,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (route) (rate(agentgateway_retries_total[5m]))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"verified\"\n   }\n  },\n  {\n   \"id\": 9,\n   \"type\": \"timeseries\",\n   \"title\": \"LLM tokens per request (input/output)\",\n   \"description\": \"UNVERIFIED metric name: confirm on /metrics at runtime\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 32,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (gen_ai_token_type) (rate(agentgateway_gen_ai_client_token_usage_sum[5m])) / sum by (gen_ai_token_type) (rate(agentgateway_gen_ai_client_token_usage_count[5m]))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"unverified\"\n   }\n  },\n  {\n   \"id\": 10,\n   \"type\": \"timeseries\",\n   \"title\": \"LLM time to first token p95\",\n   \"description\": \"UNVERIFIED metric name: confirm on /metrics at runtime\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 32,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(agentgateway_gen_ai_server_time_to_first_token_bucket[5m])))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"unverified\"\n   }\n  },\n  {\n   \"id\": 11,\n   \"type\": \"timeseries\",\n   \"title\": \"Agent calls by agent (spanmetrics)\",\n   \"description\": \"UNVERIFIED metric name: confirm on /metrics at runtime\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 40,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (gen_ai_agent_name) (rate(ewallet_traces_span_metrics_calls_total{gen_ai_agent_name!=\\\"\\\"}[5m]))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"unverified\"\n   }\n  },\n  {\n   \"id\": 12,\n   \"type\": \"timeseries\",\n   \"title\": \"Agent/tool failures (spanmetrics)\",\n   \"description\": \"UNVERIFIED metric name: confirm on /metrics at runtime\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 40,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (gen_ai_agent_name, gen_ai_tool_name) (rate(ewallet_traces_span_metrics_calls_total{status_code=\\\"STATUS_CODE_ERROR\\\"}[5m]))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"unverified\"\n   }\n  },\n  {\n   \"id\": 13,\n   \"type\": \"timeseries\",\n   \"title\": \"CPU by pod\",\n   \"description\": \"metric name read from agentgateway v1.7.0\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 48,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\\\"ewallet-agents\\\", container!=\\\"\\\"}[5m]))\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"verified\"\n   }\n  },\n  {\n   \"id\": 14,\n   \"type\": \"timeseries\",\n   \"title\": \"Memory working set by pod\",\n   \"description\": \"metric name read from agentgateway v1.7.0\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 48,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"bytes\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"refId\": \"A\",\n     \"expr\": \"sum by (pod) (container_memory_working_set_bytes{namespace=\\\"ewallet-agents\\\", container!=\\\"\\\"})\"\n    }\n   ],\n   \"ewallet\": {\n    \"metric_status\": \"verified\"\n   }\n  }\n ]\n}\n"
  platform-overview.json: "{\n  \"title\": \"E-Wallet Platform Overview\",\n  \"uid\": \"ewallet-platform-overview\",\n  \"schemaVersion\": 39,\n  \"tags\": [\"ewallet\", \"platform\", \"observability\"],\n  \"time\": {\"from\": \"now-1h\", \"to\": \"now\"},\n  \"refresh\": \"30s\",\n  \"panels\": [\n    {\"id\": 1, \"type\": \"timeseries\", \"title\": \"API request rate\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (route, status) (rate(agentgateway_requests_total[5m]))\"}]},\n    {\"id\": 2, \"type\": \"timeseries\", \"title\": \"API error rate\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum(rate(agentgateway_requests_total{status=~\\\"4..|5..\\\"}[5m])) / sum(rate(agentgateway_requests_total[5m]))\"}]},\n    {\"id\": 3, \"type\": \"timeseries\", \"title\": \"API latency p50 p95 p99\", \"targets\": [{\"refId\": \"A\", \"expr\": \"histogram_quantile(0.50, sum by (le, route) (rate(agentgateway_request_duration_seconds_bucket[5m])))\"}, {\"refId\": \"B\", \"expr\": \"histogram_quantile(0.95, sum by (le, route) (rate(agentgateway_request_duration_seconds_bucket[5m])))\"}, {\"refId\": \"C\", \"expr\": \"histogram_quantile(0.99, sum by (le, route) (rate(agentgateway_request_duration_seconds_bucket[5m])))\"}]},\n    {\"id\": 4, \"type\": \"timeseries\", \"title\": \"Container CPU\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\\\"\\\"}[5m]))\"}]},\n    {\"id\": 5, \"type\": \"timeseries\", \"title\": \"Container memory\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (namespace, pod) (container_memory_working_set_bytes{container!=\\\"\\\"})\"}]},\n    {\"id\": 6, \"type\": \"timeseries\", \"title\": \"Container network\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (namespace, pod) (rate(container_network_receive_bytes_total[5m]) + rate(container_network_transmit_bytes_total[5m]))\"}]},\n    {\"id\": 7, \"type\": \"timeseries\", \"title\": \"Container filesystem\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (namespace, pod) (container_fs_usage_bytes{container!=\\\"\\\"})\"}]},\n    {\"id\": 8, \"type\": \"timeseries\", \"title\": \"Pod restarts\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[1h]))\"}]},\n    {\"id\": 9, \"type\": \"stat\", \"title\": \"OOMKilled containers\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum(kube_pod_container_status_last_terminated_reason{reason=\\\"OOMKilled\\\"})\"}]},\n    {\"id\": 10, \"type\": \"timeseries\", \"title\": \"Resource requests and limits\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (namespace, resource) (kube_pod_container_resource_requests)\"}, {\"refId\": \"B\", \"expr\": \"sum by (namespace, resource) (kube_pod_container_resource_limits)\"}]}\n  ]\n}\n"
  llm-runtime.json: "{\n  \"title\": \"E-Wallet LLM Runtime\",\n  \"uid\": \"ewallet-llm-runtime\",\n  \"schemaVersion\": 39,\n  \"tags\": [\"ewallet\", \"llm\", \"vllm\"],\n  \"time\": {\"from\": \"now-1h\", \"to\": \"now\"},\n  \"panels\": [\n    {\"id\": 1, \"type\": \"timeseries\", \"title\": \"Input and output tokens\", \"telemetryStatus\": \"runtime-pending\", \"description\": \"Native vLLM metrics; verify labels against the deployed 0.32.0 runtime.\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum(rate(vllm:prompt_tokens_total[5m]))\"}, {\"refId\": \"B\", \"expr\": \"sum(rate(vllm:generation_tokens_total[5m]))\"}]},\n    {\"id\": 2, \"type\": \"timeseries\", \"title\": \"Time to first token p95\", \"telemetryStatus\": \"runtime-pending\", \"description\": \"Native vLLM histogram; no client-side substitute is claimed.\", \"targets\": [{\"refId\": \"A\", \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))\"}]},\n    {\"id\": 3, \"type\": \"timeseries\", \"title\": \"End-to-end latency p95\", \"telemetryStatus\": \"runtime-pending\", \"description\": \"Native vLLM histogram.\", \"targets\": [{\"refId\": \"A\", \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket[5m])))\"}]},\n    {\"id\": 4, \"type\": \"timeseries\", \"title\": \"Running and waiting requests\", \"telemetryStatus\": \"runtime-pending\", \"description\": \"Native vLLM gauges.\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum(vllm:num_requests_running)\"}, {\"refId\": \"B\", \"expr\": \"sum(vllm:num_requests_waiting)\"}]},\n    {\"id\": 5, \"type\": \"timeseries\", \"title\": \"LLM errors and retries\", \"telemetryStatus\": \"source-verified\", \"description\": \"Metric names were read from the pinned agentgateway binary.\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (error_type) (rate(agentgateway_gen_ai_server_request_duration_count{error_type!=\\\"\\\"}[5m]))\"}, {\"refId\": \"B\", \"expr\": \"sum(rate(agentgateway_retries_total[5m]))\"}]},\n    {\"id\": 6, \"type\": \"timeseries\", \"title\": \"CPU and memory\", \"telemetryStatus\": \"source-verified\", \"description\": \"Standard cAdvisor series scoped to vLLM.\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum(rate(container_cpu_usage_seconds_total{pod=~\\\"vllm-.*\\\",container=\\\"vllm\\\"}[5m]))\"}, {\"refId\": \"B\", \"expr\": \"sum(container_memory_working_set_bytes{pod=~\\\"vllm-.*\\\",container=\\\"vllm\\\"})\"}]}\n  ]\n}\n"
  agent-mcp.json: "{\n  \"title\": \"E-Wallet Agent & MCP\",\n  \"uid\": \"ewallet-agent-mcp\",\n  \"schemaVersion\": 39,\n  \"tags\": [\"ewallet\", \"agent\", \"mcp\"],\n  \"time\": {\"from\": \"now-1h\", \"to\": \"now\"},\n  \"panels\": [\n    {\"id\": 1, \"type\": \"timeseries\", \"title\": \"Agent executions\", \"telemetryStatus\": \"runtime-pending\", \"description\": \"Span-metric agent attributes require runtime trace readback.\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (gen_ai_agent_name) (rate(ewallet_traces_span_metrics_calls_total{gen_ai_agent_name!=\\\"\\\"}[5m]))\"}]},\n    {\"id\": 2, \"type\": \"timeseries\", \"title\": \"MCP calls by tool\", \"telemetryStatus\": \"source-verified\", \"description\": \"Gateway transport count plus application semantic outcome count.\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (resource) (rate(agentgateway_mcp_requests_total{method=\\\"tools/call\\\"}[5m]))\"}, {\"refId\": \"B\", \"expr\": \"sum by (tool, outcome) (rate(ewallet_mcp_tool_calls_total[5m]))\"}]},\n    {\"id\": 3, \"type\": \"timeseries\", \"title\": \"MCP tool latency p95\", \"telemetryStatus\": \"runtime-pending\", \"description\": \"Application OTel histogram.\", \"targets\": [{\"refId\": \"A\", \"expr\": \"histogram_quantile(0.95, sum by (le, tool) (rate(ewallet_mcp_tool_duration_seconds_bucket[5m])))\"}]},\n    {\"id\": 4, \"type\": \"timeseries\", \"title\": \"MCP semantic failures\", \"telemetryStatus\": \"runtime-pending\", \"description\": \"Counts isError=true and non-ok structured status even when HTTP is 200.\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (tool) (rate(ewallet_mcp_tool_calls_total{outcome=\\\"error\\\"}[5m]))\"}]},\n    {\"id\": 5, \"type\": \"timeseries\", \"title\": \"Agent and tool failures from traces\", \"telemetryStatus\": \"runtime-pending\", \"description\": \"Requires trace readback to confirm kagent attributes.\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (gen_ai_agent_name, gen_ai_tool_name) (rate(ewallet_traces_span_metrics_calls_total{status_code=\\\"STATUS_CODE_ERROR\\\"}[5m]))\"}]}\n  ]\n}\n"
