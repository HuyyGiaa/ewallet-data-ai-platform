# Source: llm-agent-platform/templates/otel-collector.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: ewallet-agents
  labels:
    app.kubernetes.io/part-of: ewallet-llm-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "llm-agent-v1"
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      # Remove credentials and direct identifiers before anything is exported.
      attributes/redact:
        actions:
          - {key: http.request.header.authorization, action: delete}
          - {key: http.request.header.cookie, action: delete}
          - {key: http.request.header.x-ewallet-actor, action: delete}
          - {key: gen_ai.prompt, action: delete}
          - {key: gen_ai.completion, action: delete}
          - {key: gen_ai.input.messages, action: delete}
          - {key: gen_ai.output.messages, action: delete}
          - {key: user.id, action: hash}
          - {key: enduser.id, action: hash}
      # Mask card numbers, emails and phone numbers left in any attribute value.
      redaction:
        allow_all_keys: true
        blocked_values:
          - '\b(?:\d[ -]?){13,19}\b'
          - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
          - '\+?84\d{9,10}\b'
        summary: info
      batch:
        send_batch_size: 512
        timeout: 5s
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: ewallet
        resource_to_telemetry_conversion:
          enabled: true
      debug:
        verbosity: basic
      otlp/traces:
        endpoint: tempo.ewallet-agents.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/logs:
        endpoint: http://loki.ewallet-agents.svc.cluster.local:3100/otlp
        tls:
          insecure: true
    connectors:
      # Calls, errors and latency per service and span from traces: agent runs
      # (kagent spans) and tool calls become countable even where no gateway
      # metric carries the agent name.
      spanmetrics:
        dimensions:
          - name: gen_ai.agent.name
          - name: gen_ai.tool.name
        exemplars:
          enabled: false
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      telemetry:
        logs:
          encoding: json
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, redaction, batch]
          exporters: [otlp/traces, spanmetrics]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, redaction, batch]
          exporters: [otlphttp/logs]
