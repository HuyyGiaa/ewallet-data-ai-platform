---
# Source: llm-agent-platform/templates/cross-namespace.yaml
# The existing gateway remains in ewallet-agents; only its backend moves.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp-gateway-to-drift-mcp-cross-namespace-egress
  namespace: ewallet-agents
  labels:
    app.kubernetes.io/part-of: ewallet-llm-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "llm-agent-v1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ewallet-mcp}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: drift-mcp
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 15008}
