  # must fit before the rollout is declared stuck (default 600 s).
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/instance: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/instance: primary
        llm.ewallet.io/backend-version: primary
    spec:
      serviceAccountName: vllm
      automountServiceAccountToken: false
      # Keeps LLM serving off nodes it was not budgeted for (O1: the nodes added
      # for the session, never the MLOps nodes). No tolerations, no PriorityClass.
      nodeSelector:
        ewallet.io/g3-llm: "true"
      # Service links inject VLLM_*-prefixed variables that vLLM parses as its own config.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      # Pod Security Baseline: no added capabilities and no Unconfined seccomp.
      # SYS_NICE/Unconfined only enable optional vLLM CPU NUMA tuning.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/vllm-cpu-model@sha256:f695b23efa8145ae5cb57a1873863879927ab4805e70e5eee1a71a2063edd07c
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - "/models/Qwen3-0.6B/c1899de289a04d12100db370d81485cdf75e47ca"
            - --served-model-name
            - "ewallet-fraud-llm-v1"
            - --dtype
            - bfloat16
            - --max-model-len
            - "4096"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - "hermes"
            # Keeps model reasoning out of message content (it is never shown to callers).
            - --reasoning-parser
            - "qwen3"
            - --default-chat-template-kwargs
            - "{\"enable_thinking\":false}"
            - --max-num-seqs
            - "4"
            - --max-num-queued-reqs
            - "8"
            - --enable-prefix-caching
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: api-key
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "2"
            - name: VLLM_CPU_NUM_OF_RESERVED_CPU
              value: "1"
            # The container sees every host core; bound the OpenMP pool to the CPU limit.
            - name: OMP_NUM_THREADS
              value: "2"
            # 'auto' (G1) bound inference to one logical core (core ids=[2],
            # reserved [3]) on e2-standard-4; a range pins the OpenMP pool.
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: "0-1"
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
          ports:
            - name: http
              containerPort: 8000
          # Warm start: the pod only takes traffic after one real tool-shaped
          # completion. Measured locally, the first request after start took
          # 122 s on CPU and the next one 10 s.
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import json, os, urllib.request
                  # Shaped like a real tool call (system prompt + described tool,
                          # ~200 prompt tokens): on CPU the first request of a new
                          # shape took 190 s on GKE (G1 run 5) after a 16-token warm-up.
                  body = {"model": "ewallet-fraud-llm-v1", "max_tokens": 32, "temperature": 0,
                          "messages": [
                              {"role": "system", "content": "You are in a test environment. Use the provided feature_lookup tool; never invent real fraud data."},
                              {"role": "user", "content": "Use feature_lookup for transaction tx-warmup-001, then summarize the returned fixture."}],
                          "tools": [{"type": "function", "function": {"name": "feature_lookup",
                              "description": "Retrieve a test transaction feature fixture.", "parameters": {
                              "type": "object", "properties": {"transaction_id": {"type": "string"}},
                              "required": ["transaction_id"], "additionalProperties": False}}}],
                          "tool_choice": "required"}
                  request = urllib.request.Request("http://127.0.0.1:8000/v1/chat/completions",
                      data=json.dumps(body).encode(), method="POST", headers={
                          "Content-Type": "application/json",
                          "Authorization": "Bearer " + os.environ["VLLM_API_KEY"]})
                  urllib.request.urlopen(request, timeout=240).read()
            periodSeconds: 10
            timeoutSeconds: 245
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: "3"
              memory: 10Gi
            requests:
              cpu: "2"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: cache, mountPath: /root/.cache}
            - {name: tmp, mountPath: /tmp}
            # vLLM's engine message queue needs more than the 64 MiB default /dev/shm.
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: cache
          emptyDir: {sizeLimit: 8Gi}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
