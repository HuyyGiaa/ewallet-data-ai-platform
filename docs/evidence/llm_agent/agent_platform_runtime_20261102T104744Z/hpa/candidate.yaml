apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway-config
  namespace: ewallet-agents
  labels:
    app.kubernetes.io/part-of: ewallet-llm-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "llm-agent-v1"
data:
  config.yaml: |

    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    config:
      logging:
        format: json
    gateways:
      default:
        port: 8080
    routes:
    - name: drift-mcp
      matches:
      - path:
          pathPrefix: /drift/mcp
      policies:
        timeout:
          requestTimeout: 25s
        localRateLimit:
        - maxTokens: 20
          tokensPerFill: 20
          fillInterval: 1s
          type: requests
        # Client-supplied identity headers and credentials never reach a server
        # (the 2026-10-31 local smoke showed a client Authorization header passing
        # through). Only mesh-identity mode reconstructs a caller header; Ambient
        # mode leaves it absent and authenticates the backend service token.
        requestHeaderModifier:
          remove:
          - authorization
          - x-ewallet-actor
          - x-ewallet-caller
        mcpAuthorization:
          rules:
          - 'true'
      backends:
      - mcp:
          targets:
          - name: drift
            mcp:
              host: http://drift-mcp.ewallet-mcp.svc.cluster.local:8080/mcp
    - name: feature-rag-mcp
      matches:
      - path:
          pathPrefix: /feature-rag/mcp
      policies:
        timeout:
          requestTimeout: 25s
        localRateLimit:
        - maxTokens: 20
          tokensPerFill: 20
          fillInterval: 1s
          type: requests
        # Client-supplied identity headers and credentials never reach a server
        # (the 2026-10-31 local smoke showed a client Authorization header passing
        # through). Only mesh-identity mode reconstructs a caller header; Ambient
        # mode leaves it absent and authenticates the backend service token.
        requestHeaderModifier:
          remove:
          - authorization
          - x-ewallet-actor
          - x-ewallet-caller
        mcpAuthorization:
          rules:
          - 'true'
      backends:
      - mcp:
          targets:
          - name: feature-rag
            mcp:
              host: http://feature-rag-mcp.ewallet-mcp.svc.cluster.local:8080/mcp
