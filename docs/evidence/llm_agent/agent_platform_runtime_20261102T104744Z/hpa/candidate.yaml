# Source: llm-agent-platform/templates/agents.yaml
# Agents reach MCP tools only through the policy-only MCP Gateway.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: drift-mcp
  namespace: ewallet-agents
  labels:
    app.kubernetes.io/part-of: ewallet-llm-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "llm-agent-v1"
spec:
  description: "drift-mcp via the MCP Gateway"
  url: "http://mcp-gateway.ewallet-agents.svc:8080/drift/mcp"
  # The kagent controller's own list-only credential (tool discovery for this
  # RemoteMCPServer); the server never lets it call a tool.
  headersFrom:
    - name: X-Ewallet-MCP-Service-Token
      valueFrom:
        type: Secret
        name: mcp-token-kagent-controller-drift-mcp-r1-release1
        key: token
  protocol: STREAMABLE_HTTP
  timeout: 30s
  terminateOnClose: true
---
