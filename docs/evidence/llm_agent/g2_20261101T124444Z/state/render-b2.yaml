# Source: llm-agent-platform/templates/agentgateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: ewallet-agents
  labels:
    app.kubernetes.io/part-of: ewallet-llm-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "llm-agent-v1"
    app.kubernetes.io/name: agentgateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: agentgateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agentgateway}
    spec:
      serviceAccountName: agentgateway
      automountServiceAccountToken: false
      # Keeps LLM serving off nodes it was not budgeted for (O1: the nodes added
      # for the session, never the MLOps nodes). No tolerations, no PriorityClass.
      nodeSelector:
        ewallet.io/g2-llm: "true"
      containers:
        - name: agentgateway
          image: ghcr.io/agentgateway/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
          imagePullPolicy: IfNotPresent
          args: ["-f", "/config/config.yaml"]
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: api-key
            - name: GATEWAY_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: agentgateway-client-key
                  key: api-key
          ports:
            - {name: entry, containerPort: 4000}
            - {name: llm-internal, containerPort: 3000}
          startupProbe:
            tcpSocket: {port: entry}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket: {port: entry}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: entry}
            periodSeconds: 15
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: agentgateway-llm-config}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
