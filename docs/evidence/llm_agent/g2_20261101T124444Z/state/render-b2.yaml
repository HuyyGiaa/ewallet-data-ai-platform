  unresolved.json: "[{\"gate\":\"Read back the WorkerPool/SandboxAgent pod identity, then declare it as a workload and an enforced flow.\",\"name\":\"agents-to-agentgateway\",\"reason\":\"SandboxAgent egress runs on the Substrate WorkerPool; its pod labels, namespace and ServiceAccount are not source-defined.\",\"to\":\"agentgateway:4000\"},{\"gate\":\"Read back kagent controller and WorkerPool identities.\",\"name\":\"coordinator-to-specialists-native-a2a\",\"reason\":\"Native kagent A2A is served by the kagent controller outside this chart; controller and sandbox identities are not source-defined.\",\"to\":\"kagent-controller:8083 /api/a2a/\\u003cnamespace\\u003e/\\u003cagent\\u003e\"},{\"gate\":\"Read back each WorkerPool's pod ServiceAccount and labels, set mcpGateway.callerServiceAccounts, then declare the worker workloads and enforced flows.\",\"name\":\"agents-to-mcp-gateway\",\"reason\":\"The MCP Gateway and its flows to the MCP servers are source-defined (mcpGateway.enabled), but agent worker pods run on Substrate WorkerPools whose ServiceAccount and labels are not source-definable in Substrate 0.0.9.\",\"to\":\"mcp-gateway:8080\"},{\"gate\":\"Read back the controller labels and add a namespaced ingress/egress pair.\",\"name\":\"a2a-gateway-to-kagent-controller\",\"reason\":\"Cross-namespace flow to the kagent controller; its pod labels come from the kagent chart and this chart only renders same-namespace flows.\",\"to\":\"kagent-controller.kagent:8083\"},{\"gate\":\"ML Platform runtime readback of namespaces, labels and ports.\",\"name\":\"mcp-to-rag-feast-kserve-fraud-scoring\",\"reason\":\"Endpoints live in ML/Data Platform namespaces that are not deployed or contract-pinned for this chart.\",\"to\":\"Feast online store, RAG embedding, KServe fraud-scoring\"},{\"gate\":\"Read back the kagent controller, worker and Prometheus identities, then add their flows.\",\"name\":\"otlp-exporters-to-collector\",\"reason\":\"Chart-owned exporters get enforced flows when otelCollector.enabled; kagent controller/agent workers and Prometheus (another namespace) have no source-defined identity.\",\"to\":\"otel-collector:4317\"},{\"gate\":\"Only for vllm.modelSource.mode=huggingface. The staged mode (checksum-verified read-only PVC, offline vLLM) needs no egress; GCP still needs the PVC source (e.g. GCS FUSE) chosen.\",\"name\":\"vllm-model-bootstrap\",\"reason\":\"vLLM downloads the pinned revision at startup, but NetworkPolicy cannot express an FQDN and a CIDR guess would be a broad egress.\",\"to\":\"huggingface.co:443\"},{\"gate\":\"Define the coordinator A2A backend and read back the Gateway deployment labels and ServiceAccount.\",\"name\":\"external-gateway-to-coordinator\",\"reason\":\"The HTTPRoute backend Service is not defined in source, and the Istio Gateway pod ingress and health-check ports are not opened.\",\"to\":\"fraud-coordinator-a2a:8083\"}]"
