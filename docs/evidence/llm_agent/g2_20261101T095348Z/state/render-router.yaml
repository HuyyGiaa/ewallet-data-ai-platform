---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmd-router-epp
  namespace: ewallet-agents
  labels:
    app.kubernetes.io/name: llmd-router-epp
    app.kubernetes.io/version: "v1.0.0"
    llm-d.ai/igw-mode: llm-d-router-standalone
spec:
  replicas: 1
  strategy:
    # The current recommended EPP deployment pattern is to have a single active replica. This ensures
    # optimal performance of the stateful operations such prefix cache aware scorer.
    # The Recreate strategy the old replica is killed immediately, and allow the new replica(s) to
    # quickly take over. This is particularly important in the high availability set up with leader
    # election, as the rolling update strategy would prevent the old leader being killed because
    # otherwise the maxUnavailable would be 100%.
    #
    # With replicas > 1 this also means the Deployment never reports Available=True,
    # because standby replicas stay NotReady by design. Set router.epp.deploymentStrategy
    # if that blocks your tooling; see "Multi-replica EPP and Helm --wait" in the chart README.
    type: Recreate
  selector:
    matchLabels:
      llm-d-router-standalone: llmd-router-epp
  template:
    metadata:
      labels:
        llm-d-router-standalone: llmd-router-epp
        llm-d.ai/igw-mode: llm-d-router-standalone
      annotations:
        checksum/config: e8c701d5bf50cb01886840f4e657b2fffbe6faaea76493b589fd9f62de112f29
    spec:

      serviceAccountName: llmd-router-epp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Conservatively, this timeout should mirror the longest grace period of the pods within the pool
      terminationGracePeriodSeconds: 130
      containers:
        - name: envoy-proxy
          image: docker.io/envoyproxy/envoy:distroless-v1.33.2@sha256:85500e28ed088ec39ff0adc1be3d358a8ad062926aaa62c36b28bde00919e4e8
          imagePullPolicy: IfNotPresent
          command:
            - "envoy"
          args:
            - "--service-node"
            - "envoy-proxy"
            - "--log-level"
            - "warn"
            - "--cpuset-threads"
            - "--drain-strategy"
            - "immediate"
            - "--drain-time-s"
            - "60"
            - "-c"
            - "/etc/envoy/envoy.yaml"
          env:
          - name: NS_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          ports:
          - containerPort: 8081
            name: http-8081
          - containerPort: 19001
            name: metrics-19001
          readinessProbe:
            failureThreshold: 1
            httpGet:
              path: /ready
              port: 19001
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          # Give endpoint removal time to propagate before SIGTERM.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/envoy
              name: config
              readOnly: true
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0@sha256:024188e998f516879f68532016ca24fabca00afbdcc2af9a61b17634e197df2c
          imagePullPolicy: IfNotPresent
          args:
              - --endpoint-selector
              - "app.kubernetes.io/instance=primary,app.kubernetes.io/name=vllm"
              - --endpoint-target-ports
              - "8000"
              - --zap-encoder
              - "json"
              - --config-file
              - "/config/default-plugins.yaml"
              - --grpc-health-port
              - "9003"
              # Pass additional flags via the router.epp.flags field in values.yaml.
              # Render them as --flag=value so boolean values are parsed correctly.
              - "--v=3"
              - --tracing=false
              - --metrics-endpoint-auth=false
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          ports:
            - name: grpc
              containerPort: 9002
            - name: grpc-health
              containerPort: 9003
            - name: metrics
              containerPort: 9090
          livenessProbe:
            grpc:
              port: 9003
              service: liveness
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
              service: readiness
            periodSeconds: 2
          # Give endpoint removal time to propagate before SIGTERM.
          # Kubelet performs the delay without a shell in the distroless EPP image.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            
          volumeMounts:
            - name: plugins-config-volume
              mountPath: "/config"
        
      volumes:
        - configMap:
            items:
            - key: envoy.yaml
              path: envoy.yaml
            name: 'envoy'
          name: config
        - name: plugins-config-volume
          configMap:
            name: llmd-router-epp
        
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: ewallet.io/g2-llm
                operator: In
                values:
                - "true"
