apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-db1-canary
  namespace: ewallet-mcp
  labels: &id001
    app.kubernetes.io/name: rag-db1-canary
    app.kubernetes.io/component: mcp-server-canary
    ewallet.io/owned-by: edai2-rag-db1-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-db1-canary
  strategy:
    type: Recreate
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: feature-rag-mcp
      automountServiceAccountToken: false
      nodeSelector:
        ewallet.io/g3-llm: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mcp-server
        image: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/mcp-tools@sha256:b80c07c76e4d240328804218c46ff66ecc7e4ba45694072f94774c57548fa058
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - uvicorn
        - --factory
        - ai_platform.llm_agent.tools.service:create_feature_rag_app
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        - --no-access-log
        env:
        - name: EWALLET_GIT_SHA
          value: 642553f40cf395fed06eba52d04f6fa0db3fec94
        - name: EWALLET_IMAGE_DIGEST
          value: sha256:b80c07c76e4d240328804218c46ff66ecc7e4ba45694072f94774c57548fa058
        - name: EWALLET_CONFIG_REVISION
          value: rag-db1-canary/g3-functional-rag-20261102t045700z
        - name: EWALLET_PROMPT_REVISION
          value: v2
        - name: EWALLET_MODEL_REVISION
          value: fraud-detector/1
        - name: EWALLET_FEATURE_REVISION
          value: fraud-policy-feast-v1
        - name: EWALLET_CORPUS_REVISION
          value: fraud-policy-v1-20261030
        - name: EWALLET_TOOL_MAX_CONCURRENCY
          value: '2'
        - name: EWALLET_TOOL_MAX_TIMEOUT_MS
          value: '20000'
        - name: EWALLET_MCP_ALLOWED_ORIGINS
          value: ''
        - name: EWALLET_MCP_MAX_BODY_BYTES
          value: '65536'
        - name: EWALLET_MCP_MAX_INFLIGHT
          value: '4'
        - name: EWALLET_MCP_BODY_TIMEOUT_SECONDS
          value: '10'
        - name: EWALLET_MCP_TOOL_GRANTS
          value: '{"drift-specialist":["feature_lookup"],"feature-rag-specialist":["feature_lookup","fraud_scoring","knowledge_search"]}'
        - name: EWALLET_MCP_DISCOVERY_SUBJECTS
          value: '["kagent-controller"]'
        - name: EWALLET_REDIS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: rag-db1-redis-g3-045700z
              key: connection_string
        - name: EWALLET_MCP_SERVICE_TOKENS
          valueFrom:
            secretKeyRef:
              name: mcp-auth-feature-rag-mcp-r1-transition
              key: auth-config.json
        - name: EWALLET_FEAST_REGISTRY
          value: /feast/fraud/registry.db
        - name: EWALLET_FEAST_REPO_PATH
          value: /workspace/ai_platform/features/feast/online_repo
        - name: EWALLET_KSERVE_BASE_URL
          value: http://fraud-detector-predictor.fraud-serving.svc.cluster.local
        - name: EWALLET_MODEL_NAME
          value: fraud-detector
        - name: EWALLET_MODEL_VERSION
          value: '1'
        - name: EWALLET_RAG_EMBEDDER
          value: local-onnx
        - name: EWALLET_RAG_FEAST_PROJECT
          value: ewallet_rag_campaign
        - name: EWALLET_RAG_FEAST_REGISTRY
          value: /feast/rag/registry.db
        - name: EWALLET_RAG_MANIFEST
          value: /workspace/data/llm_agent/rag/fraud-policy-v1/manifest.json
        - name: EWALLET_RAG_MODEL_CACHE
          value: /opt/hf-cache
        - name: EWALLET_RAG_ONLINE_STORE
          value: redis
        - name: EWALLET_RAG_RETRIEVER
          value: feast-online-exact
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          failureThreshold: 30
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: fraud-registry
          mountPath: /feast/fraud
          readOnly: true
        - name: rag-registry
          mountPath: /feast/rag
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: fraud-registry
        configMap:
          name: feast-registry-fraud-online
      - name: rag-registry
        configMap:
          name: rag-db1-registry-77aaae13
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ambient-probes-rag-db1-canary
  namespace: ewallet-mcp
  labels:
    app.kubernetes.io/name: rag-db1-canary
    app.kubernetes.io/component: mcp-server-canary
    ewallet.io/owned-by: edai2-rag-db1-canary
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rag-db1-canary
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 169.254.7.127/32
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rag-db1-canary-to-feast-redis
  namespace: ewallet-mcp
  labels:
    app.kubernetes.io/name: rag-db1-canary
    app.kubernetes.io/component: mcp-server-canary
    ewallet.io/owned-by: edai2-rag-db1-canary
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rag-db1-canary
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: feature-store
      podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ewallet-mcp-rag-db1-canary-to-feast-redis
  namespace: feature-store
  labels:
    app.kubernetes.io/name: rag-db1-canary
    app.kubernetes.io/component: mcp-server-canary
    ewallet.io/owned-by: edai2-rag-db1-canary
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ewallet-mcp
      podSelector:
        matchLabels:
          app.kubernetes.io/name: rag-db1-canary
    ports:
    - protocol: TCP
      port: 6379
