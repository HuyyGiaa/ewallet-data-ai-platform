---
# Source: ewallet-edge/templates/destination-access.yaml
# Additive: lets only the edge gateway reach this one workload. Existing policies stay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-to-feature-api
  namespace: ml-platform
  labels:
    app.kubernetes.io/part-of: ewallet-edge
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-edge-0.2.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: feature-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ewallet-ingress}
          podSelector:
            matchLabels:
              istio: ewallet-edge-gateway
      ports:
        - {port: 8080, protocol: TCP}
---
# Source: ewallet-edge/templates/destination-access.yaml
# Additive: lets only the edge gateway reach this one workload. Existing policies stay.
