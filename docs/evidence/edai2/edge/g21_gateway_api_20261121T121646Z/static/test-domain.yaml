            matchLabels: {kubernetes.io/metadata.name: ewallet-ingress}
          podSelector:
            matchLabels:
              istio: ewallet-edge-gateway
      ports:
        - {port: 3000, protocol: TCP}
        # Ambient traffic arrives through the HBONE tunnel port.
        - {port: 15008, protocol: TCP}
