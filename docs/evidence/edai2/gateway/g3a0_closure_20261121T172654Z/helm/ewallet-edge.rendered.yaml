# Source: ewallet-edge/templates/gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ewallet-edge
  namespace: ewallet-ingress
  labels:
    app.kubernetes.io/part-of: ewallet-edge
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-edge-0.2.0
spec:
  gatewayClassName: istio
  # Manual deployment: bind to the istio/gateway release's Service. Without an address
  # Istio would create a second Deployment with a LoadBalancer Service.
  addresses:
    - type: Hostname
      value: ewallet-edge-gateway.ewallet-ingress.svc.cluster.local
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.edge.g3a.test"
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: edge-tls}]
      allowedRoutes: {namespaces: {from: Same}}
    # Plain HTTP only ever answers with a redirect (HTTPRoute https-redirect).
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.edge.g3a.test"
      allowedRoutes: {namespaces: {from: Same}}
---
# Source: ewallet-edge/templates/gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: ewallet-ingress
  labels:
    app.kubernetes.io/part-of: ewallet-edge
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-edge-0.2.0
spec:
  parentRefs: [{name: ewallet-edge, sectionName: http}]
  hostnames: ["registry.edge.g3a.test","features.edge.g3a.test","observe.edge.g3a.test","agents.edge.g3a.test"]
  rules:
    - name: https-redirect
      filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
# Source: ewallet-edge/templates/httproutes.yaml
# Only the listed paths exist on this host; anything else answers 404 at the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-registry
  namespace: ewallet-ingress
  labels:
    app.kubernetes.io/part-of: ewallet-edge
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-edge-0.2.0
spec:
  # HTTPS only: the HTTP listener carries nothing but the redirect.
  parentRefs: [{name: ewallet-edge, sectionName: https}]
  hostnames: ["registry.edge.g3a.test"]
  rules:
    # Istio names the Envoy route after the rule, so the EnvoyFilter's per-route limit can
    # match it by this name.
    - name: agent-registry
      matches:
        - path:
            {type: PathPrefix, value: /}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: ["authorization","x-user-id","x-forwarded-user","x-remote-user","x-edge-user"]
      # Without this Istio gives every route 2 retries on connect-failure, refused-stream,
      # unavailable and cancelled. The edge makes one attempt per request, so the route says
      # so explicitly. Needs Gateway API >= v1.7.0 Standard (v1.5.x prunes the field).
      retry: {attempts: 0}
      backendRefs:
        - {name: prompt-registry-agentregistry, namespace: ewallet-prompts, port: 12121}
---
