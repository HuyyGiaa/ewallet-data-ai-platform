# Source: ewallet-edge/templates/destination-access.yaml
# Only where the namespace already runs ALLOW-only policies. In kagent none exists, and a
# first ALLOW would deny every other caller of the pod, so none is rendered there.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-edge-to-grafana
  namespace: ewallet-agents
  labels:
    app.kubernetes.io/part-of: ewallet-edge
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-edge-0.2.0
spec:
  action: ALLOW
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/ewallet-ingress/sa/ewallet-edge-gateway"]
      to:
        - operation: {ports: ["3000"]}
---
# Source: ewallet-edge/templates/envoyfilter.yaml
# Order matters: the limiter runs first, so password guessing also spends tokens, then
# Basic Auth, then routing. Both are Envoy filters in the pinned proxy, so no extra
# service sits in the request path and a failed check cannot fail open.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: edge-security
  namespace: ewallet-ingress
  labels:
    app.kubernetes.io/part-of: ewallet-edge
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-edge-0.2.0
spec:
  workloadSelector:
    labels:
      istio: ewallet-edge-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          portNumber: 443
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter: {name: envoy.filters.http.router}
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            stat_prefix: edge_rate_limit
            token_bucket:
              max_tokens: 200
              tokens_per_fill: 200
              fill_interval: 1s
            filter_enabled: {default_value: {numerator: 100, denominator: HUNDRED}}
            filter_enforced: {default_value: {numerator: 100, denominator: HUNDRED}}
            response_headers_to_add:
              - {append_action: OVERWRITE_IF_EXISTS_OR_ADD, header: {key: x-edge-rate-limited, value: "true"}}
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          portNumber: 443
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter: {name: envoy.filters.http.router}
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.basic_auth
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.basic_auth.v3.BasicAuth
            users: {filename: /etc/edge-auth/htpasswd}
    # Browsers show a login box only when a 401 carries WWW-Authenticate.
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          portNumber: 443
          filterChain:
            filter: {name: envoy.filters.network.http_connection_manager}
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            local_reply_config:
              mappers:
                - filter: {status_code_filter: {comparison: {op: EQ, value: {default_value: 401, runtime_key: edge_unused_401}}}}
                  headers_to_add:
                    - {append_action: OVERWRITE_IF_EXISTS_OR_ADD, header: {key: www-authenticate, value: "Basic realm=\"E-Wallet\""}}
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration: {vhost: {route: {name: agent-registry}}}
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.local_ratelimit:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: edge_rate_limit_agent_registry
              token_bucket:
                max_tokens: 50
                tokens_per_fill: 50
                fill_interval: 1s
              filter_enabled: {default_value: {numerator: 100, denominator: HUNDRED}}
              filter_enforced: {default_value: {numerator: 100, denominator: HUNDRED}}
              response_headers_to_add:
                - {append_action: OVERWRITE_IF_EXISTS_OR_ADD, header: {key: x-edge-rate-limited, value: "true"}}
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration: {vhost: {route: {name: feature-api}}}
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.local_ratelimit:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: edge_rate_limit_feature_api
              token_bucket:
                max_tokens: 100
                tokens_per_fill: 100
                fill_interval: 1s
              filter_enabled: {default_value: {numerator: 100, denominator: HUNDRED}}
              filter_enforced: {default_value: {numerator: 100, denominator: HUNDRED}}
              response_headers_to_add:
                - {append_action: OVERWRITE_IF_EXISTS_OR_ADD, header: {key: x-edge-rate-limited, value: "true"}}
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration: {vhost: {route: {name: grafana}}}
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.local_ratelimit:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: edge_rate_limit_grafana
              token_bucket:
                max_tokens: 50
                tokens_per_fill: 50
                fill_interval: 1s
              filter_enabled: {default_value: {numerator: 100, denominator: HUNDRED}}
              filter_enforced: {default_value: {numerator: 100, denominator: HUNDRED}}
              response_headers_to_add:
                - {append_action: OVERWRITE_IF_EXISTS_OR_ADD, header: {key: x-edge-rate-limited, value: "true"}}
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration: {vhost: {route: {name: kagent-ui}}}
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.local_ratelimit:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: edge_rate_limit_kagent_ui
              token_bucket:
                max_tokens: 100
                tokens_per_fill: 100
                fill_interval: 1s
              filter_enabled: {default_value: {numerator: 100, denominator: HUNDRED}}
              filter_enforced: {default_value: {numerator: 100, denominator: HUNDRED}}
              response_headers_to_add:
                - {append_action: OVERWRITE_IF_EXISTS_OR_ADD, header: {key: x-edge-rate-limited, value: "true"}}
