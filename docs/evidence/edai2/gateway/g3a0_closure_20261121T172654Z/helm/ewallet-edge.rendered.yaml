# Source: ewallet-edge/templates/destination-access.yaml
# Additive: lets only the edge gateway reach this one workload. Existing policies stay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-to-kagent-ui
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: ewallet-edge
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-edge-0.2.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: ui
      app.kubernetes.io/name: kagent
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ewallet-ingress}
          podSelector:
            matchLabels:
              istio: ewallet-edge-gateway
      ports:
        - {port: 8080, protocol: TCP}
        # Ambient traffic arrives through the HBONE tunnel port.
        - {port: 15008, protocol: TCP}
    # In an ambient namespace kubelet probes arrive SNATed from this address, straight to the
    # container port (not through HBONE). Without it this policy, the first one on the pod,
    # would fail its probes. Only the probe port is opened.
    - from:
        - ipBlock: {cidr: 169.254.7.127/32}
      ports:
        - {port: 8080, protocol: TCP}
