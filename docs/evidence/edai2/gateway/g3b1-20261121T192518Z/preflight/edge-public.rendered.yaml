apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-acme-responder
  namespace: ewallet-ingress
  labels:
    app.kubernetes.io/part-of: ewallet-edge
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-edge-0.2.0
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: edge-acme-responder}}
  template:
    metadata:
