# Source: gateway/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ewallet-edge-gateway
  namespace: ewallet-ingress
  labels:
    app.kubernetes.io/name: ewallet-edge-gateway
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/instance: "ewallet-edge-gateway"
    app.kubernetes.io/part-of: "istio"
    app.kubernetes.io/version: "1.30.7"
    helm.sh/chart: gateway-1.30.7
    app: ewallet-edge-gateway
    istio: ewallet-edge-gateway
    "istio.io/dataplane-mode": "none"
  annotations:
    {}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ewallet-edge-gateway
      istio: ewallet-edge-gateway
  template:
    metadata:
      annotations:
        inject.istio.io/templates: gateway
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: "15020"
        prometheus.io/scrape: "true"
        sidecar.istio.io/inject: "true"
      labels:
        sidecar.istio.io/inject: "true"
        app: ewallet-edge-gateway
        istio: ewallet-edge-gateway
        app.kubernetes.io/name: ewallet-edge-gateway
        app.kubernetes.io/managed-by: "Helm"
        app.kubernetes.io/instance: "ewallet-edge-gateway"
        app.kubernetes.io/part-of: "istio"
        app.kubernetes.io/version: "1.30.7"
        helm.sh/chart: gateway-1.30.7
        "istio.io/dataplane-mode": "none"
    spec:
      serviceAccountName: ewallet-edge-gateway
      securityContext:
        # Safe since 1.22: https://github.com/kubernetes/kubernetes/pull/103326
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      volumes:
        
        - name: edge-auth
          secret:
            defaultMode: 292
            secretName: edge-basic-auth
      containers:
        - name: istio-proxy
          # "auto" will be populated at runtime by the mutating webhook. See https://istio.io/latest/docs/setup/additional-setup/sidecar-injection/#customizing-injection
          image: auto
          securityContext:
            capabilities:
              drop:
              - ALL
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          env:
          ports:
          - containerPort: 15090
            protocol: TCP
            name: http-envoy-prom
          resources:
            limits:
              cpu: 1
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/edge-auth
              name: edge-auth
              readOnly: true
      terminationGracePeriodSeconds: 30
