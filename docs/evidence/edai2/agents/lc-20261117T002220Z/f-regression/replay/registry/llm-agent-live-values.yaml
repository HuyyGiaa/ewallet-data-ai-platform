a2aGateway:
  callerServiceAccounts:
    fraud-coordinator: fraud-coordinator
  enabled: true
  kagentA2A: kagent-controller.kagent.svc.cluster.local:8083
  requestTimeout: 660s
  sandboxRoutes:
    agents:
    - drift-specialist
    - feature-rag-specialist
    namespace: ewallet-sandbox
agentgateway:
  backendRequestTimeout: 160s
  llmRequestTimeout: 170s
  replicas: 1
  requestTimeout: 180s
  responseIdleTimeout: 160s
agents:
  autoscaling:
    enabled: true
    engine: keda
    keda:
      transferHpa: true
      triggers:
        drift-specialist:
          inflightPerReplica: "2"
          targetUtilization: 60
          type: inflight
        feature-rag-specialist:
          inflightPerReplica: "2"
          type: inflight
        fraud-coordinator:
          inflightPerReplica: "2"
          type: inflight
  byoTelemetry:
    auditLogs:
      enabled: true
    metrics:
      enabled: true
  coordinator:
    byo:
      enabled: true
      image: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/g3-byo-coordinator@sha256:94a13a8b168881e10fedbad4b5e4816fd8c92c8f987800930827998eb5ba41a9
      naturalLanguageIntake:
        enabled: true
      sandboxSpecialists:
      - drift-specialist
      - feature-rag-specialist
      workflows:
      - fraud
      - drift
    promptVersion: v5
    version: 1.1.0
  enabled: true
  mcpServers:
    drift-mcp:
      discoveryHeaderSecret:
        key: token
        name: mcp-token-kagent-controller-drift-mcp
    feature-rag-mcp:
      discoveryHeaderSecret:
        key: token
        name: mcp-token-kagent-controller-feature-rag-mcp
  mode: agent
  replicas: 1
  specialists:
    drift-specialist:
      a2aSkill:
        enabled: false
      byo:
        enabled: true
        image: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/g3-byo-drift-specialist@sha256:75011f6ce496e192db997ddc931c82d8d91c4ce87f59414d75ca6eacc2e86931
      runtime: sandbox
      version: 1.1.0
    feature-rag-specialist:
      byo:
        enabled: true
        image: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/g3-byo-feature-rag-specialist@sha256:29867794f67f103ed434110a6ad220347384a1f3f5cc8c3b77f1a4d9c4988b77
        naturalLanguageIntake:
          enabled: true
      promptVersion: v5
      runtime: sandbox
