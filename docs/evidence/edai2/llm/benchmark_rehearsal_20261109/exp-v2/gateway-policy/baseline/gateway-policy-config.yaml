gateways:
  default:
    port: 4000
routes:
  - policies:
        mode: strict
        keys:
      timeout:
        requestTimeout: 180s
    backends:
      - host: 127.0.0.1:3000
llm:
  port: 3000
  policies:
    timeout:
      requestTimeout: 170s
      backendRequestTimeout: 160s
      responseIdleTimeout: 160s
    localRateLimit:
      - maxTokens: 12
        tokensPerFill: 12
        fillInterval: 1s
        type: requests
      - maxTokens: 150000
        tokensPerFill: 150000
        fillInterval: 1h
        type: tokens
  models:
    - name: ewallet-fraud-llm
      provider:
        custom:
          formats:
            - type: completions
      params:
        model: ewallet-fraud-llm-v1
        baseUrl: http://vllm-primary.ewallet-bench.svc.cluster.local:8000/v1
      responseHeaders:
        set:
          x-ewallet-backend: primary
