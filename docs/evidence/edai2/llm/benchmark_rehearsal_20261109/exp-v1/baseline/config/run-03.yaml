# Benchmark stack for EXP-V1 and EXP-V2. It lives in its own namespace, on its own tainted
# node pool, and shares nothing with the production release, so a run cannot touch it.
#
# vLLM settings are the ones O1 ran with (commit a194189). The stack has no fallback model:
# a failed request stays failed instead of being answered by another backend.
# Rendered by scripts/experiments/render_bench.py.
apiVersion: v1
kind: Namespace
metadata:
  name: ewallet-bench
  labels:
    ewallet.io/experiment: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
# GKE adds three Istio ConfigMaps to every new namespace; the count leaves room for them.
# The budget covers the serving stack plus the isolated Prometheus, Grafana and watchdog
# (bench-observability.yaml.tmpl, bench-watchdog.yaml.tmpl).
apiVersion: v1
kind: ResourceQuota
metadata: {name: bench-budget, namespace: ewallet-bench}
spec:
  hard:
    requests.cpu: "5"
    requests.memory: 16Gi
    limits.cpu: "12"
    limits.memory: 28Gi
    pods: "10"
    configmaps: "20"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: ewallet-bench}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-same-namespace, namespace: ewallet-bench}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
  egress:
    - to: [{podSelector: {}}]
---
# GKE runs NodeLocal DNSCache: queries go to its link-local listener or to the kube-dns
# ClusterIP, which node-local-dns also answers, and never reach a kube-dns pod. Without
# those two addresses every lookup is dropped (G1 run 3; EXP-V2 smoke 2026-11-09).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: ewallet-bench}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
        - {ipBlock: {cidr: 169.254.20.10/32}}
        - {ipBlock: {cidr: 34.118.224.10/32}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# The Endpoint Picker watches pods; only it reaches the API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-epp-apiserver, namespace: ewallet-bench}
spec:
  podSelector:
    matchLabels: {llm-d-router-standalone: llmd-router-epp}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 10.20.0.8/32}}, {ipBlock: {cidr: 34.118.224.1/32}}]
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: vllm, namespace: ewallet-bench}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: agentgateway, namespace: ewallet-bench}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: agentgateway-llm-config, namespace: ewallet-bench}
data:
  config.yaml: |
    gateways:
      default:
        port: 4000
    routes:
      - policies:
          apiKey:
            mode: strict
            keys:
              - key: "$GATEWAY_CLIENT_KEY"
          timeout:
            requestTimeout: 180s
        backends:
          - host: 127.0.0.1:3000
    llm:
      port: 3000
      policies:
        timeout:
          requestTimeout: 170s
          backendRequestTimeout: 160s
          responseIdleTimeout: 160s
        localRateLimit:
          - maxTokens: 12
            tokensPerFill: 12
            fillInterval: 1s
            type: requests
            key: llm.requestModel
          - maxTokens: 400000
            tokensPerFill: 400000
            fillInterval: 1h
            type: tokens
            key: llm.requestModel
      models:
        - name: ewallet-fraud-llm
          provider:
            custom:
              formats:
                - type: completions
          params:
            model: ewallet-fraud-llm-v1
            baseUrl: http://vllm-primary.ewallet-bench.svc.cluster.local:8000/v1
            apiKey: "$VLLM_API_KEY"
          responseHeaders:
            set:
              x-ewallet-backend: primary
---
apiVersion: v1
kind: Service
metadata: {name: agentgateway, namespace: ewallet-bench}
spec:
  selector: {app.kubernetes.io/name: agentgateway}
  ports:
    - {name: entry, port: 4000, targetPort: entry}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: ewallet-bench
  labels: {app.kubernetes.io/name: agentgateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: agentgateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agentgateway}
      annotations: {ewallet.io/run-id: "baseline-03"}
    spec:
      serviceAccountName: agentgateway
      automountServiceAccountToken: false
      nodeSelector: {ewallet.io/bench: "true"}
      tolerations:
        - {key: ewallet.io/bench, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: agentgateway
          image: ghcr.io/agentgateway/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
          imagePullPolicy: IfNotPresent
          args: ["-f", "/config/config.yaml"]
          env:
            - name: VLLM_API_KEY
              valueFrom: {secretKeyRef: {name: vllm-api-key, key: api-key}}
            - name: GATEWAY_CLIENT_KEY
              valueFrom: {secretKeyRef: {name: agentgateway-client-key, key: api-key}}
          ports:
            - {name: entry, containerPort: 4000}
            # Prometheus metrics (agentgateway default stats listener); scraped per pod by
            # the benchmark Prometheus only.
            - {name: metrics, containerPort: 15020}
          readinessProbe:
            tcpSocket: {port: entry}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: agentgateway-llm-config}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: vllm-primary, namespace: ewallet-bench}
spec:
  selector: {app.kubernetes.io/name: vllm, app.kubernetes.io/instance: primary}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-primary
  namespace: ewallet-bench
  labels: {app.kubernetes.io/name: vllm, app.kubernetes.io/instance: primary}
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  # Each replica needs a node of its own, so a surge pod could never schedule.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: vllm, app.kubernetes.io/instance: primary}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vllm, app.kubernetes.io/instance: primary}
      # A new value restarts vLLM, so no arm inherits another arm's prefix cache.
      annotations: {ewallet.io/run-id: "baseline-03"}
    spec:
      serviceAccountName: vllm
      automountServiceAccountToken: false
      nodeSelector: {ewallet.io/bench: "true"}
      tolerations:
        - {key: ewallet.io/bench, operator: Equal, value: "true", effect: NoSchedule}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: vllm, app.kubernetes.io/instance: primary}
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: vllm
          image: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/vllm-cpu-model@sha256:f695b23efa8145ae5cb57a1873863879927ab4805e70e5eee1a71a2063edd07c
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - /models/Qwen3-0.6B/c1899de289a04d12100db370d81485cdf75e47ca
            - --served-model-name
            - ewallet-fraud-llm-v1
            - --dtype
            - bfloat16
            - --max-model-len
            - "4096"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - hermes
            - --reasoning-parser
            - qwen3
            - --default-chat-template-kwargs
            - '{"enable_thinking":false}'
            - --max-num-seqs
            - "4"
            - --max-num-queued-reqs
            - "8"
            - --enable-prefix-caching
          env:
            - name: VLLM_API_KEY
              valueFrom: {secretKeyRef: {name: vllm-api-key, key: api-key}}
            - {name: VLLM_CPU_KVCACHE_SPACE, value: "2"}
            - {name: VLLM_CPU_NUM_OF_RESERVED_CPU, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: VLLM_CPU_OMP_THREADS_BIND, value: "auto"}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
          ports:
            - {name: http, containerPort: 8000}
          # Ready only after one real tool-shaped completion, as in O1 and G2.
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import json, os, urllib.request
                  body = {"model": "ewallet-fraud-llm-v1", "max_tokens": 32, "temperature": 0,
                          "messages": [
                              {"role": "system", "content": "You are in a test environment. Use the provided feature_lookup tool."},
                              {"role": "user", "content": "Use feature_lookup for transaction tx-warmup-001, then summarize."}],
                          "tools": [{"type": "function", "function": {"name": "feature_lookup",
                              "description": "Retrieve a test transaction feature fixture.", "parameters": {
                              "type": "object", "properties": {"transaction_id": {"type": "string"}},
                              "required": ["transaction_id"], "additionalProperties": False}}}],
                          "tool_choice": "required"}
                  request = urllib.request.Request("http://127.0.0.1:8000/v1/chat/completions",
                      data=json.dumps(body).encode(), method="POST", headers={
                          "Content-Type": "application/json",
                          "Authorization": "Bearer " + os.environ["VLLM_API_KEY"]})
                  urllib.request.urlopen(request, timeout=240).read()
            periodSeconds: 10
            timeoutSeconds: 245
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: "2", memory: 6Gi}
            limits: {cpu: "3", memory: 10Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: cache, mountPath: /root/.cache}
            - {name: tmp, mountPath: /tmp}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: cache
          emptyDir: {sizeLimit: 8Gi}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
