apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ewallet-llm-agent
    app.kubernetes.io/version: llm-agent-v1
    ewallet.io/agent: drift-specialist
  name: drift-specialist
  namespace: ml-platform
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          policies:
          - periodSeconds: 60
            type: Pods
            value: 1
          selectPolicy: Max
          stabilizationWindowSeconds: 300
        scaleUp:
          policies:
          - periodSeconds: 60
            type: Pods
            value: 1
          selectPolicy: Max
          stabilizationWindowSeconds: 0
  cooldownPeriod: 120
  maxReplicaCount: 3
  minReplicaCount: 2
  pollingInterval: 15
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: drift-specialist
  triggers:
  - metadata:
      value: '60'
    metricType: Utilization
    name: cpu-utilization
    type: cpu

