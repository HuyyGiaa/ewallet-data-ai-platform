---
# Source: ewallet-serving/templates/metrics-discovery.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-feature-api
  namespace: ml-platform
  labels:
    app.kubernetes.io/part-of: ewallet-mlops
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-serving-0.1.0
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: feature-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ml-platform}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {port: 8080, protocol: TCP}
---
# Source: ewallet-serving/templates/metrics-discovery.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-feature-api-egress
  namespace: ml-platform
  labels:
    app.kubernetes.io/part-of: ewallet-mlops
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-serving-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ml-platform}
          podSelector:
            matchLabels: {app.kubernetes.io/name: feature-api}
      ports:
        - {port: 8080, protocol: TCP}
---
# Source: ewallet-serving/templates/metrics-discovery.yaml
# Headless, so DNS returns one address per pod and Prometheus scrapes each replica.
apiVersion: v1
kind: Service
metadata:
  name: feature-api-metrics
  namespace: ml-platform
  labels:
    app.kubernetes.io/part-of: ewallet-mlops
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-serving-0.1.0
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: feature-api
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
# Source: ewallet-serving/templates/metrics-discovery.yaml
# Headless, so DNS returns one address per pod and Prometheus scrapes each replica.
apiVersion: v1
kind: Service
metadata:
  name: fraud-api-metrics
  namespace: ml-platform
  labels:
    app.kubernetes.io/part-of: ewallet-mlops
