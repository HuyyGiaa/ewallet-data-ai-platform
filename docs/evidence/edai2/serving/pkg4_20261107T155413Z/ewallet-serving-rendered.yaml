---
# Source: ewallet-serving/templates/feature-api.yaml
# Additive: the Redis policy in infra/kubernetes/feast-online stays as it is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-clients-feature-api
  namespace: feature-store
  labels:
    app.kubernetes.io/part-of: ewallet-mlops
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-serving-0.1.0
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ml-platform}
          podSelector:
            matchLabels: {app.kubernetes.io/name: feature-api}
      ports:
        - {port: 6379, protocol: TCP}
---
# Source: ewallet-serving/templates/feature-api.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feature-api
  namespace: ml-platform
  labels:
    app.kubernetes.io/part-of: ewallet-mlops
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-serving-0.1.0
    app.kubernetes.io/name: feature-api
  annotations:
    iam.gke.io/gcp-service-account: ewallet-feature-api@ewallet-data-ai-platform-hg26.iam.gserviceaccount.com
automountServiceAccountToken: false
---
# Source: ewallet-serving/templates/feature-api.yaml
apiVersion: v1
kind: Service
metadata:
  name: feature-api
  namespace: ml-platform
  labels:
    app.kubernetes.io/part-of: ewallet-mlops
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-serving-0.1.0
    app.kubernetes.io/name: feature-api
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: feature-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Source: ewallet-serving/templates/feature-api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-api
  namespace: ml-platform
  labels:
    app.kubernetes.io/part-of: ewallet-mlops
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ewallet-serving-0.1.0
    app.kubernetes.io/name: feature-api
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: feature-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: feature-api}
    spec:
      serviceAccountName: feature-api
      automountServiceAccountToken: false
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: feature-api
          image: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/fraud-api@sha256:dbaf8b7060e6bebf477f2bff02dfede382102410b4ab68b51e836de9f7c1c803
          command: ["python", "-m", "ai_platform.inference.feature_server"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: EWALLET_FEAST_REGISTRY
              value: "gs://ewallet-data-ai-platform-hg26-data/features/registries/canonical-100gb-v1/online/online-20261031-163506/registry.db"
            - name: EWALLET_FEAST_TIMEOUT_SECONDS
              value: "2.0"
            - name: EWALLET_REDIS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: feast-online-redis
                  key: connection_string
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
