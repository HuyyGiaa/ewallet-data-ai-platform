a2aGateway:
  callerServiceAccounts:
    fraud-coordinator: fraud-coordinator
  enabled: false
  kagentA2A: kagent-controller.kagent.svc.cluster.local:8083
  requestTimeout: 660s
agentgateway:
  backendRequestTimeout: 160s
  enabled: false
  llmRequestTimeout: 170s
  replicas: 1
  requestTimeout: 180s
  responseIdleTimeout: 160s
agents:
  enabled: false
  mcpServers:
    drift-mcp:
      discoveryHeaderSecret:
        key: token
        name: mcp-token-kagent-controller-drift-mcp
      path: /drift/mcp
      tools:
      - drift_detection
    feature-rag-mcp:
      discoveryHeaderSecret:
        key: token
        name: mcp-token-kagent-controller-feature-rag-mcp
      path: /feature-rag/mcp
      tools:
      - feature_lookup
      - fraud_scoring
      - knowledge_search
  mode: agent
  replicas: 1
  specialists:
    drift-specialist:
      authHeaderSecrets:
        drift-mcp:
          key: token
          name: mcp-token-drift-specialist-drift-mcp
        feature-rag-mcp:
          key: token
          name: mcp-token-drift-specialist-feature-rag-mcp
    feature-rag-specialist:
      authHeaderSecrets:
        feature-rag-mcp:
          key: token
          name: mcp-token-feature-rag-specialist-feature-rag-mcp
crossNamespace:
  flows:
  - direction: ingress
    local: feature-rag-mcp
    name: mcp-gateway-to-feature-rag-mcp
    peer:
      ambient: true
      namespace: ewallet-agents
      podLabels:
        app.kubernetes.io/name: mcp-gateway
      serviceAccount: mcp-gateway
    port: 8080
  - direction: ingress
    local: drift-mcp
    name: mcp-gateway-to-drift-mcp
    peer:
      ambient: true
      namespace: ewallet-agents
      podLabels:
        app.kubernetes.io/name: mcp-gateway
      serviceAccount: mcp-gateway
    port: 8080
  - direction: egress
    local: feature-rag-mcp
    name: feature-rag-mcp-to-feast-redis
    peer:
      namespace: feature-store
      podLabels:
        app.kubernetes.io/name: redis
    peerIngress: true
    port: 6379
  - direction: egress
    local: feature-rag-mcp
    name: feature-rag-mcp-to-kserve-fraud-detector
    peer:
      namespace: fraud-serving
      podLabels:
        serving.kserve.io/inferenceservice: fraud-detector
    peerIngress: true
    port: 8080
dashboards:
  enabled: false
gateway:
  enabled: false
llmPlacement:
  nodeSelector:
    ewallet.io/g3-llm: "true"
llmd:
  enabled: false
mcpCredentialLifecycle:
  clientRelease: legacy
  serverSet: r1-transition
mcpGateway:
  callerServiceAccounts:
    drift-specialist: drift-specialist
    feature-rag-specialist: feature-rag-specialist
  discoveryCallers:
  - namespace: kagent
    serviceAccount: kagent-controller
  enabled: false
  replicas: 1
mcpServices:
  enabled: true
  identity:
    configRevision: g3-gke-v1
    corpusRevision: fraud-policy-v1-20261030
    featureRevision: canonical-100gb-v1/online-20261031-163506
    gitSha: b4111a57fc0285ce118ea036038f6abb7b046867
    imageDigest: sha256:fc08d763e0387b2e069b1708eac4d7f883a0604bf4e9882d8c02723de7b9c3ac
    modelRevision: fraud-detector/1
    promptRevision: v2
  image: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/mcp-tools@sha256:fc08d763e0387b2e069b1708eac4d7f883a0604bf4e9882d8c02723de7b9c3ac
  replicas: 1
  services:
    drift-mcp:
      authSecret:
        key: auth-config.json
        name: mcp-auth-drift-mcp
      discoverySubjects:
      - kagent-controller
      pdb:
        enabled: true
      toolGrants:
        drift-specialist:
        - drift_detection
    feature-rag-mcp:
      authSecret:
        key: auth-config.json
        name: mcp-auth-feature-rag-mcp
      discoverySubjects:
      - kagent-controller
      env:
        EWALLET_FEAST_REGISTRY: /feast/fraud/registry.db
        EWALLET_FEAST_REPO_PATH: /workspace/ai_platform/features/feast/online_repo
        EWALLET_KSERVE_BASE_URL: http://fraud-detector-predictor.fraud-serving.svc.cluster.local
        EWALLET_MODEL_NAME: fraud-detector
        EWALLET_MODEL_VERSION: "1"
        EWALLET_RAG_EMBEDDER: local-onnx
        EWALLET_RAG_FEAST_PROJECT: ewallet_rag
        EWALLET_RAG_FEAST_REGISTRY: /feast/rag/registry.db
        EWALLET_RAG_MANIFEST: /workspace/data/llm_agent/rag/fraud-policy-v1/manifest.json
        EWALLET_RAG_MODEL_CACHE: /opt/hf-cache
        EWALLET_RAG_ONLINE_STORE: redis
        EWALLET_RAG_RETRIEVER: feast-online-exact
      pdb:
        enabled: false
      redisSecret:
        key: connection_string
        name: feast-online-redis
      registrySnapshots:
      - configMap: feast-registry-fraud-online
        mountPath: /feast/fraud
        name: fraud-registry
      - configMap: feast-registry-rag
        mountPath: /feast/rag
        name: rag-registry
      toolGrants:
        drift-specialist:
        - feature_lookup
        feature-rag-specialist:
        - feature_lookup
        - fraud_scoring
        - knowledge_search
modelConfig:
  enabled: false
  timeoutSeconds: 200
namespace:
  ambient: true
  create: false
  name: ewallet-mcp
  podSecurity:
    audit: restricted
    enforce: baseline
    warn: restricted
networkFlows:
  enforced: []
  unresolved: []
networkPolicy:
  dns:
    nodeLocalIP: 169.254.20.10
    serviceIP: 34.118.224.10
observabilityStack:
  enabled: false
otelCollector:
  enabled: false
serviceAccounts:
- feature-rag-mcp
- drift-mcp
vllm:
  cpuThreadsBind: 0-1
  enabled: false
  fallback:
    replicas: 0
  image: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/vllm-cpu-model@sha256:f695b23efa8145ae5cb57a1873863879927ab4805e70e5eee1a71a2063edd07c
  kvCacheSpaceGiB: 2
  modelSource:
    image:
      path: /models/Qwen3-0.6B/c1899de289a04d12100db370d81485cdf75e47ca
    mode: image
  primary:
    replicas: 1
  resources:
    limits:
      cpu: "3"
      memory: 10Gi
    requests:
      cpu: "2"
      memory: 6Gi
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
