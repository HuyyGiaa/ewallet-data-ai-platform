            - {name: EWALLET_MCP_MAX_INFLIGHT, value: "32"}
            - {name: EWALLET_MCP_BODY_TIMEOUT_SECONDS, value: "10"}
            - {name: EWALLET_MCP_TOOL_GRANTS, value: "{\"drift-specialist\":[\"feature_lookup\"],\"feature-rag-specialist\":[\"feature_lookup\",\"fraud_scoring\",\"knowledge_search\"]}"}
            - {name: EWALLET_MCP_DISCOVERY_SUBJECTS, value: "[\"kagent-controller\"]"}
