apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-mcp
  namespace: ewallet-mcp
  labels:
    app.kubernetes.io/part-of: ewallet-llm-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "llm-agent-v1"
    app.kubernetes.io/name: drift-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: drift-mcp}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drift-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: drift-mcp
      automountServiceAccountToken: false
      nodeSelector:
        ewallet.io/g3-llm: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp-server
          image: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/mcp-tools@sha256:b80c07c76e4d240328804218c46ff66ecc7e4ba45694072f94774c57548fa058
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "--factory", "ai_platform.llm_agent.tools.service:create_drift_app",
                    "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
          env:
            - {name: EWALLET_GIT_SHA, value: "642553f40cf395fed06eba52d04f6fa0db3fec94"}
            - {name: EWALLET_IMAGE_DIGEST, value: "sha256:b80c07c76e4d240328804218c46ff66ecc7e4ba45694072f94774c57548fa058"}
            - {name: EWALLET_CONFIG_REVISION, value: "g3-gke-v1"}
            - {name: EWALLET_PROMPT_REVISION, value: "v2"}
            - {name: EWALLET_MODEL_REVISION, value: "fraud-detector/1"}
            - {name: EWALLET_FEATURE_REVISION, value: "canonical-100gb-v1/online-20261031-163506"}
            - {name: EWALLET_CORPUS_REVISION, value: "fraud-policy-v1-20261030"}
            - {name: EWALLET_TOOL_MAX_CONCURRENCY, value: "8"}
            - {name: EWALLET_TOOL_MAX_TIMEOUT_MS, value: "20000"}
            # Transport and authorization limits (ai_platform/llm_agent/tools/security.py).
            - {name: EWALLET_MCP_ALLOWED_ORIGINS, value: ""}
            - {name: EWALLET_MCP_MAX_BODY_BYTES, value: "65536"}
            - {name: EWALLET_MCP_MAX_INFLIGHT, value: "32"}
            - {name: EWALLET_MCP_BODY_TIMEOUT_SECONDS, value: "10"}
            - {name: EWALLET_MCP_TOOL_GRANTS, value: "{\"drift-specialist\":[\"drift_detection\"]}"}
            - {name: EWALLET_MCP_DISCOVERY_SUBJECTS, value: "[\"kagent-controller\"]"}
            # Service-scoped trusted token table. Credential values are supplied
            # only by Kubernetes Secret and never rendered into a ConfigMap.
            - name: EWALLET_MCP_SERVICE_TOKENS
              valueFrom:
                secretKeyRef:
                  name: mcp-auth-drift-mcp-r1-transition
                  key: auth-config.json
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
            failureThreshold: 3
          # Transport readiness only: 503 when callers cannot be authenticated.
          # Tool backends never gate it; see /v1/capabilities.
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
