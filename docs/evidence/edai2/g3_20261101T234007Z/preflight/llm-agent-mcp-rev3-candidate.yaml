          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: fraud-registry, mountPath: /feast/fraud, readOnly: true}
            - {name: rag-registry, mountPath: /feast/rag, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        # Immutable Feast registry snapshot (ConfigMap created from a pinned
        # object with a sha256 check), so the pod needs no GCS IAM.
        - name: fraud-registry
          configMap: {name: feast-registry-fraud-online}
        # Immutable Feast registry snapshot (ConfigMap created from a pinned
        # object with a sha256 check), so the pod needs no GCS IAM.
        - name: rag-registry
          configMap: {name: feast-registry-rag}
