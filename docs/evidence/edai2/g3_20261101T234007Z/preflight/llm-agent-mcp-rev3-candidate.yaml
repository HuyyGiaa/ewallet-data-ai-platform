          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "--factory", "ai_platform.llm_agent.tools.service:create_feature_rag_app",
                    "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
          env:
            - {name: EWALLET_GIT_SHA, value: "642553f40cf395fed06eba52d04f6fa0db3fec94"}
            - {name: EWALLET_IMAGE_DIGEST, value: "sha256:b80c07c76e4d240328804218c46ff66ecc7e4ba45694072f94774c57548fa058"}
            - {name: EWALLET_CONFIG_REVISION, value: "g3-gke-v1"}
            - {name: EWALLET_PROMPT_REVISION, value: "v2"}
            - {name: EWALLET_MODEL_REVISION, value: "fraud-detector/1"}
            - {name: EWALLET_FEATURE_REVISION, value: "canonical-100gb-v1/online-20261031-163506"}
            - {name: EWALLET_CORPUS_REVISION, value: "fraud-policy-v1-20261030"}
            - {name: EWALLET_TOOL_MAX_CONCURRENCY, value: "8"}
            - {name: EWALLET_TOOL_MAX_TIMEOUT_MS, value: "20000"}
