            - name: EWALLET_MCP_SERVICE_TOKENS
              valueFrom:
                secretKeyRef:
                  name: mcp-auth-feature-rag-mcp-r1-transition
                  key: auth-config.json
            - {name: EWALLET_FEAST_REGISTRY, value: "/feast/fraud/registry.db"}
            - {name: EWALLET_FEAST_REPO_PATH, value: "/workspace/ai_platform/features/feast/online_repo"}
            - {name: EWALLET_KSERVE_BASE_URL, value: "http://fraud-detector-predictor.fraud-serving.svc.cluster.local"}
            - {name: EWALLET_MODEL_NAME, value: "fraud-detector"}
            - {name: EWALLET_MODEL_VERSION, value: "1"}
            - {name: EWALLET_RAG_EMBEDDER, value: "local-onnx"}
            - {name: EWALLET_RAG_FEAST_PROJECT, value: "ewallet_rag"}
            - {name: EWALLET_RAG_FEAST_REGISTRY, value: "/feast/rag/registry.db"}
            - {name: EWALLET_RAG_MANIFEST, value: "/workspace/data/llm_agent/rag/fraud-policy-v1/manifest.json"}
            - {name: EWALLET_RAG_MODEL_CACHE, value: "/opt/hf-cache"}
            - {name: EWALLET_RAG_ONLINE_STORE, value: "redis"}
            - {name: EWALLET_RAG_RETRIEVER, value: "feast-online-exact"}
