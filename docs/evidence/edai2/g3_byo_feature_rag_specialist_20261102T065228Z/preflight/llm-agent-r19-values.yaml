a2aGateway:
  callerServiceAccounts:
    fraud-coordinator: fraud-coordinator
  enabled: true
  kagentA2A: kagent-controller.kagent.svc.cluster.local:8083
  requestTimeout: 660s
agentgateway:
  backendRequestTimeout: 160s
  llmRequestTimeout: 170s
  replicas: 1
  requestTimeout: 180s
  responseIdleTimeout: 160s
agents:
  coordinator:
    byo:
      enabled: true
      image: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/g3-byo-coordinator@sha256:397ae0cd1e2ef1671ce9163a3922db97442b8c38c81e899ff96e9d65af274446
