  enabled: true
  mcpServers:
    drift-mcp:
      discoveryHeaderSecret:
        key: token
        name: mcp-token-kagent-controller-drift-mcp
    feature-rag-mcp:
      discoveryHeaderSecret:
        key: token
        name: mcp-token-kagent-controller-feature-rag-mcp
  mode: agent
  replicas: 1
  specialists:
    drift-specialist:
      authHeaderSecrets:
        drift-mcp:
          key: token
          name: mcp-token-drift-specialist-drift-mcp
        feature-rag-mcp:
          key: token
          name: mcp-token-drift-specialist-feature-rag-mcp
    feature-rag-specialist:
      authHeaderSecrets:
        feature-rag-mcp:
          key: token
          name: mcp-token-feature-rag-specialist-feature-rag-mcp
      promptVersion: v5
crossNamespace:
  flows:
  - direction: egress
    local: a2a-gateway
    name: a2a-gateway-to-kagent-controller
    peer:
      ambient: true
      namespace: kagent
      podLabels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: kagent
    port: 8083
  - direction: egress
    local: fraud-coordinator
    name: fraud-coordinator-to-kagent-controller
    peer:
      ambient: true
      namespace: kagent
      podLabels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: kagent
    port: 8083
  - direction: egress
    local: drift-specialist
    name: drift-specialist-to-kagent-controller
    peer:
      ambient: true
      namespace: kagent
      podLabels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: kagent
    port: 8083
  - direction: egress
    local: feature-rag-specialist
    name: feature-rag-specialist-to-kagent-controller
    peer:
      ambient: true
      namespace: kagent
      podLabels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: kagent
    port: 8083
  - direction: ingress
    local: fraud-coordinator
    name: kagent-controller-to-fraud-coordinator
    peer:
      ambient: true
      namespace: kagent
      podLabels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: kagent
      serviceAccount: kagent-controller
    port: 8080
  - direction: ingress
    local: drift-specialist
    name: kagent-controller-to-drift-specialist
    peer:
      ambient: true
      namespace: kagent
      podLabels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: kagent
      serviceAccount: kagent-controller
    port: 8080
  - direction: ingress
    local: feature-rag-specialist
    name: kagent-controller-to-feature-rag-specialist
    peer:
      ambient: true
      namespace: kagent
      podLabels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: kagent
      serviceAccount: kagent-controller
    port: 8080
  - direction: egress
    local: feature-rag-mcp
    name: feature-rag-mcp-to-feast-redis
    peer:
      namespace: feature-store
      podLabels:
        app.kubernetes.io/name: redis
    peerIngress: true
    port: 6379
  - direction: egress
    local: feature-rag-mcp
    name: feature-rag-mcp-to-kserve-fraud-detector
    peer:
      namespace: fraud-serving
      podLabels:
        serving.kserve.io/inferenceservice: fraud-detector
    peerIngress: true
    port: 8080
  - direction: ingress
    local: mcp-gateway
    name: kagent-controller-to-mcp-gateway
    peer:
      ambient: true
      namespace: kagent
      podLabels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: kagent
      serviceAccount: kagent-controller
    port: 8080
gateway:
  enabled: false
llmPlacement:
