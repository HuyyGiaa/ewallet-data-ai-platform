      - path:
          pathPrefix: /drift/mcp
      policies:
        timeout:
          requestTimeout: 25s
        localRateLimit:
        - maxTokens: 20
          tokensPerFill: 20
          fillInterval: 1s
          type: requests
        # Client-supplied identity headers and credentials never reach a server
        # (the 2026-10-31 local smoke showed a client Authorization header passing
        # through). Only mesh-identity mode reconstructs a caller header; Ambient
        # mode leaves it absent and authenticates the backend service token.
        requestHeaderModifier:
          remove:
          - authorization
          - x-ewallet-actor
          - x-ewallet-caller
        mcpAuthorization:
          rules:
          - 'true'
      backends:
      - mcp:
          targets:
          - name: drift
            mcp:
              host: http://drift-mcp.ewallet-mcp.svc.cluster.local:8080/mcp
    - name: feature-rag-mcp
      matches:
      - path:
          pathPrefix: /feature-rag/mcp
      policies:
        timeout:
          requestTimeout: 25s
        localRateLimit:
        - maxTokens: 20
          tokensPerFill: 20
          fillInterval: 1s
          type: requests
        # Client-supplied identity headers and credentials never reach a server
        # (the 2026-10-31 local smoke showed a client Authorization header passing
        # through). Only mesh-identity mode reconstructs a caller header; Ambient
        # mode leaves it absent and authenticates the backend service token.
