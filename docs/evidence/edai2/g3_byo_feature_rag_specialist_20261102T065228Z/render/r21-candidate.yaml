# Source: llm-agent-platform/templates/policy-gateways.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: a2a-gateway-config
  namespace: ewallet-agents
  labels:
    app.kubernetes.io/part-of: ewallet-llm-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "llm-agent-v1"
data:
  config.yaml: |

    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    config:
      logging:
        format: json
    gateways:
      default:
        port: 8083
    routes:
    # kagent 0.10.3 proxy.url rewrites Agent-tool destinations to this gateway and
    # supplies x-kagent-host. Each declared Specialist has an exact route; there is
    # no dynamic-forward-proxy fallback. The A2A policy rewrites Agent Cards back to
    # the gateway URL, while the kagent client retains x-kagent-host for invocation.
    # Under Istio Ambient the caller SPIFFE identity terminates at ztunnel and is
    # enforced by the chart's exact AuthorizationPolicy before this process; it is
    # not exposed as agentgateway source.identity. The application route therefore
    # opens only when a mesh caller is configured, and otherwise remains fail-closed.
    - name: drift-specialist
      matches:
      - headers:
        - name: x-kagent-host
          value:
            exact: "drift-specialist.ewallet-agents"
      policies:
        a2a: {}
        timeout:
          requestTimeout: 660s
        localRateLimit:
        - maxTokens: 10
          tokensPerFill: 10
          fillInterval: 1s
          type: requests
        requestHeaderModifier:
          remove:
          - authorization
          - x-ewallet-actor
          - x-ewallet-caller
          - x-kagent-host
        authorization:
          rules:
          - 'true'
      backends:
      - host: drift-specialist.ewallet-agents.svc.cluster.local:8080
    - name: feature-rag-specialist
      matches:
      - headers:
        - name: x-kagent-host
          value:
            exact: "feature-rag-specialist.ewallet-agents"
      policies:
        a2a: {}
        timeout:
          requestTimeout: 660s
        localRateLimit:
        - maxTokens: 10
          tokensPerFill: 10
          fillInterval: 1s
          type: requests
        requestHeaderModifier:
          remove:
          - authorization
          - x-ewallet-actor
          - x-ewallet-caller
          - x-kagent-host
        authorization:
          rules:
          - 'true'
      backends:
      - host: feature-rag-specialist.ewallet-agents.svc.cluster.local:8080
    # Preserve the controller A2A entrypoint for external/controller-originated
    # requests; Agent-tool delegation uses only the exact Specialist routes above.
    - name: kagent-a2a
      matches:
      - path:
          pathPrefix: /api/a2a/ewallet-agents/
      policies:
        a2a: {}
        timeout:
          requestTimeout: 660s
        localRateLimit:
        - maxTokens: 10
          tokensPerFill: 10
          fillInterval: 1s
          type: requests
        requestHeaderModifier:
          remove:
          - authorization
          - x-ewallet-actor
          - x-ewallet-caller
          - x-kagent-host
        authorization:
          rules:
          - 'true'
      backends:
      - host: kagent-controller.kagent.svc.cluster.local:8083
