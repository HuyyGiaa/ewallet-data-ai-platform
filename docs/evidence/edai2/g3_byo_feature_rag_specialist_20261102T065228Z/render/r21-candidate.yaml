  template:
    metadata:
      labels: {app.kubernetes.io/name: agentgateway}
    spec:
      serviceAccountName: agentgateway
      automountServiceAccountToken: false
      # Keeps LLM serving off nodes it was not budgeted for (O1: the nodes added
      # for the session, never the MLOps nodes). No tolerations, no PriorityClass.
      nodeSelector:
        ewallet.io/g3-llm: "true"
      containers:
        - name: agentgateway
          image: ghcr.io/agentgateway/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
          imagePullPolicy: IfNotPresent
          args: ["-f", "/config/config.yaml"]
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: api-key
            - name: GATEWAY_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: agentgateway-client-key
                  key: api-key
          ports:
            - {name: entry, containerPort: 4000}
            - {name: llm-internal, containerPort: 3000}
