  name: allow-feature-rag-specialist-to-agentgateway
  namespace: ewallet-agents
  labels:
    app.kubernetes.io/part-of: ewallet-llm-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "llm-agent-v1"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/ewallet-agents/sa/feature-rag-specialist
      to:
        - operation:
            ports: ["4000"]
