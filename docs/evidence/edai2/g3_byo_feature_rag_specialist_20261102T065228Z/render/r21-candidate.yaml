            tcpSocket: {port: entry}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket: {port: entry}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: entry}
            periodSeconds: 15
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: agentgateway-llm-config}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
