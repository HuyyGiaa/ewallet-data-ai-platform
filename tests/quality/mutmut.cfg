# B1.3 mutation scope (EDAI-2 row 30). scripts/testing/run_mutation.sh installs
# this file as setup.cfg inside a temporary workspace outside the repository.
#
# Bounded to modules that hold business rules: request validation, feature
# assembly and freshness, the model wire contract, derived formulas, idempotency
# and PII masking. Pure wiring, telemetry and transport code is out of scope.
[mutmut]
source_paths=ai_platform
only_mutate=
    ai_platform/inference/schemas.py
    ai_platform/inference/assembler.py
    ai_platform/inference/feast_online.py
    ai_platform/inference/wire.py
    ai_platform/ml/training/derived.py
    ai_platform/llm_agent/idempotency.py
    ai_platform/llm_agent/prompt_safety.py
also_copy=
    data_platform
    data
pytest_add_cli_args=
    -p
    no:cacheprovider
    --ignore=tests/property/test_known_defects.py
pytest_add_cli_args_test_selection=
    tests/inference
    tests/property
    tests/llm_agent/test_g3_durable_idempotency.py
    tests/llm_agent/test_g3_programmatic_coordinator.py
timeout_multiplier=10.0
timeout_constant=30.0
