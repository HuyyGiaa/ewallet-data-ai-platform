# B1.1 coverage scope for the Fraud API request path (EDAI-2 row 28).
#
# Measured: every module of ai_platform/inference plus the three modules it
# imports to build the model vector. Nothing inside that scope is omitted and no
# line or branch is excluded; the only omit is the project's virtualenv, which
# lives inside the package directory and is not first-party code.
[run]
branch = True
relative_files = True
source_pkgs =
    ai_platform.inference
    ai_platform.ml.training.contract
    ai_platform.ml.training.derived
    ai_platform.features.feast.schema
omit =
    ai_platform/inference/.venv/*

[report]
fail_under = 90
precision = 2
show_missing = True
skip_empty = False
