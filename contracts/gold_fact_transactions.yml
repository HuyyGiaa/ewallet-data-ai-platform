contract_version: 1
dataset: gold.fact_transactions
layer: gold
description: Central analytical transaction fact derived from Silver transactions.
storage_location: s3a://gold-zone/fact_transactions
grain: One row per transaction_id.
logical_key:
  - transaction_id
upstream:
  - silver.transactions
enforced_by:
  - validation.validate_gold
  - validation.validate_silver

columns:
  - {name: transaction_id, type: string, nullable: false}
  - {name: user_id, type: string, nullable: false}
  - {name: account_id, type: string, nullable: false}
  - {name: merchant_id, type: string, nullable: true}
  - {name: device_id, type: string, nullable: false}
  - {name: counterparty_account_id, type: string, nullable: true}
  - {name: date_key, type: integer, nullable: false}
  - {name: type, type: string, nullable: false}
  - {name: status, type: string, nullable: false}
  - {name: channel, type: string, nullable: false}
  - {name: currency, type: string, nullable: false}
  - {name: amount, type: double, nullable: false}
  - {name: old_balance, type: double, nullable: false}
  - {name: new_balance, type: double, nullable: false}
  - {name: timestamp, type: timestamp, nullable: false}
  - {name: ingested_at, type: timestamp, nullable: false}
  - {name: event_date, type: date, nullable: false}

inherited_domains:
  source: silver.transactions
  columns: [type, status, channel, currency]
  enforcement: Silver validator plus pass-through selection in build_fact_transactions.

quality_rules:
  - expectation: Dataset is non-empty.
    validator_rule: fact_transactions.non_empty
  - expectation: Required columns contain no null values.
    validator_rule: fact_transactions.required_columns_not_null
  - expectation: transaction_id is unique.
    validator_rule: fact_transactions.unique_key(transaction_id)
  - expectation: amount, old_balance and new_balance are greater than or equal to 0.
    validator_rule: fact_transactions.non_negative_metrics

conditional_rules:
  - when: type == payment
    require_non_null: [merchant_id]
    validator_rule: fact_transactions.merchant_id_required_for_payment
  - when: type == transfer
    require_non_null: [counterparty_account_id]
    validator_rule: fact_transactions.counterparty_account_id_required_for_transfer

foreign_keys:
  - columns: [user_id]
    references: gold.dim_user.user_id
    nullable: false
    validator_rule: fact_transactions.user_id_exists_in_dim_user
  - columns: [account_id]
    references: gold.dim_account.account_id
    nullable: false
    validator_rule: fact_transactions.account_id_exists_in_dim_account
  - columns: [device_id]
    references: gold.dim_device.device_id
    nullable: false
    validator_rule: fact_transactions.device_id_exists_in_dim_device
  - columns: [merchant_id]
    references: gold.dim_merchant.merchant_id
    nullable: true
    validator_rule: fact_transactions.merchant_id_exists_in_dim_merchant
  - columns: [counterparty_account_id]
    references: gold.dim_account.account_id
    nullable: true
    validator_rule: fact_transactions.counterparty_account_id_exists_in_dim_account
  - columns: [date_key]
    references: gold.dim_date.date_key
    nullable: false
    validator_rule: fact_transactions.date_key_exists_in_dim_date

population_rules:
  - relation: Row count equals silver.transactions.
    validator_rule: silver.transactions_count_equals_fact_transactions_count

notes:
  - event_date is derived from timestamp and date_key is derived from event_date.
  - Transaction domains are inherited unchanged from the validated Silver input.
