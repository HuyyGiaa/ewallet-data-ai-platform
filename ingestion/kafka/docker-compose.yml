version: "3.8"

# Redpanda: Kafka-API compatible, 1 container duy nhất, không cần Zookeeper riêng.
# Console: UI để xem topic/message trực quan khi debug (không bắt buộc dùng, chỉ tiện kiểm tra).
#
# QUAN TRỌNG: dùng 2 listener riêng biệt (INTERNAL/EXTERNAL) để tránh lỗi
# "advertise-addr sai ngữ cảnh":
#   - INTERNAL (redpanda:29092): dùng cho container khác trong cùng Docker network gọi vào
#     (Redpanda Console, Debezium/Kafka Connect sau này)
#   - EXTERNAL (localhost:9092): dùng cho process chạy trên host gọi vào
#     (streaming_generator.py, consumer_demo.py chạy trực tiếp bằng `python`)
# Nếu chỉ có 1 listener "localhost:9092" dùng chung cho cả 2 phía, container gọi vào
# sẽ tự trỏ vào chính nó (vì "localhost" bên trong container khác nghĩa với host)
# -> connection refused, đúng lỗi đã gặp.

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"    # Kafka API cho host — dùng cho streaming_generator.py, consumer_demo.py, Debezium sink sau này
      - "29092:29092"  # không bắt buộc mở ra host, chỉ cần trong docker network — giữ lại để debug nếu cần
      - "9644:9644"    # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.6.0
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:29092   # <-- dùng listener INTERNAL, KHÔNG dùng localhost
    ports:
      - "8080:8080"   # UI: http://localhost:8080
    depends_on:
      - redpanda
    restart: unless-stopped

volumes:
  redpanda-data: