pipelineInfo:
  description: Validation-only selection and winner-only test/MLflow registration.
  name: f9-canonical-bounded-experiment
root:
  dag:
    tasks:
      evaluate-test-winner:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-test-winner
        dependentTasks:
        - select-validation-winner
        - train-dummy-baseline
        - train-hist-gradient-boosting
        - train-logistic-regression
        - train-random-forest
        inputs:
          artifacts:
            dummy_baseline:
              taskOutputArtifact:
