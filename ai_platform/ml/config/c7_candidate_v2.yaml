# C7.1 candidate for fraud-detector v2. Same snapshot and selection rule as v1. The
# control repeats the v1 configuration so a run can check it reproduces v1, and it is
# not selection eligible, so only a genuinely new configuration can be registered.
dataset_path: ${F9_DATASET_PATH}
output_path: ${F9_OUTPUT_PATH}
seed: 42

snapshot:
  training_snapshot_uri: ${F9_TRAINING_SNAPSHOT_URI}
  dataset_version: ${DATASET_VERSION}
  silver_run_id: ${SILVER_RUN_ID}
  feature_run_id: ${FEATURE_RUN_ID}
  snapshot_id: ${SNAPSHOT_ID}
  manifest_sha256: ${SNAPSHOT_MANIFEST_SHA256}

selection:
  primary_metric: pr_auc
  tie_breaker_metric: f1

tracking:
  uri: ${MLFLOW_TRACKING_URI}
  experiment_name: ${MLFLOW_EXPERIMENT_NAME}
  registered_model_name: ${MLFLOW_REGISTERED_MODEL_NAME}
  registry_mode: winner_only

candidates:
  - name: control_random_forest_v1
    estimator: random_forest
    strategy: full
    selection_eligible: false
    params:
      n_estimators: 200
      max_depth: 12
      min_samples_leaf: 2
      n_jobs: 1
  - name: random_forest_deeper
    estimator: random_forest
    strategy: full
    selection_eligible: true
    params:
      n_estimators: 400
      max_depth: 16
      min_samples_leaf: 2
      n_jobs: 1
  - name: hist_gradient_boosting_regularized
    estimator: hist_gradient_boosting
    strategy: full
    selection_eligible: true
    params:
      max_iter: 300
      max_leaf_nodes: 31
      learning_rate: 0.05
      l2_regularization: 1.0
