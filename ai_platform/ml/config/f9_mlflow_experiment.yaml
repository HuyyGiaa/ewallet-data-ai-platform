dataset_path: ai_platform/ml/data/fraud_training_v1/trainable_dataset
output_path: ai_platform/ml/artifacts/f9_mlflow_experiment
seed: 42

selection:
  primary_metric: pr_auc
  tie_breaker_metric: f1

tracking:
  uri: http://127.0.0.1:5000
  experiment_name: ewallet-fraud-comparison
  registered_model_name: ewallet-fraud-detector
  registry_mode: manual

candidates:
  - name: dummy_baseline
    estimator: dummy
    strategy: full
    selection_eligible: false
    params:
      strategy: prior
  - name: logistic_regression
    estimator: logistic_regression
    strategy: full
    selection_eligible: true
    params:
      C: 1.0
      max_iter: 1000
  - name: random_forest
    estimator: random_forest
    strategy: full
    selection_eligible: true
    params:
      n_estimators: 200
      max_depth: 12
      min_samples_leaf: 2
      n_jobs: 1
  - name: hist_gradient_boosting
    estimator: hist_gradient_boosting
    strategy: full
    selection_eligible: true
    params:
      max_iter: 150
      max_leaf_nodes: 31
      learning_rate: 0.1
      l2_regularization: 0.1
