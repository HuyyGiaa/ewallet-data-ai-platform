dataset_path: ${F9_DATASET_PATH}
output_path: ${F9_OUTPUT_PATH}
seed: 42

snapshot:
  training_snapshot_uri: ${F9_TRAINING_SNAPSHOT_URI}
  dataset_version: ${DATASET_VERSION}
  silver_run_id: ${SILVER_RUN_ID}
  feature_run_id: ${FEATURE_RUN_ID}
  snapshot_id: ${SNAPSHOT_ID}

selection:
  primary_metric: pr_auc
  tie_breaker_metric: f1

tracking:
  uri: ${MLFLOW_TRACKING_URI}
  experiment_name: ewallet-fraud-comparison
  registered_model_name: ewallet-fraud-detector
  registry_mode: winner_only

candidates:
  - name: dummy_baseline
    estimator: dummy
    strategy: full
    selection_eligible: false
    params:
      strategy: prior
  - name: logistic_regression
    estimator: logistic_regression
    strategy: full
    selection_eligible: true
    params:
      C: 1.0
      max_iter: 1000
  - name: random_forest
    estimator: random_forest
    strategy: full
    selection_eligible: true
    params:
      n_estimators: 200
      max_depth: 12
      min_samples_leaf: 2
      n_jobs: 1
  - name: hist_gradient_boosting
    estimator: hist_gradient_boosting
    strategy: full
    selection_eligible: true
    params:
      max_iter: 150
      max_leaf_nodes: 31
      learning_rate: 0.1
      l2_regularization: 0.1
