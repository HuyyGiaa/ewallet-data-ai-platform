version: "3.8"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"    
      - "29092:29092"  
      - "9644:9644"   
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.6.0
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:29092   
    ports:
      - "8080:8080"   # UI: http://localhost:8080
    depends_on:
      - redpanda
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ewallet
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"        
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./storage/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    profiles: ["ingestion"]
    restart: unless-stopped
  
  kafka-connect:
    image: debezium/connect:2.6
    container_name: kafka-connect
    depends_on:
      - redpanda
      - postgres
    environment:
      BOOTSTRAP_SERVERS: redpanda:29092    
      GROUP_ID: ewallet-connect-cluster
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
    ports:
      - "8083:8083"   
    profiles: ["ingestion"]
    restart: unless-stopped


  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio-data:/data
    profiles: ["storage"]
    restart: unless-stopped

  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8081:8080"   # đổi cổng ngoài vì 8080 đã bị Redpanda Console chiếm
    volumes:
      - ./storage/trino-conf:/etc/trino/catalog
    depends_on:
      - minio
    profiles: ["storage"]
    restart: unless-stopped

    
volumes:
  redpanda-data:
  postgres-data:

