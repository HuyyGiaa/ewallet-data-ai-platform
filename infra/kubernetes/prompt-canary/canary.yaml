# Isolated row 35 canary (kind validation; not applied to GKE). A drift-specialist
# twin reads its system prompt from ConfigMap drift-specialist-prompt-managed,
# which ops/llm_agent/prompt_registry.py renders from agentregistry at an explicit
# version. prompt-echo is a mock OpenAI endpoint that logs the sha256 of the
# system message it receives and answers with the prompt_revision named inside
# that system message, so the reply proves which registry version the agent sent.
---
apiVersion: v1
kind: Namespace
metadata:
  name: prompt-canary
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prompt-echo, namespace: prompt-canary}
data:
  server.py: |
    import hashlib, json, logging, re
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    logging.basicConfig(level=logging.INFO, format="%(message)s")

    class Handler(BaseHTTPRequestHandler):
        def _json(self, status, body):
            payload = json.dumps(body, separators=(",", ":")).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            self._json(200 if self.path in ("/healthz", "/readyz") else 404, {"status": "ok"})

        def do_POST(self):
            if self.path != "/v1/chat/completions":
                return self._json(404, {"error": "not_found"})
            request = json.loads(self.rfile.read(min(int(self.headers.get("Content-Length", "0")), 1048576)) or b"{}")
            system = "".join(m.get("content") or "" if isinstance(m.get("content"), str) else
                             "".join(p.get("text", "") for p in m.get("content") or [])
                             for m in request.get("messages", []) if m.get("role") in ("system", "developer"))
            revision = (re.search(r"prompt_revision\"\s*:\s*\"([^\"]+)\"", system) or
                        re.search(r"\(prompt ([a-z-]+/v\d+)\)", system))
            answer = {"contract_version": "g3-orchestration/v1",
                      "prompt_revision": revision.group(1) if revision else "NO_SYSTEM_PROMPT"}
            logging.info(json.dumps({"event": "prompt_echo", "system_sha256": hashlib.sha256(system.encode()).hexdigest(),
                                     "system_bytes": len(system.encode()), "prompt_revision": answer["prompt_revision"],
                                     "system_text": system}))
            self._json(200, {"id": "chatcmpl-prompt-echo", "object": "chat.completion", "created": 0,
                             "model": request.get("model"),
                             "choices": [{"index": 0, "finish_reason": "stop",
                                          "message": {"role": "assistant", "content": json.dumps(answer)}}],
                             "usage": {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2}})

        def log_message(self, *_):
            return

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prompt-echo, namespace: prompt-canary}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: prompt-echo}}
  template:
    metadata: {labels: {app.kubernetes.io/name: prompt-echo}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: server
          image: python:3.12.12-alpine3.22@sha256:848ba4413eb897e225159b8fc1b02094576cbae4aa73fc13142608ae2c8c0e32
          command: [python, /app/server.py]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: prompt-echo}}]
---
apiVersion: v1
kind: Service
metadata: {name: prompt-echo, namespace: prompt-canary}
spec:
  selector: {app.kubernetes.io/name: prompt-echo}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Secret
metadata: {name: prompt-echo-key, namespace: prompt-canary}
type: Opaque
stringData: {OPENAI_API_KEY: mock-local-only-not-a-credential}
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata: {name: prompt-echo, namespace: prompt-canary}
spec:
  provider: OpenAI
  model: prompt-echo-v1
  apiKeySecret: prompt-echo-key
  apiKeySecretKey: OPENAI_API_KEY
  openAI: {baseUrl: "http://prompt-echo.prompt-canary.svc.cluster.local:8080/v1", temperature: "0", maxTokens: 64}
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata: {name: drift-specialist-canary, namespace: prompt-canary}
spec:
  type: Declarative
  description: Feature / Risk specialist (registry-prompt canary)
  declarative:
    runtime: go
    modelConfig: prompt-echo
    stream: false
    executeCodeBlocks: false
    systemMessageFrom: {type: ConfigMap, name: drift-specialist-prompt-managed, key: system.md}
    deployment:
      podSecurityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
