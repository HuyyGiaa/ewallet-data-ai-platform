# Batch D1 PROPOSAL (NOT APPROVED, NOT APPLIED TO GKE; validated on kind only).
# Helm record for release llm-agent-mcp lives in ewallet-mcp-release, a namespace
# holding only Helm release Secrets (quota: 0 pods/services/PVCs). Jenkins gets
# Secret verbs only there; ewallet-mcp gets every chart kind except Secrets.
# Kind validation: docs/evidence/edai2/cicd_runtime_20261103/batch-d-kind/.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ewallet-mcp-release
  labels:
    app.kubernetes.io/part-of: ewallet-ci
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: helm-records-only
  namespace: ewallet-mcp-release
spec:
  hard:
    pods: '0'
    services: '0'
    configmaps: '2'
    secrets: '20'
    persistentvolumeclaims: '0'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-helm-records
  namespace: ewallet-mcp-release
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-helm-records
  namespace: ewallet-mcp-release
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-helm-records
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: ewallet-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-release-llm-agent-mcp
  namespace: ewallet-mcp
