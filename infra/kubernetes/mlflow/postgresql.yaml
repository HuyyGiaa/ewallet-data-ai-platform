apiVersion: v1
kind: Service
metadata:
  name: mlflow-postgresql
  namespace: ml-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mlflow-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mlflow-postgresql
  namespace: ml-platform
spec:
  serviceName: mlflow-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-postgresql
    spec:
      serviceAccountName: mlflow-postgresql
      containers:
        - name: postgresql
          image: postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: mlflow
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgresql
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgresql
                  key: password
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
