apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-pilot-worker-egress
  namespace: kagent-pilot
spec:
  podSelector:
    matchLabels:
      ate.dev/worker-pool: kagent-pilot
  policyTypes:
    - Egress
  egress:
    - to:
        # GKE Dataplane V2 evaluates DNS traffic against the Service IP before
        # endpoint translation, so keep the live kube-dns /32 explicit.
        - ipBlock:
            cidr: 34.118.224.10/32
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mock-openai
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: ate-api-server
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: ate-controller
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: atenet-router
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: rustfs
      ports:
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 9001}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: valkey-cluster
      ports:
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 16379}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/name: kagent
      ports:
        - {protocol: TCP, port: 8083}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ewallet-agents
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - {protocol: TCP, port: 4317}
