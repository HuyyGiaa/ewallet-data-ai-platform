apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-openai
  namespace: kagent
data:
  server.py: |
    import json
    import logging
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    logging.basicConfig(level=logging.INFO, format="%(message)s")
    RESPONSE = {
        "id": "chatcmpl-kagent-pilot-fixed",
        "object": "chat.completion",
        "created": 0,
        "model": "mock-fixed-v1",
        "choices": [
            {
                "index": 0,
                "message": {"role": "assistant", "content": "KAGENT_PILOT_OK"},
                "finish_reason": "stop",
            }
        ],
        "usage": {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2},
    }

    class Handler(BaseHTTPRequestHandler):
        def _json(self, status, body):
            payload = json.dumps(body, sort_keys=True, separators=(",", ":")).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path in ("/healthz", "/readyz"):
                self._json(200, {"status": "ok"})
            else:
                self._json(404, {"error": "not_found"})

        def do_POST(self):
            if self.path != "/v1/chat/completions":
                self._json(404, {"error": "not_found"})
                return
            length = min(int(self.headers.get("Content-Length", "0")), 1048576)
            try:
                request = json.loads(self.rfile.read(length) or b"{}")
            except (json.JSONDecodeError, UnicodeDecodeError):
                self._json(400, {"error": "invalid_json"})
                return
            logging.info(json.dumps({
                "event": "mock_completion",
                "model": request.get("model"),
                "path": self.path,
                "request_id": self.headers.get("x-request-id", "absent"),
            }, sort_keys=True))
            self._json(200, RESPONSE)

        def log_message(self, _format, *_args):
            return

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-openai
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-openai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-openai
    spec:
      serviceAccountName: mock-openai
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-openai
          image: python:3.12.12-alpine3.22@sha256:848ba4413eb897e225159b8fc1b02094576cbae4aa73fc13142608ae2c8c0e32
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/server.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: mock-openai
---
apiVersion: v1
kind: Service
metadata:
  name: mock-openai
  namespace: kagent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-openai
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mock-openai
  namespace: kagent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mock-openai
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress: []
