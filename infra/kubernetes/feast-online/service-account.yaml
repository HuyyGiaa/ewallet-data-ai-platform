# Workload Identity: bound to the existing training GSA (GCS objectUser on the
# data bucket) for offline snapshot reads and the create-only online registry.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feast-online
  namespace: feature-store
  annotations:
    iam.gke.io/gcp-service-account: ewallet-training@ewallet-data-ai-platform-hg26.iam.gserviceaccount.com
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: feature-store
automountServiceAccountToken: false
