# Official HashiCorp chart vault-0.34.1 (sha256 df4c37fa...64c4), Vault 2.0.4.
# Integrated Raft storage on a Persistent Disk, TLS listener, audit log on its own
# disk. One replica fits the on-demand cloud lab; Raft quorum needs 3 for real HA.
# Shamir unseal is deliberate: KMS auto-unseal is a new billable resource and needs
# new IAM. Every restart, including a cluster wake, leaves Vault sealed until
# `ops/vault/cli.py unseal` runs.
global:
  tlsDisable: false
injector:
  enabled: false
csi:
  enabled: false
ui:
  enabled: false
server:
  image:
    repository: hashicorp/vault
    tag: 2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2
  authDelegator:
    enabled: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  statefulSet:
    securityContext:
      pod:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      container:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: standard-rwo
  auditStorage:
    enabled: true
    size: 1Gi
    storageClass: standard-rwo
  extraVolumes:
    - {type: secret, name: vault-server-tls}
  readinessProbe:
    enabled: true
    path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false
        disable_mlock = true
        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file   = "/vault/userconfig/vault-server-tls/tls.crt"
          tls_key_file    = "/vault/userconfig/vault-server-tls/tls.key"
          tls_min_version = "tls12"
        }
        storage "raft" {
          path = "/vault/data"
        }
        service_registration "kubernetes" {}
