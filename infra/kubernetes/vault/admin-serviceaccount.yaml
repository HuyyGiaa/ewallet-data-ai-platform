# The owner's Vault admin identity. No pod runs as it and it has no RBAC: the owner,
# with cluster-admin rights, requests a short token for it (kubectl create token
# vault-admin -n ewallet-vault --audience vault) and logs in to Vault role vault-admin,
# which may only run the root-generation ceremony (policies/root-generation.hcl).
# It never expires, so administration survives an expired operator token or a long sleep.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-admin
  namespace: ewallet-vault
  labels: {app.kubernetes.io/part-of: ewallet-platform}
automountServiceAccountToken: false
