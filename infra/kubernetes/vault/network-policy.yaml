# Default deny, then only the External Secrets controller may reach port 8200 (Vault V2: the
# direct-loader serving pods are no longer Vault clients). Egress stays open: the API server
# for TokenReview (its address differs per cluster) and, on GKE, the metadata server and
# cloudkms.googleapis.com for the gcpckms seal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-clients
  namespace: ewallet-vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # ESO controller only; its webhook and cert-controller never call Vault.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
          podSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
      ports:
        - {port: 8200, protocol: TCP}
