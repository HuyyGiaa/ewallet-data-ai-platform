# Default deny, then only the integrated serving workloads may reach Vault. Egress
# stays open to the API server for TokenReview; its address differs per cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-clients
  namespace: ewallet-vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: fraud-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: feature-api
      ports:
        - {port: 8200, protocol: TCP}
