# Isolated namespaces for Jenkins CD proofs. Nothing here can reach production
# Redis/Redpanda/RAG data: default-deny, and each workload ships its own
# ephemeral store. Quotas cap the cost of a forgotten Job.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ewallet-cicd
  labels:
    app.kubernetes.io/part-of: ewallet-ci
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: bounded-cd-workloads, namespace: ewallet-cicd}
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 6Gi
    limits.cpu: "4"
    limits.memory: 10Gi
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
    count/jobs.batch: "6"
    count/cronjobs.batch: "2"
---
apiVersion: v1
kind: LimitRange
metadata: {name: bounded-cd-defaults, namespace: ewallet-cicd}
spec:
  limits:
    - type: Container
      default: {cpu: 500m, memory: 512Mi}
      defaultRequest: {cpu: 100m, memory: 128Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: ewallet-cicd}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Pods talk only to each other inside the namespace and to cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: same-namespace-and-dns, namespace: ewallet-cicd}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
  egress:
    - to: [{podSelector: {}}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: 34.118.224.10/32}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: v1
kind: Namespace
metadata:
  name: ewallet-prompts
  labels:
    app.kubernetes.io/part-of: ewallet-agents
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: prompt-registry, namespace: ewallet-prompts}
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    persistentvolumeclaims: "1"
    requests.storage: 2Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: ewallet-prompts}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: LimitRange
metadata: {name: prompt-registry-defaults, namespace: ewallet-prompts}
spec:
  limits:
    - type: Container
      default: {cpu: 500m, memory: 512Mi}
      defaultRequest: {cpu: 100m, memory: 128Mi}
---
# agentregistry <-> its bundled Postgres, plus DNS. Jenkins reaches the API
# only through an RBAC-checked port-forward (batch B).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: same-namespace-and-dns, namespace: ewallet-prompts}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
  egress:
    - to: [{podSelector: {}}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: 34.118.224.10/32}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
