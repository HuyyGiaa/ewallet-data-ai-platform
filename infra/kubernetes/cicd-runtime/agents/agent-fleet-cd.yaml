---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-cd-smoke-script
  namespace: ewallet-cicd
  labels: {app.kubernetes.io/part-of: ewallet-cicd}
data:
  cd_smoke.py: ""
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-cd-smoke
  namespace: ewallet-cicd
  labels: {app.kubernetes.io/part-of: ewallet-cicd}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: ewallet-cicd}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: smoke
          image: __IMAGE__
          command: ["/opt/venv/bin/python", "/cd-smoke/cd_smoke.py", "--mode", "agent", "--release-sha", "__RELEASE_SHA__",
                    "--target", "feature_rag_specialist=http://fleet-cd-feature-rag-specialist:80",
                    "--target", "drift_specialist=http://fleet-cd-drift-specialist:80"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: script, mountPath: /cd-smoke, readOnly: true}
      volumes:
        - name: script
          configMap: {name: fleet-cd-smoke-script}
