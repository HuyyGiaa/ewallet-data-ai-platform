apiVersion: v1
kind: Service
metadata:
  name: fleet-cd-drift-specialist
  namespace: ewallet-cicd
  labels: {app.kubernetes.io/part-of: ewallet-cicd}
spec:
  selector: {app.kubernetes.io/name: fleet-cd-drift-specialist}
