# Row 36 bounded CD target: a Job from the released Flink image. It exercises Block A's
# event semantics and job plan. It does not start a Flink cluster: row 12 owns the
# running-job proof. Placeholders are filled by scripts/ci/bounded_cd.py.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: streaming-cd-smoke-script
  namespace: ewallet-cicd
  labels: {app.kubernetes.io/part-of: ewallet-cicd}
data:
  cd_smoke.py: ""
---
apiVersion: batch/v1
kind: Job
metadata:
  name: streaming-cd-smoke
  namespace: ewallet-cicd
  labels: {app.kubernetes.io/part-of: ewallet-cicd}
  annotations: {ewallet.io/release-sha: "__RELEASE_SHA__"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: ewallet-cicd}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: smoke
          image: __IMAGE__
          command: ["python", "/cd-smoke/cd_smoke.py", "--mode", "streaming", "--release-sha", "__RELEASE_SHA__"]
          env:
            - {name: HOME, value: /tmp}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: script, mountPath: /cd-smoke, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: script
          configMap: {name: streaming-cd-smoke-script}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
