    digest: sha256:d143f368b428c92cccf2b33c4c1b0274f8b1a14cf04f25659fe0f091e96cef6f

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ml-pipeline
      namespace: kubeflow
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ml-pipeline
        namespace: kubeflow
      spec:
        template:
          spec:
            containers:
              - name: ml-pipeline-api-server
                env:
                  - name: V2_DRIVER_IMAGE
                    value: ghcr.io/kubeflow/kfp-driver@sha256:4461e2f63739a80810405fdf76bd4727ea68561a54b51e4bbf869b12d7a8d163
                  - name: V2_LAUNCHER_IMAGE
                    value: ghcr.io/kubeflow/kfp-launcher@sha256:4f1c3cff2725413cbb903f623aed074c52e3c70c355501c87b29db044c83fcd2
  - target:
      version: v1
      kind: ServiceAccount
      name: proxy-agent-runner
      namespace: kubeflow
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: proxy-agent-runner
        namespace: kubeflow
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: proxy-agent-runner
      namespace: kubeflow
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: proxy-agent-runner
        namespace: kubeflow
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: proxy-agent-runner
      namespace: kubeflow
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: proxy-agent-runner
        namespace: kubeflow
  - target:
      version: v1
      kind: ConfigMap
      name: inverse-proxy-config
      namespace: kubeflow
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: inverse-proxy-config
        namespace: kubeflow
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: proxy-agent
      namespace: kubeflow
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: proxy-agent
        namespace: kubeflow
