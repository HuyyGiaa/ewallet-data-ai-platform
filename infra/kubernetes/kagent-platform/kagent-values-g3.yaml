# infra/kubernetes/kagent-pilot/versions.env). Owner decision 2026-11-01:
# kagent without Substrate until the Substrate/gVisor audit is approved, and no
# cluster-scoped object beyond the 9 kagent.dev CRDs (kagent-crds chart).
#  - controller metrics off: the chart renders its two ClusterRoles
#    (metrics-auth, metrics-reader) only when metrics are enabled;
#  - RBAC stays namespaced (rbac.namespaces in kagent-values.yaml);
#  - every kagent pod runs on the temporary G3 nodes, never on MLOps nodes.
