# kagent 0.10.3 controller for the E-Wallet agents (chart pinned by digest in
# infra/kubernetes/kagent-pilot/versions.env). Agents, WorkerPools, prompts and
# RemoteMCPServers come from infra/helm/llm-agent-platform (agents.enabled).
# Runtime-gated: docs/llm_agent/runtime_runbook.md R3.
rbac:
  namespaces:
    - kagent
    - ewallet-agents

controller:
  replicas: 1
  watchNamespaces:
    - ewallet-agents
  # The controller advertises its own A2A endpoint at this base URL. Agent-tool
  # outbound routing is controlled separately by proxy.url below in kagent
  # 0.10.3; A2A_BASE_URL alone does not rewrite remote_agents in config.json.
  a2aBaseUrl: http://a2a-gateway.ewallet-agents.svc.cluster.local:8083
  # Caller budget above the a2a-gateway budget (150 s in llm-agent-platform values).
  a2aClientTimeout: 180s
  auth:
    # Controller API is cluster-internal only; the UI route needs gateway
    # authentication (rubric row 42) before it is exposed.
    mode: unsecure
  metrics:
    enabled: true
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 750m, memory: 512Mi}
  substrate:
    enabled: true
    ateApiEndpoint: dns:///api.ate-system.svc:443
    atenetRouterURL: http://atenet-router.ate-system.svc:80
    ateApiInsecure: false
    ateApiTokenAudience: api.ate-system.svc
    ateApiServer:
      namespace: ate-system
      serviceAccount: ate-api-server

# One WorkerPool per agent is created by llm-agent-platform instead.
substrateWorkerPool:
  create: false

otel:
  tracing:
    enabled: true
    exporter:
      otlp:
        endpoint: otel-collector.ewallet-agents.svc.cluster.local:4317
        protocol: grpc
        timeout: 15000
        insecure: true

database:
  postgres:
    bundled:
      enabled: true
      storage: 256Mi
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 384Mi}

# UI to test agents (rubric row 40); exposed only behind the authenticated route.
ui:
  replicas: 1

providers: null
substrate:
  enabled: false
kmcp:
  enabled: false
kagent-tools:
  enabled: false
grafana-mcp:
  enabled: false
k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
promql-agent:
  enabled: false
observability-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false
oauth2-proxy:
  enabled: false

# kagent 0.10.3 applies this supported controller proxy to internally-built
# Agent-tool URLs and supplies x-kagent-host with the original Agent Service.
# The project A2A gateway matches only the two declared Specialist hosts and
# remains fail-closed for every other destination. RemoteMCPServer URLs use the
# Kubernetes .svc form in llm-agent-platform values, which the pinned
# translator intentionally leaves on the separate MCP Gateway path.
proxy:
  url: http://a2a-gateway.ewallet-agents.svc.cluster.local:8083
