# Dedicated namespace and worker pool for business agents.
#
# WorkerPool has no serviceAccountName field, so worker pods always run as the namespace's
# default account. Giving the pool its own namespace makes that identity unique:
# cluster.local/ns/ewallet-sandbox/sa/default belongs to this pool and nothing else, and it
# holds no RBAC. The pilot in kagent-pilot stays untouched.
apiVersion: v1
kind: Namespace
metadata:
  name: ewallet-sandbox
  labels:
    ewallet.io/experiment: "true"
    # Worker pods need privileged Pod Security, as in kagent-pilot.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# The default account keeps no API token, so a sandbox escape finds no Kubernetes credential.
apiVersion: v1
kind: ServiceAccount
metadata: {name: default, namespace: ewallet-sandbox}
automountServiceAccountToken: false
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: business-agents
  namespace: ewallet-sandbox
  labels: {kagent.dev/worker-pool: business-agents}
spec:
  # Patched v0.0.9 ateom (failed or cancelled activations tear their sandbox down; see
  # infra/kubernetes/kagent-pilot/patches/). Only this campaign pool uses it; kagent-pilot keeps
  # the release image.
  ateomImage: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/substrate-ateom-gvisor:0.0.9-ewallet.0291af52@sha256:c1ddc0446b8ca1c017353c5a5a8336d4c8071d74d3f7472b351a4fd7f7aa7558
  # Two warm workers serve every session of both business Specialists (AGS-04).
  replicas: 2
  sandboxClass: gvisor
  template:
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: 1500m, memory: 2Gi}
