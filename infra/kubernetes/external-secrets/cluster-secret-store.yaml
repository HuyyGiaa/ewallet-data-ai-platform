# Vault V2: the one shared store (docs/edai2/platform/VAULT_V2_ARCHITECTURE_AUDIT.md §7).
#
# eso-vault-reader is an identity only: no pod runs as it, it has no RBAC and mounts no
# token. For each sync the ESO controller requests a short-lived token for it (audience
# "vault") and logs in to Vault role eso-ewallet-reader, whose policy reads only the
# prefixes ewallet/data/ml-platform/ and ewallet/data/agent-platform/ (no list, no metadata).
#
# conditions: ExternalSecrets in exactly these namespaces may use the store. Exact names,
# never a label selector (anyone who may label a namespace would join). Excluded on purpose:
# ewallet-sandbox, ewallet-ci, ewallet-ingress, ewallet-mcp (added only with a Vault-managed
# MCP consumer). The condition does NOT limit which Vault path an allowed ExternalSecret
# requests: that is the Vault policy plus Kubernetes RBAC on ExternalSecret objects (§7.4).
#
# Prerequisite: ConfigMap external-secrets/vault-ca (ca.crt), published by
# scripts/vault/publish_ca.sh. Create, never apply (runbook step 6).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-reader
  namespace: external-secrets
  labels: {app.kubernetes.io/part-of: ewallet-platform}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ewallet-vault
  labels: {app.kubernetes.io/part-of: ewallet-platform}
spec:
  conditions:
    - namespaces: [ml-platform, ewallet-agents]
  provider:
    vault:
      server: https://vault.ewallet-vault.svc.cluster.local:8200
      path: ewallet
      version: v2
      caProvider: {type: ConfigMap, name: vault-ca, key: ca.crt, namespace: external-secrets}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-ewallet-reader
          serviceAccountRef: {name: eso-vault-reader, namespace: external-secrets, audiences: [vault]}
