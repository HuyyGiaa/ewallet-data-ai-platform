# Vault -> ESO -> Kubernetes Secret for namespace ml-platform, through ClusterSecretStore
# ewallet-vault (cluster-secret-store.yaml).
#
# One Vault record for one underlying credential: the Feature API and the Fraud API share
# the Feast online Redis connection string, so both read the same new Secret,
# feast-online-redis-vault. The existing feast-online-redis is not adopted, changed or
# deleted; a consumer switches only through its opt-in overlay
# (infra/helm/ewallet-serving/values-vault-eso.yaml, infra/kubernetes/fraud-serving/fraud-api-eso.patch.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: feast-online-redis
  namespace: ml-platform
  labels: {app.kubernetes.io/part-of: ewallet-platform}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: ewallet-vault}
  target:
    name: feast-online-redis-vault
    # ESO owns this Secret: deleting the ExternalSecret deletes it. Switch both consumers
    # back to feast-online-redis first (runbook, rollback).
    creationPolicy: Owner
    # If the Vault entry disappears, keep the last good value instead of emptying it.
    deletionPolicy: Retain
  data:
    - secretKey: connection_string
      remoteRef: {key: ml-platform/feast-online-redis, property: connection_string}
