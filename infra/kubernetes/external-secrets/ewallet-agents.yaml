# Vault -> ESO -> Kubernetes Secrets for namespace ewallet-agents, through ClusterSecretStore
# ewallet-vault (cluster-secret-store.yaml).
#
# Two credentials, each one Vault record:
#   agent-platform/vllm-api-key            -> vllm-api-key-vault            (vLLM, and agentgateway towards vLLM)
#   agent-platform/agentgateway-client-key -> agentgateway-client-key-vault (agentgateway validator, ModelConfig -> agents)
# The live vllm-api-key and agentgateway-client-key are not adopted, changed or deleted. The
# consumers switch together, in one Helm upgrade, only through the opt-in overlay
# infra/helm/llm-agent-platform/values-vault-eso.yaml (a client and its validator must never disagree).
# The MCP credential releases (mcp-token-*, mcp-auth-*) are NOT managed here (audit §11, MCP-A).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vllm-api-key
  namespace: ewallet-agents
  labels: {app.kubernetes.io/part-of: ewallet-platform}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: ewallet-vault}
  target: {name: vllm-api-key-vault, creationPolicy: Owner, deletionPolicy: Retain}
  data:
    - secretKey: api-key
      remoteRef: {key: agent-platform/vllm-api-key, property: api-key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-client-key
  namespace: ewallet-agents
  labels: {app.kubernetes.io/part-of: ewallet-platform}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: ewallet-vault}
  target: {name: agentgateway-client-key-vault, creationPolicy: Owner, deletionPolicy: Retain}
  data:
    - secretKey: api-key
      remoteRef: {key: agent-platform/agentgateway-client-key, property: api-key}
