# Official chart external-secrets 2.14.0 (sha256 0a6d9e91...5e34), ESO v2.14.0, from
# https://charts.external-secrets.io. One installation serves every namespace.
#
# Vault V2 (docs/edai2/platform/VAULT_V2_ARCHITECTURE_AUDIT.md §7): one ClusterSecretStore,
# ewallet-vault (cluster-secret-store.yaml), restricted to an exact namespace list. The
# chart turns processClusterStore into the controller flag --enable-cluster-store-reconciler.
# ClusterExternalSecret, PushSecret and ClusterPushSecret stay off: nobody can fan a Secret
# out to every namespace, and ESO never writes back to Vault. Namespaced SecretStores are
# still processed (chart default); one can only use a ServiceAccount of its own namespace,
# and the Vault reader role binds external-secrets/eso-vault-reader alone.
installCRDs: true
processClusterStore: true
processClusterExternalSecret: false
processPushSecret: false
processClusterPushSecret: false
image: &image
  repository: ghcr.io/external-secrets/external-secrets
  tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {cpu: 200m, memory: 256Mi}
# The webhook rejects malformed SecretStore/ExternalSecret objects at apply time; the
# cert-controller rotates the webhook's own certificate. Neither talks to Vault.
webhook:
  image: *image
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}
certController:
  image: *image
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}
