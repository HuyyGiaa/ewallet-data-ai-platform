# Strategic merge patch (Vault V2): the Fraud API reads the Feast Redis connection string from
# the ESO-synced Secret feast-online-redis-vault, the same Secret as the Feature API
# (infra/kubernetes/external-secrets/ml-platform.yaml). Only the Secret name changes; the pod
# gets no Vault token, address or CA. Apply after shadow_compare.sh reports SHADOW_MATCH:
#   kubectl -n ml-platform patch deployment fraud-api --type=strategic --patch-file infra/kubernetes/fraud-serving/fraud-api-eso.patch.yaml
# Rollback: `kubectl -n ml-platform rollout undo deployment/fraud-api` (the base manifest keeps feast-online-redis).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  namespace: ml-platform
spec:
  template:
    spec:
      containers:
        - name: fraud-api
          env:
            - name: EWALLET_REDIS_CONNECTION_STRING
              valueFrom:
                secretKeyRef: {name: feast-online-redis-vault, key: connection_string}
