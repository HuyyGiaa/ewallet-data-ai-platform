# Source Parquet datasets (schema source_zone) as external tables over the
# immutable source dataset. External tables are never written by Trino.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=local:///metastore/hive
fs.native-local.enabled=true
local.location=/home/trino
fs.native-gcs.enabled=true
gcs.json-key-file-path=/var/run/gcp/adc.json
hive.non-managed-table-writes-enabled=false
hive.timestamp-precision=MICROSECONDS
