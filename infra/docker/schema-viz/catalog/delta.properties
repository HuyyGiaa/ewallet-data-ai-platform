# Bronze, Silver and Gold Delta tables of the canonical cloud runs (schemas
# bronze_zone, silver_zone, gold_zone). Registrations live in a local file metastore.
connector.name=delta_lake
hive.metastore=file
hive.metastore.catalog.dir=local:///metastore/delta
fs.native-local.enabled=true
local.location=/home/trino
fs.native-gcs.enabled=true
gcs.json-key-file-path=/var/run/gcp/adc.json
delta.register-table-procedure.enabled=true
