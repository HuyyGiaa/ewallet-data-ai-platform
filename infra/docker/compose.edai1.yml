services:
  datahub-lineage-publisher:
    image: edai1/datahub-lineage-publisher:compose-v5
    build:
      context: ../..
      dockerfile: images/datahub-publisher/Dockerfile
      target: optimized
    command: ["--output", "/tmp/lineage-plan.json"]
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev,noexec
    network_mode: none
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: "no"
    profiles: ["edai1"]
