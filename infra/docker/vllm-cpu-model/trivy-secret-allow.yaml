# Trivy secret allow-list for the vllm-cpu-model image: NOT wired into scan_and_push.sh
# until the owner approves (docs/llm_agent/gke_cpu_runtime.md, "Image vulnerability gate").
# False positive: rule gcp-service-account matches the anthropic SDK docstring
#   sending `{"type": "service_account"}` stores the default.
# (no private_key; same 11 matches in the unmodified upstream image). Exact files only;
# vulnerability scanning and every other path stay under the HIGH/CRITICAL gate.
allow-rules:
  - id: anthropic-sdk-execution-identity-docstring-1
    description: anthropic SDK docstring, not a credential
    path: '^opt/venv/lib/python3\.12/site\-packages/anthropic/resources/beta/agents/__pycache__/agents\.cpython\-312\.pyc$'
  - id: anthropic-sdk-execution-identity-docstring-2
    description: anthropic SDK docstring, not a credential
    path: '^opt/venv/lib/python3\.12/site\-packages/anthropic/resources/beta/agents/agents\.py$'
  - id: anthropic-sdk-execution-identity-docstring-3
    description: anthropic SDK docstring, not a credential
    path: '^opt/venv/lib/python3\.12/site\-packages/anthropic/types/beta/agent_create_params\.py$'
  - id: anthropic-sdk-execution-identity-docstring-4
    description: anthropic SDK docstring, not a credential
    path: '^opt/venv/lib/python3\.12/site\-packages/anthropic/types/beta/agent_update_params\.py$'
  - id: anthropic-sdk-execution-identity-docstring-5
    description: anthropic SDK docstring, not a credential
    path: '^opt/venv/lib/python3\.12/site\-packages/anthropic/types/beta/beta_managed_agents_agent\.py$'
  - id: anthropic-sdk-execution-identity-docstring-6
    description: anthropic SDK docstring, not a credential
    path: '^opt/venv/lib/python3\.12/site\-packages/anthropic/types/beta/beta_managed_agents_session_agent\.py$'
  - id: anthropic-sdk-execution-identity-docstring-7
    description: anthropic SDK docstring, not a credential
    path: '^opt/venv/lib/python3\.12/site\-packages/anthropic/types/beta/beta_managed_agents_session_thread_agent\.py$'
