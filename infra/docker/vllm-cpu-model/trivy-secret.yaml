# Trivy secret-scanner config for the vllm-cpu-model image only
# (scripts/llm_agent/scan_and_push.sh passes it as --secret-config).
#
# Nothing is disabled and no path is allowed. One global exclude-block removes a
# finding only when the match lies entirely inside one of three fixed phrases of
# the anthropic SDK's `execution_identity` docstring (a vLLM 0.32.0
# dependency), read verbatim from the image (9 .py lines in 6 files + 2 matches
# in agents.cpython-312.pyc):
#     sending `{"type": "service_account"}` stores the default.
#     send null or `{"type": "service_account"}` [to restore the default.]
#     Always present; `{"type": "service_account"}` when runs carry no customer-named
# gcp-service-account matches `"type": "service_account"` there (Trivy 0.75.0
# builtin rule). The sentence holds no credential; a real service-account key
# is `{"type": "service_account", "project_id": ...` and its own match lies
# outside any such block, so it is still reported, in the same files too
# (tests/llm_agent/test_trivy_secret_config.py). Audit trail of the 11 excluded
# findings: docs/evidence/llm_agent/gke_cpu/trivy_vllm_cpu_20261031.json.
exclude-block:
  description: anthropic SDK docstring for execution_identity, not a credential
  regexes:
    - 'sending `\{"type": "service_account"\}` stores the'
    - 'send null or `\{"type": "service_account"\}`'
    - 'Always present; `\{"type": "service_account"\}` when runs carry no customer-named'
