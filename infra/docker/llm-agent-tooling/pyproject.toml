[project]
name = "ewallet-llm-agent-mcp"
version = "0.1.0"
description = "Phase D MCP tool servers (feature-rag-mcp, drift-mcp)"
# Local tests run on 3.10 (conda ewallet-ml base); the server image runs 3.12.
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.159.1",
  "numpy==2.2.6",
  "opentelemetry-api==1.45.1",
  "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "pandas==2.3.3",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
# Only feature-rag-mcp's production wiring imports Feast.
feast = [
  "feast[redis]==0.67.0",
]
# Query-time embeddings for knowledge_search (feast-online-exact, local-onnx):
# the same pins as the rag-ingestion runtime, so queries and the published
# corpus share one MiniLM ONNX model and tokenizer.
rag-query = [
  "huggingface-hub==2.4.0",
  "onnxruntime==1.23.2",
  "tokenizers==0.23.3",
]

[dependency-groups]
# Official MCP Python SDK, used only by the conformance tests.
dev = [
  "mcp==2.3.0",
]
# CI test runner only, never installed into an image (images sync with --no-dev).
# httpx is what tests/experiments/test_mcp_experiment drives the MCP server with.
# jsonschema: the chart/schema tests validate rendered objects against pinned schemas
# (test_c5_keda_chart, test_phase_abc_p0_fixes, test_session_a_charts); it was only
# reachable through mcp (dev group) before, at the same locked version.
# test_vllm_model_image imports a Python 3.12 build script: run this group with --python 3.12.
test = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pytest==9.2.0",
]

[tool.uv]
package = false
