[project]
name = "ewallet-llm-agent-mcp"
version = "0.1.0"
description = "Phase D MCP tool servers (feature-rag-mcp, drift-mcp)"
# Local tests run on 3.10 (conda ewallet-ml base); the server image runs 3.12.
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.159.1",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
# Only feature-rag-mcp's production wiring imports Feast.
feast = [
  "feast[redis]==0.66.0",
]

[dependency-groups]
# Official MCP Python SDK, used only by the conformance tests.
dev = [
  "mcp==2.3.0",
]

[tool.uv]
package = false
