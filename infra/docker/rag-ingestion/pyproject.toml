[project]
name = "ewallet-rag-ingestion"
version = "0.1.0"
description = "Task runtime for the rag_fraud_policy_ingestion Airflow DAG (parse, chunk, embed, Feast publish, DataHub)"
# Own interpreter: the Airflow BashOperator runs this venv (rag_params.rag_python), not Airflow's Python.
# 3.11 so the patched filelock (>= 4.2.1, CVE-2026-112940) installs; Feast 0.67.0 fixes CVE-2026-18948.
requires-python = ">=3.11,<3.12"
dependencies = [
    "acryl-datahub[datahub-rest]==1.7.0.5",
    "feast[gcp,redis]==0.67.0",
    "gcsfs==2025.12.0",
    "huggingface-hub==2.4.0",
    "numpy==2.2.6",
    "onnxruntime==1.23.2",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "tokenizers==0.23.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
