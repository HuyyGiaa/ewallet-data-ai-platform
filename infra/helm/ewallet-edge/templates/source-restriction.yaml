{{- if and .Values.enabled .Values.sourceRestriction.enabled }}
{{- $r := .Values.sourceRestriction }}
{{- if not $r.allowedCidrs }}
{{- fail "sourceRestriction.allowedCidrs is empty: list the owner-approved client CIDRs, or disable the restriction" }}
{{- end }}
{{- range $r.allowedCidrs }}
{{- if not (regexMatch "^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/([0-9]|[12][0-9]|3[0-2])$" .) }}
{{- fail (printf "sourceRestriction.allowedCidrs: %q is not an IPv4 CIDR" .) }}
{{- end }}
{{- if hasSuffix "/0" . }}
{{- fail (printf "sourceRestriction.allowedCidrs: %q allows every address" .) }}
{{- end }}
{{- /* A private or shared range could match the address of a SNAT'd node or pod, which
would let any client through; a short prefix is not an owner's or grader's address. */}}
{{- if not $r.allowPrivateCidrs }}
{{- $ip := index (splitList "/" .) 0 }}
{{- $o := splitList "." $ip }}
{{- $a := atoi (index $o 0) }}{{- $b := atoi (index $o 1) }}
{{- if or (eq $a 10) (eq $a 127) (and (eq $a 169) (eq $b 254)) (and (eq $a 172) (ge $b 16) (le $b 31)) (and (eq $a 192) (eq $b 168)) (and (eq $a 100) (ge $b 64) (le $b 127)) }}
{{- fail (printf "sourceRestriction.allowedCidrs: %q is a private or shared range (a SNAT'd address could match it)" .) }}
{{- end }}
{{- if lt (atoi (index (splitList "/" .) 1)) 16 }}
{{- fail (printf "sourceRestriction.allowedCidrs: %q is wider than /16" .) }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $r.routes }}
{{- fail "sourceRestriction.routes is empty" }}
{{- end }}
{{- $hosts := list }}
{{- range $r.routes }}
{{- $route := index $.Values.routes . }}
{{- if not (and $route $route.enabled) }}
{{- fail (printf "sourceRestriction.routes: %s is not an enabled route" .) }}
{{- end }}
{{- $host := printf "%s.%s" $route.hostPrefix $.Values.domain }}
{{- $hosts = concat $hosts (list $host (printf "%s:*" $host)) }}
{{- end }}
---
# Requests for these hosts are refused (403) unless the TCP peer address Envoy sees is in
# the allowlist. ipBlocks is that peer address, never X-Forwarded-For, so a client cannot
# claim an allowed address in a header. The ":*" form also matches a Host header that
# carries a port. Only the HTTPS listener: port 80 serves nothing but the redirect and, while
# a certificate is issued, the ACME token, which Let's Encrypt must reach from anywhere.
# Only meaningful when the client address reaches Envoy unchanged: on GKE, a LoadBalancer
# Service with externalTrafficPolicy Local (values-gateway-public.yaml).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: edge-source-restriction
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ewallet-edge.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.gatewaySelector | nindent 6 }}
  action: DENY
  rules:
    - from:
        - source:
            notIpBlocks: {{ toJson $r.allowedCidrs }}
      to:
        - operation:
            hosts: {{ toJson $hosts }}
            ports: [{{ .Values.httpsListenerPort | quote }}]
{{- end }}
