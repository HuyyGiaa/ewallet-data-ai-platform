# Nothing renders unless enabled. The proxy Deployment and Service come from the official
# istio/gateway chart (values-gateway.yaml); this chart adds the Gateway API resources that
# configure it. Gateway API CRDs must be installed in the cluster.
enabled: false

# Required once enabled. No default on purpose: hostnames must be owner-approved.
domain: ""
# Must equal the Helm release namespace; the chart refuses to render otherwise.
namespace: ewallet-ingress
gatewayClassName: istio
# The Service of the istio/gateway release. The Gateway binds to it by address, so Istio
# programs those pods and provisions no Deployment or LoadBalancer of its own.
gatewayService: ewallet-edge-gateway
gatewaySelector: {istio: ewallet-edge-gateway}
gatewayServiceAccount: ewallet-edge-gateway

tls:
  secretName: edge-tls
  # Issue with cert-manager. Off means the owner supplies the Secret.
  certificate:
    enabled: false
    issuerName: ""
    issuerKind: ClusterIssuer

# Security filters attach to this listener only. Port 80 must stay a bare redirect, or a
# client would be asked for its password over plain HTTP.
httpsListenerPort: 443

# Migration guard. The Basic Auth and rate-limit EnvoyFilter was written for the Istio
# Gateway API predecessor and is not yet verified on Gateway API listeners (G2.2). While
# false, the EnvoyFilter is not rendered and routes render only for a reserved .test domain,
# so no real hostname can be routed without authentication.
securityFiltersVerified: false

basicAuth:
  # Mounted into the gateway from a Secret that scripts/edge/create_basic_auth.sh creates.
  usersFile: /etc/edge-auth/htpasswd
  realm: E-Wallet

# Applied to every route without its own limit, so no route can run unlimited.
defaultRateLimit: {maxTokens: 200, tokensPerFill: 200, fillIntervalSeconds: 1}

# Headers a client must never set. The router drops them before the upstream sees them,
# and Authorization stops here so a password never reaches an application.
strippedHeaders: [authorization, x-user-id, x-forwarded-user, x-remote-user, x-edge-user]

# Only these four backends are public. Fraud API, the Coordinator's A2A endpoint, MCP,
# model serving and Redis have no route. Match types: exact or prefix (Gateway API
# PathPrefix, which stops at a path-segment boundary). Service names, ports and labels were
# read from the cluster on 2026-11-07.
routes:
  feature-api:
    enabled: false
    hostPrefix: features
    match: [{exact: /v1/features/lookup, method: POST}]
    backend: {service: feature-api, namespace: ml-platform, port: 80}
    timeout: 5s
    rateLimit: {maxTokens: 100, tokensPerFill: 100, fillIntervalSeconds: 1}
    access: {namespace: ml-platform, podLabels: {app.kubernetes.io/name: feature-api}, port: 8080}
  kagent-ui:
    enabled: false
    hostPrefix: agents
    match: [{prefix: /}]
    backend: {service: kagent-ui, namespace: kagent, port: 8080}
    rateLimit: {maxTokens: 100, tokensPerFill: 100, fillIntervalSeconds: 1}
    access:
      namespace: kagent
      podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: ui}
      port: 8080
      ambient: true
  agent-registry:
    enabled: false
    hostPrefix: registry
    match: [{prefix: /}]
    backend: {service: prompt-registry-agentregistry, namespace: ewallet-prompts, port: 12121}
    rateLimit: {maxTokens: 50, tokensPerFill: 50, fillIntervalSeconds: 1}
  # Rows 37-39: metrics, logs and traces are all read through Grafana.
  grafana:
    enabled: false
    hostPrefix: observe
    match: [{prefix: /}]
    backend: {service: grafana, namespace: ewallet-agents, port: 3000}
    rateLimit: {maxTokens: 50, tokensPerFill: 50, fillIntervalSeconds: 1}
    access:
      namespace: ewallet-agents
      podLabels: {app.kubernetes.io/name: grafana}
      port: 3000
      ambient: true
      authorizationPolicy: true
