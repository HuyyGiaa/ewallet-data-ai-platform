# Nothing renders unless enabled. The proxy itself comes from the official istio/gateway
# chart (values-gateway.yaml). This chart adds only Istio's existing CRDs, so no Gateway
# API CRDs and no other ingress controller are needed.
enabled: false

# Required once enabled. No default on purpose: hostnames must be owner-approved.
domain: ""
namespace: ewallet-edge
gatewaySelector: {istio: ewallet-edge-gateway}
gatewayServiceAccount: ewallet-edge-gateway

tls:
  secretName: edge-tls
  minProtocolVersion: TLSV1_2
  # Issue with cert-manager. Off means the owner supplies the Secret.
  certificate:
    enabled: false
    issuerName: ""
    issuerKind: ClusterIssuer

# Security filters attach to this listener only. Port 80 must stay a bare redirect, or a
# client would be asked for its password over plain HTTP.
httpsListenerPort: 443

basicAuth:
  # Mounted into the gateway from a Secret that scripts/edge/create_basic_auth.sh creates.
  usersFile: /etc/edge-auth/htpasswd
  realm: E-Wallet

# Applied to every route without its own limit, so no route can run unlimited.
defaultRateLimit: {maxTokens: 200, tokensPerFill: 200, fillIntervalSeconds: 1}

# Headers a client must never set. The router drops them before the upstream sees them,
# and Authorization stops here so a password never reaches an application.
strippedHeaders: [authorization, x-user-id, x-forwarded-user, x-remote-user, x-edge-user]

# Service names, ports and labels below were read from the cluster on 2026-11-07.
routes:
  feature-api:
    enabled: false
    hostPrefix: features
    match: [{exact: /v1/features/lookup, method: POST}]
    destination: {host: feature-api.ml-platform.svc.cluster.local, port: 80}
    timeout: 5s
    rateLimit: {maxTokens: 100, tokensPerFill: 100, fillIntervalSeconds: 1}
    access: {namespace: ml-platform, podLabels: {app.kubernetes.io/name: feature-api}, port: 8080}
  fraud-api:
    enabled: false
    hostPrefix: fraud
    match: [{exact: /v1/fraud/predict, method: POST}]
    destination: {host: fraud-api.ml-platform.svc.cluster.local, port: 80}
    timeout: 10s
    rateLimit: {maxTokens: 50, tokensPerFill: 50, fillIntervalSeconds: 1}
    access: {namespace: ml-platform, podLabels: {app.kubernetes.io/name: fraud-api}, port: 8080}
  # One agent only, through the controller's own A2A proxy. Istio prefixes do not stop at a
  # path boundary, so the bare name must be exact and the prefix must end in a slash, or
  # fraud-coordinator-other would match. X-User-Id is fixed because the controller trusts it.
  a2a:
    enabled: false
    hostPrefix: a2a
    match:
      - {exact: /api/a2a/ewallet-agents/fraud-coordinator}
      - {prefix: /api/a2a/ewallet-agents/fraud-coordinator/}
    destination: {host: kagent-controller.kagent.svc.cluster.local, port: 8083}
    setHeaders: {x-user-id: edge-a2a-client}
    rateLimit: {maxTokens: 5, tokensPerFill: 5, fillIntervalSeconds: 1}
    access:
      namespace: kagent
      podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}
      port: 8083
      ambient: true
  kagent-ui:
    enabled: false
    hostPrefix: agents
    match: [{prefix: /}]
    destination: {host: kagent-ui.kagent.svc.cluster.local, port: 8080}
    rateLimit: {maxTokens: 100, tokensPerFill: 100, fillIntervalSeconds: 1}
    access:
      namespace: kagent
      podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: ui}
      port: 8080
      ambient: true
  agent-registry:
    enabled: false
    hostPrefix: registry
    match: [{prefix: /}]
    destination: {host: prompt-registry-agentregistry.ewallet-prompts.svc.cluster.local, port: 12121}
    rateLimit: {maxTokens: 50, tokensPerFill: 50, fillIntervalSeconds: 1}
  # Rows 37-39: metrics, logs and traces are all read through Grafana.
  grafana:
    enabled: false
    hostPrefix: grafana
    match: [{prefix: /}]
    destination: {host: grafana.ewallet-agents.svc.cluster.local, port: 3000}
    rateLimit: {maxTokens: 50, tokensPerFill: 50, fillIntervalSeconds: 1}
    access:
      namespace: ewallet-agents
      podLabels: {app.kubernetes.io/name: grafana}
      port: 3000
      ambient: true
      authorizationPolicy: true
