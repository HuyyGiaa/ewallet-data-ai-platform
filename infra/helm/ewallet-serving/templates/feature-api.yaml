{{- if .Values.featureApi.enabled }}
{{- $f := .Values.featureApi }}
{{- if not (regexMatch "^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$" $f.image) }}
{{- fail "featureApi.image must be pinned by digest" }}
{{- end }}
{{- if not $f.registryUri }}
{{- fail "featureApi.registryUri must name the online Feast registry" }}
{{- end }}
{{- $sa := $f.serviceAccount }}
{{- if has $sa.name (list "training" "fraud-api" "default") }}
{{- fail "featureApi.serviceAccount.name must be the Feature API's own account" }}
{{- end }}
{{- if and $f.vault.enabled (ne $f.vault.role "feature-api") }}
{{- fail "featureApi.vault.role must be feature-api; never borrow another workload's role" }}
{{- end }}
{{- if and $sa.create (not (regexMatch "^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z0-9-]+\\.iam\\.gserviceaccount\\.com$" $sa.gcpServiceAccount)) }}
{{- fail "featureApi.serviceAccount.gcpServiceAccount must name the Workload Identity GSA" }}
{{- end }}
{{- if $sa.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ewallet-serving.labels" . | nindent 4 }}
    app.kubernetes.io/name: feature-api
  annotations:
    iam.gke.io/gcp-service-account: {{ $sa.gcpServiceAccount }}
automountServiceAccountToken: false
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: feature-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ewallet-serving.labels" . | nindent 4 }}
    app.kubernetes.io/name: feature-api
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: feature-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ewallet-serving.labels" . | nindent 4 }}
    app.kubernetes.io/name: feature-api
spec:
  {{- if not (and .Values.autoscaling.enabled (dig "feature-api" "enabled" false .Values.autoscaling.targets)) }}
  replicas: {{ $f.replicas }}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: feature-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: feature-api}
    spec:
      serviceAccountName: {{ $sa.name }}
      automountServiceAccountToken: false
      {{- with $f.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: feature-api
          image: {{ $f.image }}
          command: ["python", "-m", "ai_platform.inference.feature_server"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: EWALLET_FEAST_REGISTRY
              value: {{ $f.registryUri | quote }}
            - name: EWALLET_FEAST_TIMEOUT_SECONDS
              value: {{ $f.timeoutSeconds | quote }}
            {{- if $f.vault.enabled }}
            - name: EWALLET_VAULT_ADDR
              value: {{ $f.vault.address | quote }}
            - name: EWALLET_VAULT_ROLE
              value: {{ $f.vault.role | quote }}
            - name: EWALLET_VAULT_CA_PATH
              value: /var/run/secrets/vault-ca/ca.crt
            - name: EWALLET_VAULT_SECRETS
              value: {{ dict "EWALLET_REDIS_CONNECTION_STRING" $f.vault.secret | toJson | quote }}
            {{- else }}
            - name: EWALLET_REDIS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ $f.redisSecret.name }}
                  key: {{ $f.redisSecret.key }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml $f.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          {{- if $f.vault.enabled }}
          volumeMounts:
            - {name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true}
            - {name: vault-ca, mountPath: /var/run/secrets/vault-ca, readOnly: true}
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken: {path: token, audience: vault, expirationSeconds: 600}
        - name: vault-ca
          configMap: {name: {{ $f.vault.caConfigMap }}}
          {{- end }}
---
# Additive: the Redis policy in infra/kubernetes/feast-online stays as it is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-clients-feature-api
  namespace: feature-store
  labels:
    {{- include "ewallet-serving.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.namespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: feature-api}
      ports:
        - {port: 6379, protocol: TCP}
{{- end }}
