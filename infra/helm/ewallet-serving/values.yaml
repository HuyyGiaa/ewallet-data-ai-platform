# Nothing renders until a section is enabled. The Fraud API Deployment itself stays
# owned by infra/kubernetes/fraud-serving; this chart only adds what scales around it.
namespace: ml-platform

prometheus:
  serverAddress: http://prometheus.ewallet-agents.svc.cluster.local:9090
  namespace: ewallet-agents
  podLabels: {app.kubernetes.io/name: prometheus}

featureApi:
  enabled: false
  # The Fraud API image holds the Feature API too; pin it by digest.
  image: ""
  replicas: 1
  # R2: the Feature API's own identity, never training's or the Fraud API's.
  serviceAccount:
    create: true
    name: feature-api
    # Workload Identity GSA ewallet-feature-api@<project>.iam.gserviceaccount.com,
    # which may read only the online Feast registry prefix. Required when create is true.
    gcpServiceAccount: ""
  # Optional: read the Redis connection string from Vault with the feature-api role.
  # Off, the Deployment reads featureApi.redisSecret as before.
  vault:
    enabled: false
    address: https://vault.ewallet-vault.svc.cluster.local:8200
    role: feature-api
    secret: feature-api/feast-redis#connection_string
    caConfigMap: vault-ca
  registryUri: ""
  redisSecret: {name: feast-online-redis, key: connection_string}
  timeoutSeconds: "2.0"
  nodeSelector:
    iam.gke.io/gke-metadata-server-enabled: "true"
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

# Per-pod scrape targets. Prometheus must see every replica: a scrape through a normal
# Service samples one pod at a time, which breaks rate() as soon as replicas change.
metricsDiscovery:
  enabled: false
  fraudApiSelector: {app.kubernetes.io/name: fraud-api}

autoscaling:
  enabled: false
  # Calibrated from the G5-A GKE baseline (docs/edai2/testing/ROW_32_LOCUST_GKE.md), one replica,
  # 1 CPU limit: Feature API saturates at about 86 req/s, Fraud API at about 24.5 req/s.
  # The request-rate trigger is AverageValue, so the HPA computes
  #   desired = ceil(sum of per-pod request rates / requestsPerSecondPerReplica)
  # and a threshold near 70% of the measured ceiling scales out before a replica saturates.
  # cooldownSeconds applies only to scale-to-zero, which minReplicas 1 rules out; scale-down
  # pace comes from scaleDown below (120 s window, then one pod per 60 s).
  defaults:
    minReplicas: 1
    maxReplicas: 3
    pollingIntervalSeconds: 15
    cooldownSeconds: 120
    fallback: {failureThreshold: 3, replicas: 1, behavior: currentReplicasIfHigher}
    scaleUp: {stabilizationWindowSeconds: 0, pods: 1, periodSeconds: 30}
    scaleDown: {stabilizationWindowSeconds: 120, pods: 1, periodSeconds: 60}
  # A latency trigger (latencyQuery, latencySeconds) stays available but is off. Under a closed
  # load loop latency rises with users even at matched capacity. For the Fraud API it is driven
  # by the single KServe predictor, which more Fraud API replicas cannot relieve, so it would
  # pin the API at maxReplicas.
  targets:
    feature-api:
      enabled: true
      requestsPerSecondPerReplica: "60"
      query: sum(rate(feature_api_requests_total{job="feature-api-pods"}[1m])) or vector(0)
      latencySeconds: ""
      latencyQuery: ""
    fraud-api:
      enabled: true
      requestsPerSecondPerReplica: "17"
      query: sum(rate(fraud_inference_requests_total{job="fraud-api-pods"}[1m])) or vector(0)
      latencySeconds: ""
      latencyQuery: ""
