metadata:
  name: ewallet-fraud-llm
  namespace: ewallet-agents
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: llm-inference-gateway
  rules:
  - backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: ewallet-fraud-llm
    matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 15s
