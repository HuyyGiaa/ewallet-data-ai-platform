# KEDA 2.21.0 operator, small footprint. It watches the agent namespace and the serving
# namespace, and no other.
watchNamespace: ewallet-agents,ml-platform
resources:
  operator:
    requests: {cpu: 50m, memory: 100Mi}
    limits: {cpu: 500m, memory: 500Mi}
  metricServer:
    requests: {cpu: 50m, memory: 100Mi}
    limits: {cpu: 500m, memory: 500Mi}
  webhooks:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
# Only the operator queries Prometheus. Enrolling this one pod in ambient gives it the mTLS
# identity that infra/kubernetes/experiments/keda-prometheus-access.yaml admits.
podLabels:
  keda:
    istio.io/dataplane-mode: ambient
