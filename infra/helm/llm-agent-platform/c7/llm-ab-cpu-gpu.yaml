# EXP-V3B: Qwen3-0.6B on CPU and Qwen3-1.7B on one L4 behind one weighted name. Model
# and hardware differ together, so this proves routing and attribution, not which
# model is faster. The deploy step sets vllmCandidate.image to the built digest.
modelExperiments:
  enabled: true
  models:
    - {name: ewallet-llm-qwen3-1-7b, servedModel: ewallet-fraud-llm-1-7b, service: vllm-candidate, backendLabel: qwen3-1-7b}
  virtualModels:
    - name: ewallet-llm-ab
      targets:
        - {model: ewallet-fraud-llm-primary, weight: 90}
        - {model: ewallet-llm-qwen3-1-7b, weight: 10}
vllmCandidate:
  enabled: true
  accelerator: gpu
  modelPath: /models/Qwen3-1.7B/70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  nodeSelector:
    cloud.google.com/gke-accelerator: nvidia-l4
  tolerations:
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
    - {key: cloud.google.com/gke-spot, operator: Exists, effect: NoSchedule}
  resources:
    # g2-standard-4 leaves about 3 CPU and 11.6 GiB after DaemonSets.
    requests: {cpu: 2500m, memory: 10Gi, nvidia.com/gpu: 1}
    limits: {cpu: "3", memory: 11Gi, nvidia.com/gpu: 1}
