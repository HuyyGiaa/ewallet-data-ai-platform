# EXP-AGENT-AB on the existing CPU vLLM: same model, two model configurations of the
# Coordinator's tool-selection call. Needs no GPU. Layer after g3/g3.yaml.
# Variant weights are the rollback: 100/0 returns every conversation to baseline.
modelExperiments:
  enabled: true
  models:
    - {name: ewallet-agent-candidate-route, servedModel: ewallet-fraud-llm-v1, service: vllm-primary, backendLabel: agent-candidate}
  virtualModels:
    - name: ewallet-agent-candidate
      targets:
        - {model: ewallet-agent-candidate-route, weight: 100}
agents:
  coordinator:
    byo:
      abExperiment:
        enabled: true
        experimentId: agent-ab-config-v1
        salt: c7-2-2026-11
        variants:
          - {name: baseline, weight: 50, model: ewallet-fraud-llm, temperature: 0, max_tokens: 384}
          - {name: candidate, weight: 50, model: ewallet-agent-candidate, temperature: 0.3, max_tokens: 256}
