{{- if .Values.modelConfig.enabled }}
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: {{ .Values.modelConfig.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "llm-agent-platform.labels" . | nindent 4 }}
spec:
  apiKeySecret: {{ .Values.modelConfig.apiKeySecret.name }}
  apiKeySecretKey: {{ .Values.modelConfig.apiKeySecret.key }}
  provider: OpenAI
  model: {{ .Values.modelConfig.model }}
  openAI:
    baseUrl: {{ include "llm-agent-platform.modelConfigBaseUrl" . }}
    timeout: {{ .Values.modelConfig.timeoutSeconds }}
{{- end }}
