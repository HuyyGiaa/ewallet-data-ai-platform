{{- if .Values.dashboards.enabled }}
# Grafana dashboard, picked up by the Grafana sidecar (label grafana_dashboard).
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-agent-dashboards
  namespace: {{ .Values.dashboards.namespace | default .Values.namespace.name }}
  labels:
    {{- include "llm-agent-platform.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  llm-agent.json: {{ .Files.Get "dashboards/llm-agent.json" | quote }}
  platform-overview.json: {{ .Files.Get "dashboards/platform-overview.json" | quote }}
  llm-runtime.json: {{ .Files.Get "dashboards/llm-runtime.json" | quote }}
  agent-mcp.json: {{ .Files.Get "dashboards/agent-mcp.json" | quote }}
  ml-platform.json: {{ .Files.Get "dashboards/ml-platform.json" | quote }}
  distributed-tracing.json: {{ .Files.Get "dashboards/distributed-tracing.json" | quote }}
  logs-operations.json: {{ .Files.Get "dashboards/logs-operations.json" | quote }}
  ml-drift-pipeline.json: {{ .Files.Get "dashboards/ml-drift-pipeline.json" | quote }}
{{- end }}
