{{- $retired := include "llm-agent-platform.retiredWorkloads" . | fromYamlArray }}
{{- range .Values.serviceAccounts }}
{{- if not (has . $retired) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "llm-agent-platform.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
