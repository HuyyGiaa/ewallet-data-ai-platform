# GKE ewallet-dev CPU profile (owner decision 2026-10-31: CPU vLLM is the
# runtime target, no GPU). Self-contained overlay on values.yaml, like
# values-dev/gcp (deploy_atomic.sh, rollback.sh, Jenkinsfile ENVIRONMENT=gke-cpu).
# Stage G1: ModelConfig -> agentgateway -> vLLM CPU primary + fallback.
# Later stages switch on llmd / agents / gateways with --set, as in
# docs/llm_agent/gke_cpu_runtime.md. Node budget: cpu-pool e2-standard-4
# (AVX2; the pinned vllm-openai-cpu image already ran on an AVX2-only host).

# ewallet-dev runs NodeLocal DNSCache.
networkPolicy:
  dns:
    nodeLocalIP: 169.254.20.10

gateway:
  # No external exposure until a hostname, TLS secret and Gateway API CRDs are
  # approved; G1 is reached with kubectl port-forward only.
  enabled: false

vllm:
  # The pinned revision is baked into infra/docker/vllm-cpu-model, so vLLM pods
  # need no Internet egress under enforced NetworkPolicy (HuggingFace's CDN has
  # no stable CIDR). Until that image is built, scanned and pushed (owner
  # approval) and its digest set here, this profile refuses to render.
  image: ""
  modelSource:
    mode: image
    image:
      path: /models/Qwen3-0.6B/c1899de289a04d12100db370d81485cdf75e47ca
  # Replace in place: a surge pod needs another 2 free CPUs, which the
  # 2-3 node budget does not have.
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
  primary:
    replicas: 1
  fallback:
    replicas: 1

# CPU budgets, the same nesting as values-local.yaml (a 256-token tool call on
# 2 CPU threads takes ~40-80 s; the base GCP budgets of 35/28/20 s would 504).
# Pairs with infra/helm/llm-d/router-values-local.yaml (155 s) and
# infra/kubernetes/kagent-platform/kagent-values-local.yaml (700 s).
agentgateway:
  requestTimeout: 180s
  llmRequestTimeout: 170s
  backendRequestTimeout: 160s
  responseIdleTimeout: 160s

modelConfig:
  timeoutSeconds: 200

a2aGateway:
  requestTimeout: 660s
