# CI/CD V2-P1 — isolated Agent staging profile (Architecture A′, docs/workplans/edai2/CICD_V2_P1_CONFIG_ISOLATION.md).
#
# PROPOSED, OFFLINE ONLY. Nothing here has been deployed; staging has not been runtime-verified on GKE.
#
# One release, `llm-agent-staging`, in ewallet-agents-staging, layered on the chart defaults only:
#
#   helm template llm-agent-staging infra/helm/llm-agent-platform -f values-staging.yaml \
#     --set agents.coordinator.byo.image=<AR image@sha256> \
#     --set mcpServices.image=<image@sha256> --set mcpServices.identity.imageDigest=sha256:<digest> \
#     --set mcpServices.identity.gitSha=<40-hex release SHA> --set mcpServices.identity.configRevision=<run id>
#
# It deliberately does NOT layer on values-gke-cpu.yaml, g3/g3.yaml or agi/*.yaml: g3.yaml is the legacy
# reference profile (retired credentials) and the production releases are changed only from their own live
# values. Images and the per-run identity come from the release (the same digests as production).
#
# Isolation (templates/staging-guard.yaml at render time; tests/llm_agent/test_v2p1_staging_chart.py on the
# rendered objects): every object lives in ewallet-agents-staging, nothing is written into another namespace,
# every Gateway and data destination is a staging one, fixed replicas, no HPA/KEDA/PDB, dedicated idempotency
# Redis and tenant, -staging Secret names (created out of band; Helm renders references only). The Specialists
# run as SandboxAgents in ewallet-sandbox-staging; their WorkerPool and fleet manifests are V2-P3 work.
deploymentProfile: staging

namespace:
  create: false
  name: ewallet-agents-staging
  ambient: true

# Chart-owned workloads only; Specialists are SandboxAgents outside this release.
serviceAccounts: [mcp-gateway, a2a-gateway, feature-rag-mcp, drift-mcp, fraud-coordinator]

gateway: {enabled: false}
vllm: {enabled: false}
llmd: {enabled: false}
vllmCandidate: {enabled: false}
modelExperiments: {enabled: false}
# Level A runs the typed Coordinator path only: natural-language intake (the one LLM call) is off, so no
# agentgateway, no vLLM and no LLM credential are deployed. The ModelConfig CR is still required by the chart
# for agents.enabled; it names only staging objects (agentgateway.ewallet-agents-staging, a -staging Secret).
# Enabling the LLM path in staging is an owner decision (vLLM capacity, cost).
agentgateway: {enabled: false}
modelConfig:
  enabled: true
  name: ewallet-staging-llm
  apiKeySecret: {name: agentgateway-client-key-staging, key: api-key}
  byoResolver: {enabled: false}

# Staging telemetry is explicitly off (no staging collector in Level A). It can never reach the production
# collector: the BYO env names only this namespace and gateway_environment.py refuses any other target.
otelCollector: {enabled: false}
dashboards: {enabled: false}
observabilityStack:
  enabled: false
  clusterMetrics: {enabled: false}
  mlPlatform: {enabled: false}
podLogs: {enabled: false}

networkPolicy:
  enabled: true
  # The kfp-ui compensating policy lives in kubeflow; never from staging.
  kfpUiIngress: {enabled: false}

networkFlows:
  # V2-P3B-0: the staging data dependencies are not chart-owned; they are applied from
  # infra/kubernetes/agent-staging/{feast-redis,fraud-predictor}.yaml with these exact identities.
  workloads:
    feast-staging-redis:
      serviceAccount: feast-staging-redis
      podLabels: {app.kubernetes.io/name: feast-staging-redis}
    fraud-detector:
      serviceAccount: fraud-detector
      podLabels: {serving.kserve.io/inferenceservice: fraud-detector}
  enforced:
    - {name: fraud-coordinator-to-a2a-gateway, from: fraud-coordinator, to: a2a-gateway, port: 8083}
    - {name: feature-rag-mcp-to-feast-staging-redis, from: feature-rag-mcp, to: feast-staging-redis, port: 6379}
    - {name: feature-rag-mcp-to-fraud-detector, from: feature-rag-mcp, to: fraud-detector, port: 8080}

# Peers: the kagent controller (shared control plane) and the staging sandbox workers. Every policy below is
# rendered in ewallet-agents-staging; none has peerIngress or peerAuthorization, so nothing is written elsewhere.
crossNamespace:
  flows:
    - name: a2a-gateway-to-kagent-controller
      direction: egress
      local: a2a-gateway
      port: 8083
      peer: {namespace: kagent, ambient: true, podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
    - name: fraud-coordinator-to-kagent-controller
      direction: egress
      local: fraud-coordinator
      port: 8083
      peer: {namespace: kagent, ambient: true, podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
    - name: kagent-controller-to-fraud-coordinator
      direction: ingress
      local: fraud-coordinator
      port: 8080
      peer: {namespace: kagent, ambient: true, serviceAccount: kagent-controller, podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
    - name: kagent-controller-to-mcp-gateway
      direction: ingress
      local: mcp-gateway
      port: 8080
      peer: {namespace: kagent, ambient: true, serviceAccount: kagent-controller, podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
    # V2-P3A: the staging Specialist actors (WorkerPool staging-agents, infra/kubernetes/agent-staging/fleet.yaml.tmpl)
    # reach the staging MCP Gateway. Worker pods run as the namespace default account (WorkerPool has no
    # serviceAccountName) and carry ate.dev/worker-pool=<pool> (the label the production scaleSelector selects).
    - name: staging-sandbox-workers-to-mcp-gateway
      direction: ingress
      local: mcp-gateway
      port: 8080
      peer: {namespace: ewallet-sandbox-staging, ambient: true, serviceAccount: default, podLabels: {ate.dev/worker-pool: staging-agents}}

agents:
  enabled: true
  mode: agent
  replicas: 1
  autoscaling: {enabled: false}
  mcpGatewayUrl: http://mcp-gateway.ewallet-agents-staging.svc:8080
  # RemoteMCPServer tool discovery by the shared kagent controller with its staging list-only credential
  # (rendered as mcp-token-kagent-controller-<server>-staging from mcpCredentialLifecycle.clientRelease).
  mcpServers:
    feature-rag-mcp:
      discoveryHeaderSecret: {name: mcp-token-kagent-controller-feature-rag-mcp-staging, key: token}
    drift-mcp:
      discoveryHeaderSecret: {name: mcp-token-kagent-controller-drift-mcp-staging, key: token}
  allowedDomains:
    llm: agentgateway.ewallet-agents-staging.svc.cluster.local
    mcp: mcp-gateway.ewallet-agents-staging.svc.cluster.local
    a2a: a2a-gateway.ewallet-agents-staging.svc.cluster.local
  byoTelemetry:
    traces: {enabled: false}
    auditLogs: {enabled: false}
    metrics: {enabled: false}
  coordinator:
    version: "1.1.0"
    byo:
      enabled: true
      image: ""
      naturalLanguageIntake: {enabled: false}
      workflows: [fraud, drift]
      sandboxSpecialists: [drift-specialist, feature-rag-specialist]
  specialists:
    feature-rag-specialist:
      runtime: sandbox
      byo: {enabled: true}
    drift-specialist:
      version: "1.1.0"
      runtime: sandbox
      byo: {enabled: true}

# Client and server credentials of the staging set: mcp-token-*-staging / mcp-auth-*-staging, created out of
# band for this run and revoked at teardown. Never a production Secret name.
mcpCredentialLifecycle:
  serverSet: staging
  clientRelease: staging

# Dedicated durability authority: an in-release Redis in ewallet-agents-staging with its own Secret and tenant.
idempotencyRedis:
  enabled: true
  secret:
    name: coordinator-idempotency-redis-auth-staging
  coordinator:
    tenant: ewallet-agents-staging
    principal: cluster.local/ns/kagent/sa/kagent-controller

mcpGateway:
  enabled: true
  replicas: 1
  authorizationMode: ambient-backend-token
  # MCP backends are the in-release staging servers.
  backendNamespace: ""
  # Sandbox workers are admitted by the staging-sandbox-workers-to-mcp-gateway flow (staging identity only).
  callerServiceAccounts: {}
  discoveryCallers:
    - {namespace: kagent, serviceAccount: kagent-controller}

a2aGateway:
  enabled: true
  callerServiceAccounts:
    fraud-coordinator: fraud-coordinator
  sandboxRoutes:
    namespace: ewallet-sandbox-staging
    agents: [drift-specialist, feature-rag-specialist]
    userId: service:fraud-coordinator

mcpServices:
  enabled: true
  replicas: 1
  observability: {otlpEndpoint: ""}
  identity:
    promptRevision: no-prompt
    modelRevision: fraud-detector/1
    featureRevision: staging-synthetic-v1
    corpusRevision: fraud-policy-v1-20261030
  services:
    feature-rag-mcp:
      pdb: {enabled: false}
      toolGrants:
        sandbox-feature-rag: [feature_lookup, fraud_scoring, knowledge_search]
      discoverySubjects: [kagent-controller]
      authSecret: {name: mcp-auth-feature-rag-mcp-staging, key: auth-config.json}
      # Staging Feast Online stores (synthetic fixtures), never feature-store/feast-online-redis.
      redisSecret: {name: feast-online-redis-staging-fraud, key: connection_string}
      ragRedisSecret: {name: feast-online-redis-staging-rag, key: connection_string}
      registrySnapshots:
        - {name: fraud-registry, configMap: feast-registry-fraud-staging, mountPath: /feast/fraud}
        - {name: rag-registry, configMap: feast-registry-rag-staging, mountPath: /feast/rag}
      env:
        EWALLET_FEAST_REPO_PATH: /workspace/ai_platform/features/feast/online_repo
        EWALLET_FEAST_REGISTRY: /feast/fraud/registry.db
        # Staging predictor serving the same model artifact (Level A dependency, owner decision L3).
        EWALLET_KSERVE_BASE_URL: http://fraud-detector-predictor.ewallet-agents-staging.svc.cluster.local
        EWALLET_MODEL_NAME: fraud-detector
        EWALLET_MODEL_VERSION: "1"
        EWALLET_FEATURE_TARGET_PROFILE: isolated
        EWALLET_FRAUD_ONLINE_DB: "1"
        EWALLET_FRAUD_ALLOW_PRODUCTION_DB: "false"
        EWALLET_RAG_ONLINE_DB: "4"
        EWALLET_RAG_MANIFEST: /workspace/data/llm_agent/rag/fraud-policy-v1/manifest.json
        EWALLET_RAG_ONLINE_STORE: redis
        EWALLET_RAG_FEAST_REGISTRY: /feast/rag/registry.db
        EWALLET_RAG_FEAST_PROJECT: ewallet_rag_hybrid_20261114t144825   # the project the seeded rows belong to (ops/llm_agent/staging_feature_seed.py)
        EWALLET_RAG_RETRIEVER: feast-online-exact
        EWALLET_RAG_EMBEDDER: local-onnx
        EWALLET_RAG_MODEL_CACHE: /opt/hf-cache
    drift-mcp:
      pdb: {enabled: false}
      toolGrants:
        sandbox-drift: [drift_detection]
      discoverySubjects: [kagent-controller]
      authSecret: {name: mcp-auth-drift-mcp-staging, key: auth-config.json}
      registrySnapshots:
        - {name: drift-baselines, configMap: drift-baselines-staging, mountPath: /drift/baselines}
        - {name: drift-window, configMap: drift-window-staging, mountPath: /drift/window}
      env:
        EWALLET_DRIFT_SOURCE: artifact
        EWALLET_DRIFT_BASELINES_PATH: /drift/baselines/baselines.json
        EWALLET_DRIFT_BASELINES_SHA256: ""         # set by the run (drift_artifacts.py describe); empty fails the render
        EWALLET_DRIFT_WINDOW_MANIFEST: /drift/window/window-manifest.json
        EWALLET_DRIFT_WINDOW_MANIFEST_SHA256: ""
        EWALLET_DRIFT_DATASET_REVISION: staging-synthetic-v1
        EWALLET_DRIFT_ALLOW_SYNTHETIC: "false"
