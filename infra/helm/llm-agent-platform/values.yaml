namespace:
  create: true
  name: ewallet-agents
  ambient: true
  # Pod Security Admission: enforce Baseline, surface Restricted gaps.
  podSecurity:
    enforce: baseline
    warn: restricted
    audit: restricted

gateway:
  enabled: false
  name: ewallet-agent-gateway
  className: istio
  hostname: agents.example.invalid
  tlsSecretName: ewallet-agent-tls
  coordinatorService: fraud-coordinator-a2a
  coordinatorPort: 8083

serviceAccounts:
  - agentgateway
  - vllm
  - mcp-gateway
  - a2a-gateway
  - feature-rag-mcp
  - drift-mcp
  - fraud-coordinator
  - feature-rag-specialist
  - drift-specialist
  - otel-collector

networkPolicy:
  enabled: true
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
    # NodeLocal DNSCache link-local listener (GKE: 169.254.20.10); "" when the
    # cluster has no NodeLocal DNSCache.
    nodeLocalIP: ""
    # kube-dns ClusterIP. With NodeLocal DNSCache, node-local-dns also listens
    # on it and the query is never DNATed to a kube-dns pod, so the pod
    # selector alone does not match (G1 run 3: external names failed, rc=6).
    serviceIP: ""
  # With namespace.ambient, ztunnel carries every in-mesh flow as HBONE to the
  # destination pod on 15008, and kubelet probes arrive SNATed from
  # 169.254.7.127 (Istio: ambient mode and Kubernetes NetworkPolicy).
  ambient:
    hbonePort: 15008
    probeSource: 169.254.7.127/32
    # Kubelet probe ports per networkFlows workload (container ports).
    probePorts:
      vllm: [8000]
      agentgateway: [4000]
      feature-rag-mcp: [8080]
      drift-mcp: [8080]
      otel-collector: [13133]
      # Envoy /ready and the EPP gRPC health port.
      llmd-router: [19001, 9003]
      mcp-gateway: [8080]
      a2a-gateway: [8083]
      # kagent 0.10.3 Agent pods serve A2A and their probes on 8080.
      fraud-coordinator: [8080]
      drift-specialist: [8080]
      feature-rag-specialist: [8080]
      coordinator-idempotency-redis: [6379]
  # Workloads (networkFlows names) that call Google APIs through Workload
  # Identity: egress to the GKE metadata server only (169.254.169.254:80 and
  # gke-metadata-server 169.254.169.252:988). None in G1: vLLM and agentgateway
  # use no Google credentials.
  metadataAccess: []

# Least-privilege allow-flows on top of the Istio and Kubernetes default-deny.
# A flow is enforced only when both ends are workloads this chart owns, so its
# pod labels and ServiceAccount (Istio SPIFFE principal) are source-defined.
# Everything else stays denied and is listed under `unresolved` until its
# runtime identity has been read back; never add a catch-all to unblock it.
networkFlows:
  trustDomain: cluster.local
  workloads:
    agentgateway:
      serviceAccount: agentgateway
      podLabels:
        app.kubernetes.io/name: agentgateway
    vllm:
      serviceAccount: vllm
      podLabels:
        app.kubernetes.io/name: vllm
    feature-rag-mcp:
      serviceAccount: feature-rag-mcp
      podLabels:
        app.kubernetes.io/name: feature-rag-mcp
    drift-mcp:
      serviceAccount: drift-mcp
      podLabels:
        app.kubernetes.io/name: drift-mcp
    mcp-gateway:
      serviceAccount: mcp-gateway
      podLabels:
        app.kubernetes.io/name: mcp-gateway
    a2a-gateway:
      serviceAccount: a2a-gateway
      podLabels:
        app.kubernetes.io/name: a2a-gateway
    otel-collector:
      serviceAccount: otel-collector
      podLabels:
        app.kubernetes.io/name: otel-collector
    observability-prometheus:
      serviceAccount: observability-prometheus
      podLabels:
        app.kubernetes.io/name: prometheus
    # N12 pod-log forwarder (templates/pod-logs.yaml); referenced only when
    # podLogs.enabled adds the observability-alloy-to-loki flow.
    observability-alloy:
      serviceAccount: observability-alloy
      podLabels:
        app.kubernetes.io/name: alloy
    observability-loki:
      serviceAccount: observability-loki
      podLabels:
        app.kubernetes.io/name: loki
    observability-tempo:
      serviceAccount: observability-tempo
      podLabels:
        app.kubernetes.io/name: tempo
    observability-grafana:
      serviceAccount: observability-grafana
      podLabels:
        app.kubernetes.io/name: grafana
    # Created by the pinned llm-d router chart (infra/helm/llm-d), rendered
    # labels and ServiceAccount read from llm-d-router-gateway v0.9.0.
    llmd-epp:
      serviceAccount: ewallet-fraud-llm-epp
      podLabels:
        llm-d-router-gateway: ewallet-fraud-llm-epp
    # llm-d-router-standalone v1.0.0, release llmd-router (G2): EPP + Envoy pod.
    llmd-router:
      serviceAccount: llmd-router-epp
      podLabels:
        llm-d-router-standalone: llmd-router-epp
    # kagent 0.10.3 Agent Deployments (agents.mode agent): one ServiceAccount
    # and label per agent, so each has its own mesh identity.
    fraud-coordinator:
      serviceAccount: fraud-coordinator
      podLabels: {ewallet.io/agent: fraud-coordinator}
    drift-specialist:
      serviceAccount: drift-specialist
      podLabels: {ewallet.io/agent: drift-specialist}
    feature-rag-specialist:
      serviceAccount: feature-rag-specialist
      podLabels: {ewallet.io/agent: feature-rag-specialist}
    coordinator-idempotency-redis:
      serviceAccount: coordinator-idempotency-redis
      podLabels: {app.kubernetes.io/name: coordinator-idempotency-redis}
  enforced:
    - name: agentgateway-to-vllm
      from: agentgateway
      to: vllm
      port: 8000
  unresolved:
    - name: agents-to-agentgateway
      to: agentgateway:4000
      reason: SandboxAgent egress runs on the Substrate WorkerPool; its pod labels, namespace and ServiceAccount are not source-defined.
      gate: Read back the WorkerPool/SandboxAgent pod identity, then declare it as a workload and an enforced flow.
    - name: coordinator-to-specialists-native-a2a
      to: kagent-controller:8083 /api/a2a/<namespace>/<agent>
      reason: Native kagent A2A is served by the kagent controller outside this chart; controller and sandbox identities are not source-defined.
      gate: Read back kagent controller and WorkerPool identities.
    - name: agents-to-mcp-gateway
      to: mcp-gateway:8080
      reason: The MCP Gateway and its flows to the MCP servers are source-defined (mcpGateway.enabled), but agent worker pods run on Substrate WorkerPools whose ServiceAccount and labels are not source-definable in Substrate 0.0.9.
      gate: Read back each WorkerPool's pod ServiceAccount and labels, set mcpGateway.callerServiceAccounts, then declare the worker workloads and enforced flows.
    - name: a2a-gateway-to-kagent-controller
      to: kagent-controller.kagent:8083
      reason: Cross-namespace flow to the kagent controller; its pod labels come from the kagent chart and this chart only renders same-namespace flows.
      gate: Read back the controller labels and add a namespaced ingress/egress pair.
    - name: mcp-to-rag-feast-kserve-fraud-scoring
      to: Feast online store, RAG embedding, KServe fraud-scoring
      reason: Endpoints live in ML/Data Platform namespaces that are not deployed or contract-pinned for this chart.
      gate: ML Platform runtime readback of namespaces, labels and ports.
    - name: otlp-exporters-to-collector
      to: otel-collector:4317
      reason: Chart-owned exporters get enforced flows when otelCollector.enabled; kagent controller/agent workers and Prometheus (another namespace) have no source-defined identity.
      gate: Read back the kagent controller, worker and Prometheus identities, then add their flows.
    - name: vllm-model-bootstrap
      to: huggingface.co:443
      reason: vLLM downloads the pinned revision at startup, but NetworkPolicy cannot express an FQDN and a CIDR guess would be a broad egress.
      gate: Only for vllm.modelSource.mode=huggingface. The staged mode (checksum-verified read-only PVC, offline vLLM) needs no egress; GCP still needs the PVC source (e.g. GCS FUSE) chosen.
    - name: external-gateway-to-coordinator
      to: fraud-coordinator-a2a:8083
      reason: The HTTPRoute backend Service is not defined in source, and the Istio Gateway pod ingress and health-check ports are not opened.
      gate: Define the coordinator A2A backend and read back the Gateway deployment labels and ServiceAccount.

vllm:
  enabled: true
  image: docker.io/vllm/vllm-openai-cpu:v0.32.0-x86_64@sha256:827ef38187f9b52f2bb838695ef815ec5b65f4bf3e4c061b002b2b0a19cb0701
  model: Qwen/Qwen3-0.6B
  modelRevision: c1899de289a04d12100db370d81485cdf75e47ca
  servedModelName: ewallet-fraud-llm-v1
  # vLLM requires --enable-auto-tool-choice plus a parser for tool_choice=auto.
  # hermes is Qwen's documented parser for Qwen3; vLLM's own table lists it for
  # Qwen2.5, so a real-model tool-call smoke is still a runtime gate.
  toolCalling:
    enabled: true
    parser: hermes
  # huggingface: vLLM downloads model@modelRevision at startup and needs the
  # unresolved vllm-model-bootstrap egress. staged: the pinned files sit on a
  # read-only PVC, an init container checks every SHA-256, vLLM runs offline.
  modelSource:
    mode: huggingface
    # image: the pinned revision is baked into a derived image
    # (infra/docker/vllm-cpu-model, checksums verified at build time) and
    # vllm.image is that image by digest; offline, no egress, no volume.
    image:
      path: ""
    staged:
      claimName: ""
      subPath: ""
      sha256sums: ""
  # Qwen3 reasons by default; on CPU that costs most of the latency budget and
  # leaks reasoning into content. Measured locally (vLLM 0.32.0 CPU, 2 OMP
  # threads): 128 tokens in 77 s with thinking, 48 tokens in 11 s without.
  reasoningParser: qwen3
  defaultChatTemplateKwargs:
    enable_thinking: false
  shmSize: 1Gi
  # Zero-downtime default; a CPU-bound host can set maxSurge 0 so an old and a
  # new vLLM pod never start side by side.
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  # Startup probe sends one tool-shaped completion; Ready only once it succeeds.
  # Longer than warmup failureThreshold x 10 s plus an image pull.
  progressDeadlineSeconds: 1800
  warmup:
    enabled: true
    timeoutSeconds: 240
    failureThreshold: 90
  ompThreads: 2
  # VLLM_CPU_OMP_THREADS_BIND: 'auto' is vLLM's default (and what G1 ran).
  cpuThreadsBind: auto
  # --max-num-batched-tokens per engine step; unset = vLLM default (G1).
  maxNumBatchedTokens: null
  kvCacheSpaceGiB: 4
  apiKeySecret:
    name: vllm-api-key
    key: api-key
  primary:
    replicas: 1
    maxNumSeqs: 4
    maxNumQueuedRequests: 8
    prefixCaching: true
  fallback:
    replicas: 1
    maxNumSeqs: 2
    maxNumQueuedRequests: 4
    # G1 rendered no flag and vLLM V1 enabled it by default (engine log:
    # enable_prefix_caching=True); now explicit, same effective behaviour.
    prefixCaching: true
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "3"
      memory: 8Gi

# Optional node selector for vLLM and agentgateway pods (empty = scheduler's choice, G1).
llmPlacement:
  nodeSelector: {}

agentgateway:
  enabled: true
  # Client authentication on the entry route (apiKey, strict): callers present
  # this key; the gateway swaps in the vLLM key (vllm.apiKeySecret) towards the
  # backend, so clients never hold the backend credential. G1 run 5 showed the
  # gateway accepted any key before this.
  clientKeySecret:
    name: agentgateway-client-key
    key: api-key
  image: ghcr.io/agentgateway/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
  replicas: 2
  # Entry route budget; the LLM listener budget stays just under it so the
  # listener, not the entry route, answers a slow backend. CPU inference needs
  # longer budgets (values-local.yaml): a non-streamed completion sends no byte
  # until it is done, so responseIdleTimeout must cover the whole generation.
  requestTimeout: 30s
  llmRequestTimeout: 28s
  backendRequestTimeout: 20s
  responseIdleTimeout: 10s
  # Retry only when the backend was not reached or refused (502/503). A 504 or
  # 500 after a CPU generation must not be replayed: the replay restarts the
  # whole generation, overruns the entry budget (the 2026-10-31 kind 504) and
  # keeps vLLM busy with abandoned work.
  retryAttempts: 1
  retryBackoff: 250ms
  retryCodes: [502, 503]
  circuitBreakDuration: 30s
  requestRate:
    capacity: 12
    refill: 12
    interval: 1s
  tokenRate:
    capacity: 24000
    refill: 24000
    interval: 1h
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# llm-d inference-aware routing (rubric edai-2 rows 3-6 link the llm-d
# quickstart). Validated topology for the pinned versions:
#   agentgateway (this chart, standalone: model policy, quotas, failover)
#     -> llm-inference-gateway (agentgateway v1.7.0 controller, Gateway API mode)
#     -> InferencePool (GAIE v1.6.2, inference.networking.k8s.io/v1)
#     -> llm-d router EPP v0.9.0 picks one primary vLLM pod.
# The direct primary and fallback vLLM backends stay as failover targets.
# The router chart, CRDs and controller are installed from infra/helm/llm-d
# (pins in versions.env); this chart only owns the Gateway and the flows.
llmd:
  enabled: false
  # gateway: the design above (Gateway API, GAIE and agentgateway controller
  # CRDs, cluster-scoped). standalone (G2): llm-d-router-standalone v1.0.0,
  # EPP + Envoy sidecar selecting the primary pods by label, no CRDs
  # (infra/helm/llm-d/standalone-values-g2.yaml). agentgateway stays in front
  # of both for authentication, rate limits and failover.
  mode: gateway
  standalone:
    # Service and pod identity rendered by the router chart (release llmd-router).
    service: llmd-router-epp
    port: 8081
    networkFlows:
      - name: agentgateway-to-llmd-router
        from: agentgateway
        to: llmd-router
        port: 8081
      # Envoy forwards the picked request and the EPP scrapes /metrics, both on 8000.
      - name: llmd-router-to-vllm
        from: llmd-router
        to: vllm
        port: 8000
    # The EPP lists and watches pods (namespaced Role): egress to the API server
    # only, read back per cluster (kubernetes Service ClusterIP and endpoints).
    apiServer:
      cidrs: []
      ports: [443]
  poolName: ewallet-fraud-llm
  gatewayName: llm-inference-gateway
  gatewayClassName: agentgateway
  gatewayPort: 80
  # EPP scrapes vLLM /metrics on the serving port for its scorers.
  networkFlows:
    - name: llmd-epp-to-vllm-metrics
      from: llmd-epp
      to: vllm
      port: 8000
  unresolvedFlows:
    - name: agentgateway-to-llm-inference-gateway
      to: llm-inference-gateway:80
      reason: The inference Gateway data plane is provisioned by the agentgateway controller; its pod labels and ServiceAccount are not source-defined.
      gate: Read back the provisioned Deployment labels and ServiceAccount, then declare it as a workload with enforced flows to it, from it to llmd-epp:9002 (ext_proc) and to vllm:8000.
    - name: llmd-epp-to-kube-apiserver
      to: kubernetes.default.svc:443
      reason: The EPP watches Pods and InferencePools through a namespaced Role; the API server endpoint is cluster-specific.
      gate: Read back the API server endpoint IPs and allow only them on 443 from llmd-epp.

# kagent 0.10.3 Agents on Agent Substrate 0.0.9 (rubric edai-2 rows 19-22,
# 25-27). Disabled until the kagent controller, Substrate and the MCP Gateway
# are deployed (docs/llm_agent/runtime_runbook.md R3).
# Business roles (no duplicate logical agents for historical names):
#   drift-specialist        = Feature / Risk specialist (rows 19-21)
#   feature-rag-specialist  = Fraud Investigation / Evidence specialist (row 22)
#   fraud-coordinator       = Coordinator, delegates by native A2A (rows 25-26)
agents:
  enabled: false
  # Substrate WorkerPool per agent. Substrate 0.0.9 WorkerPool.spec.template
  # has no serviceAccountName (it is pruned), so per-agent mesh identity is
  # NOT source-defined; see docs/llm_agent/agents.md.
  workerPool:
    ateomImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.0.9
    sandboxClass: gvisor
    replicas: 1
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: 1500m, memory: 2Gi}
  # sandbox: SandboxAgent on Substrate WorkerPools (design target for rows 20
  # and 27). agent: kagent 0.10.3 Agent Deployments, used while Substrate is not
  # approved (owner decision 2026-11-01); rows 20/27 stay open in that mode.
  mode: sandbox
  # Agent Deployment replicas (mode agent; scaling evidence is a separate gate).
  replicas: 1
  # gs://<bucket>/<prefix>/ for Substrate snapshots; required in sandbox mode.
  snapshotsLocation: ""
  runtime: go
  # The .svc form is a valid Kubernetes service address and is intentionally
  # not classified as an internally-built URL by pinned kagent 0.10.3. This
  # keeps RemoteMCPServer traffic on the dedicated MCP Gateway when the native
  # kagent controller proxy is enabled for Agent-tool A2A routing.
  mcpGatewayUrl: http://mcp-gateway.ewallet-agents.svc:8080
  mcpTimeout: 30s
  allowedDomains:
    llm: agentgateway.ewallet-agents.svc.cluster.local
    mcp: mcp-gateway.ewallet-agents.svc.cluster.local
    a2a: a2a-gateway.ewallet-agents.svc.cluster.local
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # KEDA (rubric rows 19, 25, 27): one ScaledObject per agent WorkerPool. A
  # WorkerPool has a scale subresource but no label selector, so CPU/memory
  # triggers cannot work; the warm floor and a business-hours cron window are
  # used, plus an optional Prometheus trigger on A2A request rate whose metric
  # name must be read back from the a2a-gateway first.
  autoscaling:
    enabled: false
    # hpa or keda; exactly one owner per Deployment. keda renders a ScaledObject in
    # place of the HPA, so the two can never scale the same workload.
    engine: hpa
    keda:
      # Agents wait on the LLM and tools, so CPU barely moves under load. Scale on
      # tasks in flight instead (agent_metrics.py). Needs Prometheus reachable from
      # the keda namespace and the gauge exported by a rebuilt agent image.
      serverAddress: http://prometheus.ewallet-agents.svc.cluster.local:9090
      queryTemplate: 'sum(ewallet_agent_inflight_tasks{agent="%s"}) or vector(0)'
      inflightPerReplica: "2"
      pollingIntervalSeconds: 15
      cooldownSeconds: 120
      # Used when Prometheus cannot be queried: hold the safe floor.
      fallback: {failureThreshold: 3, replicas: 2}
      # Adopt the HPA of the same name instead of requiring its deletion first. KEDA's
      # webhook refuses a ScaledObject beside a foreign HPA. See the C-B runbook for rollback.
      transferHpa: false
    # Native HPA for kagent Agent/BYO mode. kagent 0.10.3 intentionally leaves
    # a generated Deployment's replicas untouched when the Agent deployment
    # replicas field is absent, so HPA and the reconciler have one owner each.
    agent:
      minReplicas: 2
      maxReplicas: 3
      targetCPUUtilizationPercentage: 60
      scaleUp:
        stabilizationWindowSeconds: 0
        periodSeconds: 60
        pods: 1
      scaleDown:
        stabilizationWindowSeconds: 300
        periodSeconds: 60
        pods: 1
    # The remaining settings apply only to sandbox mode and target a
    # WorkerPool scale subresource through KEDA.
    minReplicas: 1
    maxReplicas: 3
    cooldownSeconds: 300
    timezone: Asia/Ho_Chi_Minh
    businessHours: {start: "0 8 * * 1-5", end: "0 20 * * 1-5", replicas: 2}
    prometheus:
      enabled: false
      serverAddress: ""
      # %s is replaced by the agent name.
      queryTemplate: ""
      threshold: "2"
  # Prompt identity: prompts/<agent>/<version>.md, sha256 in prompts/manifest.json.
  mcpServers:
    feature-rag-mcp: {path: /feature-rag/mcp, tools: [feature_lookup, fraud_scoring, knowledge_search]}
    drift-mcp: {path: /drift/mcp, tools: [drift_detection]}
  specialists:
    drift-specialist:
      displayName: Feature / Risk specialist
      businessRole: feature-risk
      version: "1.0.0"
      promptVersion: v2
      rubricRows: "19,20,21"
      a2aSkill:
        enabled: true
        id: feature-risk-analysis
        name: Feature and risk analysis
        description: Grounded feature lookup and drift evidence for an approved baseline.
        tags: [fraud, features, drift]
      tools:
        feature-rag-mcp: [feature_lookup]
        drift-mcp: [drift_detection]
      # One credential per destination service. References only; Secret values
      # are provisioned out of band during an authorized runtime task.
      authHeaderSecrets: {}
    feature-rag-specialist:
      displayName: Fraud Investigation / Evidence specialist
      businessRole: fraud-investigation
      version: "1.0.0"
      promptVersion: v5
      rubricRows: "22"
      a2aSkill:
        enabled: true
        id: feature-rag-evidence
        name: Feature, score and policy evidence
        description: Grounded Feast, KServe and cited policy evidence for one transaction.
        tags: [fraud, features, rag]
      # Owner-gated deterministic replacement for this Specialist only.
      # The image must be a private immutable Artifact Registry digest.
      byo:
        enabled: false
        image: ""
        # Same opt-in bounded intake as the Coordinator (kagent Chat questions).
        naturalLanguageIntake:
          enabled: false
          timeoutSeconds: 190
      tools:
        feature-rag-mcp: [feature_lookup, fraud_scoring, knowledge_search]
      authHeaderSecrets: {}
  coordinator:
    name: fraud-coordinator
    displayName: Fraud Investigation Coordinator
    version: "1.0.0"
    promptVersion: v5
    rubricRows: "25,26"
    a2aSkill:
      enabled: true
      id: investigate-transaction
      name: Investigate a transaction
      description: Grounded fraud investigation with model score, features, drift and policy citations.
      tags: [fraud, investigation]
    delegates: [feature-rag-specialist, drift-specialist]
    # Owner-gated replacement for the declarative Coordinator only. The image
    # must be a private immutable Artifact Registry digest built from this repo.
    byo:
      enabled: false
      image: ""
      # kagent Chat natural-language intake (N11): one LLM tool call through
      # agentgateway selects investigate_transaction; arguments are grounded in
      # the analyst text before the unchanged typed path runs. Off by default.
      naturalLanguageIntake:
        enabled: false
        # Must exceed agentgateway.requestTimeout (nested budgets, chart guard).
        timeoutSeconds: 190
      # C7.2: two model configurations for the tool-selection call, assigned per
      # conversation. Needs the routes in modelExperiments. Overlays: c7/.
      abExperiment:
        enabled: false
  # Bounded OTLP audit records (ids, status, codes; no prompts or business
  # data) from the BYO agents to the shared collector -> Loki. Off by default.
  byoTelemetry:
    auditLogs:
      enabled: false
    # N12: bounded OTLP counters (agent invocations, PII prompt screening).
    metrics:
      enabled: false

# Dedicated, authenticated durability authority for the BYO Coordinator.
# It never shares data, credentials or lifecycle with Feast/RAG Redis. The
# Secret is created out of band and must contain connection_url, password and
# users.acl; Helm never renders credential material.
idempotencyRedis:
  enabled: false
  name: coordinator-idempotency-redis
  image: docker.io/library/redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
  port: 6379
  secret:
    name: coordinator-idempotency-redis-auth
    connectionUrlKey: connection_url
    passwordKey: password
    aclKey: users.acl
  config:
    maxmemory: 128mb
    maxmemoryPolicy: noeviction
    appendfsync: everysec
  storage:
    size: 1Gi
    storageClassName: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
  coordinator:
    tenant: ewallet-agents
    principal: cluster.local/ns/kagent/sa/kagent-controller
    redisTimeoutSeconds: "1.0"
    leaseMs: "600000"
    completedTtlMs: "86400000"
    duplicateWaitSeconds: "15"
    duplicatePollSeconds: "0.1"
  networkFlows:
    - name: fraud-coordinator-to-coordinator-idempotency-redis
      from: fraud-coordinator
      to: coordinator-idempotency-redis
      port: 6379

# Flows to workloads in other namespaces (templates/cross-namespace.yaml).
# Empty by default; profiles add the kagent controller and the MLOps backends.
crossNamespace:
  flows: []

# Policy-only MCP Gateway (rubric row 23) and A2A entrypoint (row 24): two
# agentgateway v1.7.0 standalone instances, separate from the LLM agentgateway.
# Caller identity is the Istio SPIFFE identity of the calling agent's worker
# pod (agentgateway CEL source.identity). Whether source.identity is populated
# under Istio Ambient is UNVERIFIED, and Substrate 0.0.9 cannot pin a worker
# ServiceAccount (docs/llm_agent/agents.md). Every caller ServiceAccount below
# is empty until a runtime readback proves it; an empty one is denied every
# tool, and with none set the gateway denies everything (rule 'false').
mcpGateway:
  enabled: false
  replicas: 2
  port: 8080
  # mesh-identity lets agentgateway filter tools from source.identity.
  # ambient-backend-token is for Ambient L4, where ztunnel enforces the exact
  # SPIFFE caller but standalone agentgateway cannot observe source.identity;
  # the MCP server then applies the service-token subject's tool grants.
  authorizationMode: mesh-identity
  # Empty means this release's namespace. A cutover profile may point the
  # existing gateway at MCP Services in another namespace without moving or
  # duplicating the gateway itself.
  backendNamespace: ""
  # Cross-namespace backends in the ambient mesh are reached over HBONE as
  # well as their service port. Ignored while backendNamespace is local.
  backendAmbient: true
  rateLimit: {capacity: 20, refill: 20, interval: 1s}
  # Nested: RemoteMCPServer (agents.mcpTimeout) > this > mcpServices.maxTimeoutMs.
  requestTimeout: 25s
  callerServiceAccounts:
    drift-specialist: ""
    feature-rag-specialist: ""
  networkFlows:
    - name: mcp-gateway-to-feature-rag-mcp
      from: mcp-gateway
      to: feature-rag-mcp
      port: 8080
    - name: mcp-gateway-to-drift-mcp
      from: mcp-gateway
      to: drift-mcp
      port: 8080
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

a2aGateway:
  enabled: false
  replicas: 1
  port: 8083
  # kagent controller A2A endpoint (kagent-values.yaml sets A2A_BASE_URL here).
  kagentA2A: kagent-controller.kagent.svc.cluster.local:8083
  rateLimit: {capacity: 10, refill: 10, interval: 1s}
  # One delegation = at least two LLM turns plus one MCP call:
  # > 2 x modelConfig.timeoutSeconds + agents.mcpTimeout (chart guard), and
  # below the kagent controller's a2aClientTimeout.
  requestTimeout: 150s
  # Worker ServiceAccounts allowed to call agents over A2A (runtime readback).
  callerServiceAccounts:
    fraud-coordinator: ""
  # The proxy is the only workload allowed to reach Specialist A2A Services.
  # Direct Coordinator -> Specialist remains denied by default-deny.
  networkFlows:
    - {name: a2a-gateway-to-drift-specialist, from: a2a-gateway, to: drift-specialist, port: 8080}
    - {name: a2a-gateway-to-feature-rag-specialist, from: a2a-gateway, to: feature-rag-specialist, port: 8080}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# OpenTelemetry Collector (rubric rows 46-51): OTLP in, PII redaction,
# Prometheus metrics out (scraped from outside the namespace), traces to an
# OTLP backend (Jaeger/Tempo, row 39/49) when one is configured.
otelCollector:
  enabled: false
  # Separate MCP releases may already be stable. Do not roll chart-owned MCP
  # Deployments merely because a collector is added; opt in after a dedicated
  # semantic diff when MCP trace export is required.
  injectMcpServices: false
  image: docker.io/otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
  replicas: 1
  # host:port of an OTLP gRPC trace backend; empty keeps traces in the debug exporter only.
  tracesEndpoint: ""
  # OTLP/HTTP endpoint for a log backend; empty keeps logs in debug only.
  logsEndpoint: ""
  prometheusPort: 8889
  mlPlatformProbes:
    enabled: false
    interval: 30s
    mlflowHealthUrl: http://mlflow.ml-platform.svc.cluster.local:5000/health
    kfpHealthUrl: http://ml-pipeline.kubeflow.svc.cluster.local:8888/apis/v2beta1/healthz
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # N11 opt-in: top-level `gatewayTracing: {enabled: true}` (outside this map,
  # so the observability checksum and Prometheus/Grafana stay unchanged) makes
  # agentgateway/mcp-gateway/a2a-gateway export spans over the flows below.
  # Enabling it rolls those gateways and, through the config hash
  # annotations, the Agents that call them.
  # Chart-owned OTLP exporters (enforced when enabled).
  networkFlows:
    - {name: agentgateway-to-otel-collector, from: agentgateway, to: otel-collector, port: 4317}
    - {name: mcp-gateway-to-otel-collector, from: mcp-gateway, to: otel-collector, port: 4317}
    - {name: a2a-gateway-to-otel-collector, from: a2a-gateway, to: otel-collector, port: 4317}
    - {name: feature-rag-mcp-to-otel-collector, from: feature-rag-mcp, to: otel-collector, port: 4317}
    - {name: drift-mcp-to-otel-collector, from: drift-mcp, to: otel-collector, port: 4317}
    - {name: llmd-epp-to-otel-collector, from: llmd-epp, to: otel-collector, port: 4317}
    - {name: fraud-coordinator-to-otel-collector, from: fraud-coordinator, to: otel-collector, port: 4317}
    - {name: feature-rag-specialist-to-otel-collector, from: feature-rag-specialist, to: otel-collector, port: 4317}
    - {name: drift-specialist-to-otel-collector, from: drift-specialist, to: otel-collector, port: 4317}

# Grafana dashboard ConfigMap (rubric rows 37, 46-51); metric names are in
# dashboards/llm-agent.json with a verified/unverified status per panel.
dashboards:
  enabled: false
  namespace: ""

# Bounded, opt-in source contract restored from I7. It stays disabled in every
# GKE profile; managed equivalents may be used by a separately authorized run.
observabilityStack:
  enabled: false
  # Opt-in only: requires cluster-scoped read RBAC. Keep disabled for the
  # EDAI-2 bounded rollout, which scrapes chart-owned namespace Services only.
  clusterMetrics:
    enabled: false
    # Opt-in keys (read with defaults so the observability checksum of existing
    # releases is unchanged):
    #   apiServer.cidrs: kubernetes Service ClusterIP and API-server endpoint
    #     /32s, read back per cluster (`kubectl get svc,endpoints kubernetes -n default`).
    #   kubelet.cidrs: node subnet; Prometheus scrapes <InternalIP>:10250 directly.
    #   kubeStateMetricsTarget: host:port of an existing kube-state-metrics;
    #     unset = no scrape job.
  adminSecretName: ewallet-grafana-admin
  retention: 24h
  mlPlatform:
    enabled: false
    fraudApiMetricsTarget: fraud-api.ml-platform.svc.cluster.local:80
    kserveMetricsTarget: fraud-detector-predictor.fraud-serving.svc.cluster.local:80
  networkFlows:
    - {name: prometheus-to-agentgateway, from: observability-prometheus, to: agentgateway, port: 15020}
    - {name: prometheus-to-vllm, from: observability-prometheus, to: vllm, port: 8000}
    - {name: prometheus-to-otel-collector, from: observability-prometheus, to: otel-collector, port: 8889}
    - {name: otel-collector-to-loki, from: otel-collector, to: observability-loki, port: 3100}
    - {name: otel-collector-to-tempo, from: otel-collector, to: observability-tempo, port: 4317}
    - {name: grafana-to-prometheus, from: observability-grafana, to: observability-prometheus, port: 9090}
    - {name: grafana-to-loki, from: observability-grafana, to: observability-loki, port: 3100}
    - {name: grafana-to-tempo, from: observability-grafana, to: observability-tempo, port: 3200}
  # Added only when both the opt-in stack and G2 standalone llm-d routing are
  # enabled. The v1.0.0 router Service exposes EPP /metrics on 9090.
  llmdStandaloneNetworkFlows:
    - {name: prometheus-to-llmd-epp, from: observability-prometheus, to: llmd-router, port: 9090}
  prometheus:
    image: docker.io/prom/prometheus:v3.7.3@sha256:6573196e5dbe834779ac4d34cb053113cc502a69e9e20ba3be96d37f33e81545
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 768Mi}
  loki:
    image: docker.io/grafana/loki:3.5.7@sha256:bf26399a58b4719387b06abfd024ebca942d702b2e77cc600fa3439356584c73
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 300m, memory: 512Mi}
  tempo:
    image: docker.io/grafana/tempo:2.8.2@sha256:8cfd15734001588eb9c4de7326614be2b668e84d71f8479b149906f0dd65983d
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 300m, memory: 512Mi}
  grafana:
    # 12.3+ includes the extracted Tempo data-source health implementation;
    # 12.2 returned plugin.notImplemented despite a healthy Tempo /api/echo.
    image: docker.io/grafana/grafana:12.3.0@sha256:70d9599b186ce287be0d2c5ba9a78acb2e86c1a68c9c41449454d0fc3eeb84e8
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 300m, memory: 384Mi}

# Rollback-safe credential references. ``legacy`` preserves the existing
# unversioned Secret names. A reviewed rollout first changes serverSet to a
# transition set while clients remain legacy, then changes clientRelease.
# Secret values are prepared outside Helm and never appear in values/rendering.
mcpCredentialLifecycle:
  serverSet: legacy
  clientRelease: legacy

# Phase D MCP tool servers (ai_platform/llm_agent/tools). Disabled: no reviewed
# server image exists, and every value below must come from a real build and
# deployment readback, never from placeholders.
mcpServices:
  enabled: false
  image: ""
  # A backend-only MCP release can export telemetry to the shared collector
  # without deploying a second collector in its own namespace.
  observability:
    otlpEndpoint: ""
    insecure: true
  replicas: 2
  # Spreads replicas over nodes, so one node loss leaves a healthy MCP server.
  topologySpread: false
  port: 8080
  maxConcurrency: 8
  # Per-tool cap; below the MCP Gateway budget so the server answers first.
  maxTimeoutMs: 20000
  # Every tool request is denied until an authentication mechanism is approved
  # (DECISION_REQUIRED, docs/llm_agent/phase_d_tool_services.md). Origins must be
  # exact scheme://host[:port]; an absent Origin header is allowed.
  http:
    allowedOrigins: []
    maxBodyBytes: 65536
    maxInflightRequests: 32
    bodyReadTimeoutSeconds: 10
  identity:
    gitSha: ""
    imageDigest: ""
    configRevision: ""
    promptRevision: no-prompt
    modelRevision: ""
    featureRevision: ""
    corpusRevision: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  services:
    feature-rag-mcp:
      serviceAccount: feature-rag-mcp
      pdb: {enabled: true}
      app: ai_platform.llm_agent.tools.service:create_feature_rag_app
      # Verified subject -> granted tools; empty denies every tool.
      toolGrants: {}
      # Service-specific trusted token table. Empty name keeps production
      # authentication fail-closed and readiness at 503.
      authSecret: {name: "", key: auth-config.json}
      # Feast Online Redis credential (Secret name/key) and immutable registry
      # snapshots mounted from ConfigMaps; empty keeps the production default.
      redisSecret: {}
      registrySnapshots: []
      env:
        EWALLET_FEAST_REPO_PATH: ""
        EWALLET_KSERVE_BASE_URL: ""
        EWALLET_MODEL_NAME: ""
        EWALLET_MODEL_VERSION: ""
        EWALLET_RAG_MANIFEST: data/llm_agent/rag/fraud-policy-v1/manifest.json
        EWALLET_RAG_ONLINE_STORE: redis
    drift-mcp:
      serviceAccount: drift-mcp
      pdb: {enabled: true}
      app: ai_platform.llm_agent.tools.service:create_drift_app
      # Verified subject -> granted tools; empty denies every tool.
      toolGrants: {}
      authSecret: {name: "", key: auth-config.json}
      env: {}

modelConfig:
  enabled: true
  name: ewallet-global-llm
  model: ewallet-fraud-llm
  # Must exceed agentgateway.requestTimeout (chart guard).
  timeoutSeconds: 35
  # Clients (agents) authenticate to agentgateway with the gateway client key,
  # never with the vLLM backend key.
  apiKeySecret:
    name: agentgateway-client-key
    key: api-key

# N12 (edai-2 row 48): Kubernetes-API pod-log forwarder (Grafana Alloy) for
# workloads that cannot export OTLP logs. Off by default; see
# templates/pod-logs.yaml. Keys: enabled, image (digest-pinned),
# apiServer.cidrs, sources (optional override), stabilityLevel.
podLogs:
  enabled: false

# C7: extra model routes on agentgateway, all off by default so the production
# render does not change. `models` are internal backends, `virtualModels` are the
# names clients request, weighted by agentgateway per request. Overlays: c7/.
modelExperiments:
  enabled: false
  models: []
  virtualModels: []

# C7.3: a second vLLM beside primary and fallback, on CPU or one GPU. The image must
# carry the model and be pinned by digest. Only a gateway route sends it traffic.
vllmCandidate:
  enabled: false
  accelerator: cpu
  image: ""
  modelPath: ""
  servedModelName: ewallet-fraud-llm-1-7b
  maxModelLen: 4096
  maxNumSeqs: 4
  maxNumQueuedRequests: 8
  gpuMemoryUtilization: 0.85
  nodeSelector: {}
  tolerations: []
  resources:
    requests: {cpu: "2", memory: 6Gi}
    limits: {cpu: "3", memory: 10Gi}
