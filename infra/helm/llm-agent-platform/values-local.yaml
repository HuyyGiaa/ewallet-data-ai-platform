# Local kind overlay (cluster llm-agent-local). Not a production profile.
# The model is pre-staged at the pinned revision on a read-only PVC created by
# infra/kubernetes/llm-agent-local/model-pv.yaml; checksums below were taken
# from that download (docs/llm_agent/runtime_runbook.md, step "Stage the model").
gateway:
  enabled: false
  hostname: agents.local.example.invalid

vllm:
  modelSource:
    mode: staged
    staged:
      claimName: vllm-model-staged
      subPath: Qwen3-0.6B/c1899de289a04d12100db370d81485cdf75e47ca
      sha256sums: |
        660db3b73d788119c04535e48cf9be5f55bc3100841a718637ae695b442f27dd  ./config.json
        2325da0f15bb848e018c5ae071b7943332e9f871d6b60e2ed22ca97d4cb993d2  ./generation_config.json
        34448b82c17d60fec9b65b1f093c115ddbaadc04beb1b0140b6bfed2e012a930  ./.gitattributes
        832dd9e00a68dd83b3c3fb9f5588dad7dcf337a0db50f7d9483f310cd292e92e  ./LICENSE
        8831e4f1a044471340f7c0a83d7bd71306a5b867e95fd870f74d0c5308a904d5  ./merges.txt
        f47f71177f32bcd101b7573ec9171e6a57f4f4d31148d38e382306f42996874b  ./model.safetensors
        1ab64a26fcb3b461423b89a433a8c858f1bf8d4086f979cbb3ff878d47cf20e9  ./README.md
        d5d09f07b48c3086c508b30d1c9114bd1189145b74e982a265350c923acd8101  ./tokenizer_config.json
        aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4  ./tokenizer.json
        ca10d7e9fb3ed18575dd1e277a2579c16d108e32f27439684afa0e10b1440910  ./vocab.json
  kvCacheSpaceGiB: 1
  # Laptop budget (the kind node itself is capped at 4 CPUs / 9 GiB): one vLLM
  # pod, replaced in place. Running 4 pods at once on 2026-10-31 starved the
  # DP2 Airflow on the same host.
  ompThreads: 2
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
  primary:
    replicas: 1
  fallback:
    replicas: 0
  resources:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      cpu: "3"
      memory: 6Gi

agentgateway:
  replicas: 1
  # The 2026-10-31 kind smoke got HTTP 504 through agentgateway: a 256-token
  # tool call on 2 CPU threads takes ~40-80 s, beyond the 28 s listener and
  # 10 s idle budgets. Local CPU budgets (runtime gate: re-run the smoke).
  requestTimeout: 180s
  llmRequestTimeout: 170s
  backendRequestTimeout: 160s
  responseIdleTimeout: 160s

modelConfig:
  timeoutSeconds: 200
