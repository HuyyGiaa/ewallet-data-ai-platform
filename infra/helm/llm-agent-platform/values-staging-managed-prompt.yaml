# Managed Prompt runtime profile (V2-P3B, rubric row 34): layered ON TOP of values-staging.yaml,
#   helm install llm-agent-staging ... -f values-staging.yaml -f values-staging-managed-prompt.yaml
# Level A (values-staging.yaml alone, the edai2-cd-agent-staging typed E2E) is unchanged.
#
# Proves Prompt Registry -> validated ConfigMap -> BYO Coordinator -> real LLM request, entirely inside
# ewallet-agents-staging: a staging agentgateway and a staging CPU vLLM serving the same immutable model
# image as production (model baked in: no Internet egress). The production vLLM is not reused: its
# agentgateway authenticates with the production vllm-api-key, and reaching it would need production
# NetworkPolicy/AuthorizationPolicy changes. Staging credentials are generated by
#   python -m ops.llm_agent.staging_credentials create --profile managed-prompt --context CTX --approve
# and the prompt ConfigMap fraud-coordinator-intake-prompt-managed comes from the Prompt Registry
# (ops/llm_agent/prompt_registry.py configmap ... --namespace ewallet-agents-staging).

agentgateway:
  enabled: true
  replicas: 1
  clientKeySecret: {name: agentgateway-client-key-staging, key: api-key}

vllm:
  enabled: true
  image: asia-southeast1-docker.pkg.dev/ewallet-data-ai-platform-hg26/ewallet-platform/vllm-cpu-model@sha256:f695b23efa8145ae5cb57a1873863879927ab4805e70e5eee1a71a2063edd07c
  modelSource: {mode: image, image: {path: /models/Qwen3-0.6B/c1899de289a04d12100db370d81485cdf75e47ca}}
  apiKeySecret: {name: vllm-api-key-staging, key: api-key}
  resources: {requests: {cpu: "2", memory: 6Gi}, limits: {cpu: "3", memory: 10Gi}}
  fallback: {replicas: 0, maxNumSeqs: 2, maxNumQueuedRequests: 4, prefixCaching: true}

# The list replaces values-staging.yaml's, so the three Level A flows are repeated, then the LLM path.
networkFlows:
  enforced:
    - {name: fraud-coordinator-to-a2a-gateway, from: fraud-coordinator, to: a2a-gateway, port: 8083}
    - {name: feature-rag-mcp-to-feast-staging-redis, from: feature-rag-mcp, to: feast-staging-redis, port: 6379}
    - {name: feature-rag-mcp-to-fraud-detector, from: feature-rag-mcp, to: fraud-detector, port: 8080}
    - {name: fraud-coordinator-to-agentgateway, from: fraud-coordinator, to: agentgateway, port: 4000}
    - {name: agentgateway-to-vllm, from: agentgateway, to: vllm, port: 8000}

agents:
  coordinator:
    byo:
      naturalLanguageIntake:
        enabled: true
        managedPrompt: {enabled: true, version: fraud-coordinator-intake/v1}
