# G3 on GKE (owner decisions 2026-11-01): kagent 0.10.3 without Substrate
# (agents.mode agent; rows 20/27 stay open), at most 2 temporary e2-standard-4
# nodes labelled ewallet.io/g3-llm=true, one C1 vLLM replica and no fallback
# replica (the G1/G2 fallback implementation is unchanged, only not scaled),
# one business investigation at a time. Layer after values-gke-cpu.yaml and
# values-gke-cpu-g1.yaml. The MCP image, its identity and the API-server CIDRs
# come from the deploy step (image-digests.json, --set).
llmPlacement:
  nodeSelector:
    ewallet.io/g3-llm: "true"

vllm:
  cpuThreadsBind: "0-1"      # O1 C1
  primary:
    replicas: 1
  fallback:
    replicas: 0

agentgateway:
  replicas: 1

modelConfig:
  enabled: true

agents:
  enabled: true
  mode: agent
  replicas: 1
  # Source-ready bounded policy. Runtime activation still requires Metrics
  # Server, node-headroom and semantic Helm-diff readback.
  autoscaling:
    enabled: true
    agent:
      minReplicas: 2
      maxReplicas: 3
      targetCPUUtilizationPercentage: 60
  mcpServers:
    feature-rag-mcp:
      path: /feature-rag/mcp
      tools: [feature_lookup, fraud_scoring, knowledge_search]
      discoveryHeaderSecret: {name: mcp-token-kagent-controller-feature-rag-mcp, key: token}
    drift-mcp:
      path: /drift/mcp
      tools: [drift_detection]
      discoveryHeaderSecret: {name: mcp-token-kagent-controller-drift-mcp, key: token}
  specialists:
    drift-specialist:
      authHeaderSecrets:
        feature-rag-mcp: {name: mcp-token-drift-specialist-feature-rag-mcp, key: token}
        drift-mcp: {name: mcp-token-drift-specialist-drift-mcp, key: token}
    feature-rag-specialist:
      authHeaderSecrets:
        feature-rag-mcp: {name: mcp-token-feature-rag-specialist-feature-rag-mcp, key: token}

# Task 4 enables this only together with the freshly built, digest-pinned BYO
# Coordinator image. Keeping the switch false preserves the currently deployed
# revision until the semantic diff and rollback gates are captured.
idempotencyRedis:
  enabled: false
  coordinator:
    tenant: ewallet-agents
    principal: cluster.local/ns/kagent/sa/kagent-controller
    leaseMs: "600000"
    completedTtlMs: "86400000"

mcpServices:
  enabled: true
  replicas: 1
  identity:
    configRevision: g3-gke-v1
    promptRevision: v2
    modelRevision: fraud-detector/1
    featureRevision: canonical-100gb-v1/online-20261031-163506
    corpusRevision: fraud-policy-v1-20261030
  services:
    feature-rag-mcp:
      # One replica during R1A recovery: minAvailable=1 would prevent a
      # voluntary disruption, so this service opts out until it is scaled.
      pdb: {enabled: false}
      toolGrants:
        drift-specialist: [feature_lookup]
        feature-rag-specialist: [feature_lookup, fraud_scoring, knowledge_search]
      # The kagent controller lists tools (RemoteMCPServer discovery), never calls.
      discoverySubjects: [kagent-controller]
      authSecret: {name: mcp-auth-feature-rag-mcp, key: auth-config.json}
      redisSecret: {name: feast-online-redis, key: connection_string}
      registrySnapshots:
        - {name: fraud-registry, configMap: feast-registry-fraud-online, mountPath: /feast/fraud}
        - {name: rag-registry, configMap: feast-registry-rag, mountPath: /feast/rag}
      env:
        EWALLET_FEAST_REPO_PATH: /workspace/ai_platform/features/feast/online_repo
        EWALLET_FEAST_REGISTRY: /feast/fraud/registry.db
        EWALLET_KSERVE_BASE_URL: http://fraud-detector-predictor.fraud-serving.svc.cluster.local
        EWALLET_MODEL_NAME: fraud-detector
        EWALLET_MODEL_VERSION: "1"
        EWALLET_RAG_MANIFEST: /workspace/data/llm_agent/rag/fraud-policy-v1/manifest.json
        EWALLET_RAG_ONLINE_STORE: redis
        EWALLET_RAG_FEAST_REGISTRY: /feast/rag/registry.db
        EWALLET_RAG_FEAST_PROJECT: ewallet_rag
        EWALLET_RAG_RETRIEVER: feast-online-exact
        EWALLET_RAG_EMBEDDER: local-onnx
        EWALLET_RAG_MODEL_CACHE: /opt/hf-cache
    drift-mcp:
      # Preserve the already deployed disruption contract.
      pdb: {enabled: true}
      toolGrants:
        drift-specialist: [drift_detection]
      discoverySubjects: [kagent-controller]
      authSecret: {name: mcp-auth-drift-mcp, key: auth-config.json}

# Default to the currently deployed unversioned references. R1 changes these
# two non-secret identifiers in two separate Helm operations: servers first,
# clients second. See docs/llm_agent/g3_credential_lifecycle.md.
mcpCredentialLifecycle:
  serverSet: legacy
  clientRelease: legacy

mcpGateway:
  enabled: true
  replicas: 1
  # Istio Ambient enforces exact caller SPIFFE principals before this pod.
  # The backend service token remains the authoritative per-tool grant because
  # standalone agentgateway does not receive ztunnel identity metadata.
  authorizationMode: ambient-backend-token
  callerServiceAccounts:
    drift-specialist: drift-specialist
    feature-rag-specialist: feature-rag-specialist
  discoveryCallers:
    - {namespace: kagent, serviceAccount: kagent-controller}

a2aGateway:
  enabled: true
  kagentA2A: kagent-controller.kagent.svc.cluster.local:8083
  callerServiceAccounts:
    fraud-coordinator: fraud-coordinator

networkFlows:
  enforced:
    - {name: agentgateway-to-vllm, from: agentgateway, to: vllm, port: 8000}
    # Every agent reaches the LLM only through agentgateway (ModelConfig).
    - {name: fraud-coordinator-to-agentgateway, from: fraud-coordinator, to: agentgateway, port: 4000}
    - {name: drift-specialist-to-agentgateway, from: drift-specialist, to: agentgateway, port: 4000}
    - {name: feature-rag-specialist-to-agentgateway, from: feature-rag-specialist, to: agentgateway, port: 4000}
    # Specialists reach MCP tools only through the MCP Gateway (row 23).
    - {name: drift-specialist-to-mcp-gateway, from: drift-specialist, to: mcp-gateway, port: 8080}
    - {name: feature-rag-specialist-to-mcp-gateway, from: feature-rag-specialist, to: mcp-gateway, port: 8080}
    # The Coordinator reaches specialists only through the A2A Gateway (row 24).
    - {name: fraud-coordinator-to-a2a-gateway, from: fraud-coordinator, to: a2a-gateway, port: 8083}

# kagent namespace is enrolled in the ambient mesh (owned by this campaign),
# so its controller carries a SPIFFE identity.
crossNamespace:
  flows:
    - name: a2a-gateway-to-kagent-controller
      direction: egress
      local: a2a-gateway
      port: 8083
      peer: {namespace: kagent, ambient: true, podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
    - name: fraud-coordinator-to-kagent-controller
      direction: egress
      local: fraud-coordinator
      port: 8083
      peer: {namespace: kagent, ambient: true, podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
    - name: drift-specialist-to-kagent-controller
      direction: egress
      local: drift-specialist
      port: 8083
      peer: {namespace: kagent, ambient: true, podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
    - name: feature-rag-specialist-to-kagent-controller
      direction: egress
      local: feature-rag-specialist
      port: 8083
      peer: {namespace: kagent, ambient: true, podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
    - name: kagent-controller-to-fraud-coordinator
      direction: ingress
      local: fraud-coordinator
      port: 8080
      peer: {namespace: kagent, ambient: true, serviceAccount: kagent-controller, podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
    - name: kagent-controller-to-drift-specialist
      direction: ingress
      local: drift-specialist
      port: 8080
      peer: {namespace: kagent, ambient: true, serviceAccount: kagent-controller, podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
    - name: kagent-controller-to-feature-rag-specialist
      direction: ingress
      local: feature-rag-specialist
      port: 8080
      peer: {namespace: kagent, ambient: true, serviceAccount: kagent-controller, podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
    # kagent controller reconciles RemoteMCPServers through the MCP Gateway (list only).
    - name: kagent-controller-to-mcp-gateway
      direction: ingress
      local: mcp-gateway
      port: 8080
      peer: {namespace: kagent, ambient: true, serviceAccount: kagent-controller, podLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
    # Scoped MLOps access (owner option 2): only feature-rag-mcp, only these ports.
    - name: feature-rag-mcp-to-feast-redis
      direction: egress
      local: feature-rag-mcp
      port: 6379
      peerIngress: true
      peer: {namespace: feature-store, podLabels: {app.kubernetes.io/name: redis}}
    - name: feature-rag-mcp-to-kserve-fraud-detector
      direction: egress
      local: feature-rag-mcp
      port: 8080
      peerIngress: true
      peer: {namespace: fraud-serving, podLabels: {serving.kserve.io/inferenceservice: fraud-detector}}
