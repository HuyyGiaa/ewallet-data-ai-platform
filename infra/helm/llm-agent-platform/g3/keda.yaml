# Opt-in overlay for the KEDA experiment (EDAI-2 rows 19, 22, 25). Layer it after g3.yaml
# only once KEDA is installed and a rebuilt agent image exports the in-flight gauge.
# Rollback: delete the ScaledObjects first, then upgrade without this file. Removing the file
# alone reports success and leaves no HPA. See P4 in the C-B runbook.
agents:
  autoscaling:
    enabled: true
    engine: keda
    keda:
      # Adopt each existing HPA, so autoscaling has no gap. Rollback isn't a plain upgrade:
      # see P4 in the C-B runbook.
      transferHpa: true
