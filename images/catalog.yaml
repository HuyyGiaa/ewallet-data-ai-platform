schema_version: 1
images:
  datahub-lineage-publisher:
    owner: data-platform
    purpose: >-
      Historical: renders the 100GB DP1/DP2/DP3 lineage plan. Superseded as the Docker
      A/B workload by edai1-campaign-verifier; kept because the datahub CI component builds it.
    build_context: .
    dockerfile: images/datahub-publisher/Dockerfile
    functional_contract:
      command: ["--output", "/tmp/lineage-plan.json"]
      expected_flows: 3
      expected_jobs: 4
      expected_datasets: 32
    variants:
      baseline:
        target: baseline
        base: python:3.13.9-bookworm@sha256:f7c7710623c1234f7ebdf4cbb9d1302dc67a552f7a3daa3e655e880df0b9c343
      optimized:
        target: optimized
        base: python:3.13.9-slim-bookworm@sha256:8cdd496996889eef0a8a7921c152c0a4a9f18a26c7a5e7257d3c90b431891894
        controls:
          - multi-stage compile and self-test
          - non-root runtime user
          - no package manager cache or compiler in runtime
          - identical Python version and application source
  edai1-campaign-verifier:
    owner: data-platform
    purpose: >-
      Verify the committed 5GB campaign evidence (checksum chain, identity, 260 rules per
      profile, semantic comparison, Airflow record); the EDAI-1 Docker A/B workload.
    build_context: .
    dockerfiles:
      baseline: images/edai1-campaign-verifier/Dockerfile.baseline
      optimized: images/edai1-campaign-verifier/Dockerfile.optimized
    functional_contract:
      inputs_read_only:
        - docs/evidence/edai1/spark/rehearsal-5gb-ab-20261110225456 -> /input/evidence
        - images/edai1-campaign-verifier/workload-5gb.json -> /input/workload.json
      command: ["--spec", "/input/workload.json", "--evidence-dir", "/input/evidence"]
      expected_verdict: PASS
      equivalence: identical report_sha256 across every variant
    benchmark: python3 -m ops.docker_ab
    variants:
      baseline: {packaging: single-stage-full-context, base: python:3.13.9-bookworm, user: root}
      baseline-slim: {packaging: single-stage-full-context, base: python:3.13.9-slim-bookworm, role: control}
      optimized-full: {packaging: multi-stage-minimal-payload, base: python:3.13.9-bookworm, role: control}
      optimized: {packaging: multi-stage-minimal-payload, base: python:3.13.9-slim-bookworm, user: "65532:65532"}
